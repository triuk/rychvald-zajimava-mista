name: Export Povetrnik 198
on:
  push:
    branches: [agent/import-urbanek-pilot]
    paths:
      - research/urbanek-archive/.export-povetrnik-198
  pull_request:
    types: [synchronize]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch record
        run: |
          mkdir -p out
          python - <<'PY'
          import re, urllib.request
          from pathlib import Path
          url='http://www.povetrnik.cz/vetrne-mlyny/detail/198'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
              data=r.read()
          Path('out/record-198.html').write_bytes(data)
          text=data.decode('utf-8','replace')
          # strip basic tags for readable text
          clean=re.sub(r'<script.*?</script>|<style.*?</style>',' ',text,flags=re.S|re.I)
          clean=re.sub(r'<[^>]+>','\n',clean)
          clean=re.sub(r'\n\s*\n+','\n',clean)
          Path('out/record-198.txt').write_text(clean,'utf-8')
          imgs=re.findall(r'(?:src|href)=["\']([^"\']+\.(?:jpg|jpeg|png))["\']',text,re.I)
          Path('out/image-urls.txt').write_text('\n'.join(dict.fromkeys(imgs)),'utf-8')
          for i,u in enumerate(dict.fromkeys(imgs)):
              if u.startswith('/'):
                  u='http://www.povetrnik.cz'+u
              elif not u.startswith('http'):
                  u='http://www.povetrnik.cz/vetrne-mlyny/detail/'+u
              try:
                  req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      b=r.read()
                  Path(f'out/img-{i:02d}{Path(u.split("?")[0]).suffix or ".jpg"}').write_bytes(b)
              except Exception as e:
                  Path(f'out/img-{i:02d}.error.txt').write_text(str(e),'utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: povetrnik-198
          path: out
