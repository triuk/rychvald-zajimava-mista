name: Sync Povetrnik source records
on:
  push:
    branches: [agent/import-urbanek-pilot]
    paths:
      - research/urbanek-archive/.export-povetrnik-verification
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/import-urbanek-pilot
      - name: Append source records
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('sources/index.yml')
          text = path.read_text('utf-8')
          if 'source_id: web-povetrnik-rychvald-mlynek-48' not in text:
              text += '''
          - source_id: web-povetrnik-rychvald-mlynek-48
            title: Rychvald – větrný mlýnek s turbínou, katalogové číslo mlýnek 48
            document_type: odborna_online_databaze_technickeho_dedictvi
            institution: Povětrník.cz – databáze větrných mlýnů a čerpadel v českých zemích
            url: http://www.povetrnik.cz/vetrne-mlyny/detail/175
            accessed: '2026-07-21'
            time_period:
              from: '1910'
              to: '2026-07-21'
              note: Databáze uvádí vznik přibližně roku 1910; datum přístupu vymezuje stav online záznamu.
            file: null
            page_count: null
            digital_format: HTML
            readability:
              status: good_via_http
              note: Detailová stránka byla načtena přes HTTP; text, mapové souřadnice a základní fotografie byly zkontrolovány.
            visual_content:
              photographs: present
              maps: present
              indexes: not_applicable
              method: Přesné obrazové porovnání základní fotografie databáze s archivním souborem P1010445.JPG.
            missing_pages:
              status: not_applicable
              note: Online databázový záznam nemá stránkování.
            rights:
              status: unclear
              note: Text a fotografie byly použity pouze pro ověření; oprávnění k jejich dalšímu zveřejnění nebylo ověřeno.
            notes:
            - Ověřuje URB-U-0005 jako záznam 175, katalogové číslo mlýnek 48, adresu U Skučáku 54 a GPS 49.8669433, 18.3910689.
            - Opravuje dřívější překonanou inferenci Polní 1275.
          - source_id: web-povetrnik-rychvald-mlynek-49
            title: Rychvald – větrný mlýnek s turbínou, katalogové číslo mlýnek 49
            document_type: odborna_online_databaze_technickeho_dedictvi
            institution: Povětrník.cz – databáze větrných mlýnů a čerpadel v českých zemích
            url: http://www.povetrnik.cz/vetrne-mlyny/detail/176
            accessed: '2026-07-21'
            time_period:
              from: '1901'
              to: '2026-07-21'
              note: Databáze uvádí vznik po roce 1900; datum přístupu vymezuje stav online záznamu.
            file: null
            page_count: null
            digital_format: HTML
            readability:
              status: good_via_http
              note: Detailová stránka byla načtena přes HTTP; text, mapové souřadnice a základní fotografie byly zkontrolovány.
            visual_content:
              photographs: present
              maps: present
              indexes: not_applicable
              method: Základní fotografie databáze byla porovnána s archivním souborem Potoční 564.jpg a shledána jeho oříznutou verzí.
            missing_pages:
              status: not_applicable
              note: Online databázový záznam nemá stránkování.
            rights:
              status: unclear
              note: Text a fotografie byly použity pouze pro ověření; oprávnění k jejich dalšímu zveřejnění nebylo ověřeno.
            notes:
            - Ověřuje URB-U-0004 jako záznam 176, katalogové číslo mlýnek 49, adresu Potoční 564 a GPS 49.8470979, 18.3603469.
          '''
              path.write_text(text, 'utf-8')
          PY
      - name: Commit source index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/index.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Index Povětrník records for Rychvald mills"
          git push origin HEAD:agent/import-urbanek-pilot
