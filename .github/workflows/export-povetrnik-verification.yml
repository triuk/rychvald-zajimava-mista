name: Export Povetrnik verification
on:
  push:
    branches: [agent/import-urbanek-pilot]
    paths:
      - research/urbanek-archive/.export-povetrnik-verification
  pull_request:
    types: [synchronize]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect metadata files
        run: |
          mkdir -p export/research/urbanek-archive/collections
          mkdir -p export/research/urbanek-archive/reports
          mkdir -p export/sources
          cp sources/index.yml export/sources/index.yml
          cp research/urbanek-archive/collections/rychvaldske-vetrne-mlyny.yml export/research/urbanek-archive/collections/
          cp research/urbanek-archive/collections/rychvaldske-vetrne-mlyny-batch-02.yml export/research/urbanek-archive/collections/
          cp research/urbanek-archive/STATUS.md export/research/urbanek-archive/
          cp research/urbanek-archive/state.yml export/research/urbanek-archive/
          cp research/urbanek-archive/reports/pilot-reconciliation.md export/research/urbanek-archive/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: povetrnik-metadata-sync
          path: export
          retention-days: 1
