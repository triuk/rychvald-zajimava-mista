name: Export URB-U-0003 thumbnail
on:
  push:
    branches: [agent/import-urbanek-pilot]
    paths:
      - research/urbanek-archive/.export-urb-u-0003
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/import-urbanek-pilot
      - name: Extract thumbnail and comparison images
        run: |
          set -euo pipefail
          python -m pip install --quiet olefile pillow
          mkdir -p export/comparison
          python - <<'PY'
          from pathlib import Path
          import olefile

          root = Path('sources/osobni-archiv-jaromira-urbanka/Rychvaldské větrné mlýny')
          db = root / 'Thumbs.db'
          out = Path('export/P1010269-thumbnail.jpg')

          ole = olefile.OleFileIO(str(db))
          candidates = []
          for entry in ole.listdir(streams=True, storages=False):
              name = '/'.join(entry)
              data = ole.openstream(entry).read()
              start = data.find(b'\xff\xd8')
              end = data.rfind(b'\xff\xd9')
              if start >= 0 and end > start:
                  jpeg = data[start:end+2]
                  candidates.append((name, jpeg))
          ole.close()

          # Audit určil odpovídající stream ID 4; preferuj jej.
          chosen = None
          for name, jpeg in candidates:
              if name == '4' or name.endswith('/4'):
                  chosen = (name, jpeg)
                  break
          if chosen is None:
              raise SystemExit(f'Stream 4 not found; JPEG streams: {[n for n,_ in candidates]}')
          out.write_bytes(chosen[1])
          print(f'extracted {chosen[0]} -> {out} ({len(chosen[1])} bytes)')

          # Kořenové obrázky pro lokální obrazové porovnání.
          for p in root.iterdir():
              if p.is_file() and p.suffix.lower() in {'.jpg', '.jpeg', '.png'}:
                  (Path('export/comparison') / p.name).write_bytes(p.read_bytes())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: urb-u-0003-thumbnail
          path: export
          retention-days: 1
