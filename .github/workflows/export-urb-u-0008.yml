name: Export URB-U-0008 image
on:
  push:
    branches: [agent/import-urbanek-pilot]
    paths:
      - research/urbanek-archive/.export-urb-u-0008
  pull_request:
    types: [synchronize]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/import-urbanek-pilot
      - name: Export image
        run: |
          mkdir -p export
          cp 'sources/osobni-archiv-jaromira-urbanka/Rychvaldské větrné mlýny/Větrný mlýn.jpg' export/
      - uses: actions/upload-artifact@v4
        with:
          name: urb-u-0008-image
          path: export
          retention-days: 1
