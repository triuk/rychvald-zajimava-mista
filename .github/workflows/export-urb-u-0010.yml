name: Export URB-U-0010 images
on:
  push:
    branches: [agent/import-urbanek-pilot]
    paths:
      - research/urbanek-archive/.export-urb-u-0010
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/import-urbanek-pilot
      - name: Export images
        run: |
          mkdir -p export
          cp "sources/osobni-archiv-jaromira-urbanka/Rychvaldské větrné mlýny/Mlýn u domku č. pop. 339/img605.jpg" export/
          cp "sources/osobni-archiv-jaromira-urbanka/Rychvaldské větrné mlýny/Mlýn u domku č. pop. 339/img603.jpg" export/
          cp "sources/osobni-archiv-jaromira-urbanka/Rychvaldské větrné mlýny/Mlýn u domku č. pop. 339/img604.jpg" export/
      - uses: actions/upload-artifact@v4
        with:
          name: urb-u-0010-images
          path: export/
          retention-days: 1
