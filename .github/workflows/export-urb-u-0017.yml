name: Export URB-U-0017 images
on:
  push:
    branches: [agent/import-urbanek-pilot]
    paths:
      - research/urbanek-archive/.export-urb-u-0017
  pull_request:
    types: [synchronize]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/import-urbanek-pilot
      - uses: actions/upload-artifact@v4
        with:
          name: urb-u-0017-images
          path: |
            sources/osobni-archiv-jaromira-urbanka/Články z Českého slova/7.jpg
            sources/osobni-archiv-jaromira-urbanka/Články z Českého slova/8.jpg
            sources/osobni-archiv-jaromira-urbanka/Články z Českého slova/9.jpg
            sources/osobni-archiv-jaromira-urbanka/Články z Českého slova/10.jpg
