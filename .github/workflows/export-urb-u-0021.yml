name: Export URB-U-0021 sources
on:
  push:
    branches: [agent/import-urbanek-pilot]
    paths:
      - research/urbanek-archive/.export-urb-u-0021
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Search Kramerius metadata for the correct issue
        shell: bash
        run: |
          mkdir -p out/archive out/kramerius
          cp 'sources/osobni-archiv-jaromira-urbanka/Články z Českého slova/21.jpg' out/archive/
          python - <<'PY'
          import json, urllib.request, urllib.parse
          from pathlib import Path

          headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'}
          queries=[
            'root_title:"České slovo : ústřední orgán České strany národně sociální" AND rok:1938',
            'root_title:"České slovo" AND rok:1938',
            '"České slovo" AND rok:1938',
            'rok:1938 AND fedora.model:periodicalitem',
            'rok:1938 AND dc.title:281',
            'rok:1938 AND title:281',
            'rok:1938 AND datum_str:1938',
          ]
          results=[]
          for i,q in enumerate(queries):
            url='https://kramerius5.nkp.cz/search/api/v5.0/search?'+urllib.parse.urlencode({'q':q,'rows':1000})
            entry={'index':i,'query':q,'url':url}
            try:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=120) as r:
                data=r.read(); entry['status']=r.status; entry['bytes']=len(data)
              Path(f'out/kramerius/query-{i:02d}.json').write_bytes(data)
            except Exception as e:
              entry['error']=repr(e)
            results.append(entry)
          Path('out/kramerius/queries.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),'utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: urb-u-0021-sources
          path: out
