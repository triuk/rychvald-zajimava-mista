name: Export URB-U-0021 sources
on:
  push:
    branches: [agent/import-urbanek-pilot]
    paths:
      - research/urbanek-archive/.export-urb-u-0021
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fetch archive image and Kramerius page 2
        shell: bash
        run: |
          mkdir -p out/archive out/kramerius
          cp 'sources/osobni-archiv-jaromira-urbanka/Články z Českého slova/21.jpg' out/archive/
          python - <<'PY'
          import json, re, urllib.request, urllib.parse
          from pathlib import Path

          BASE='https://kramerius.nkp.cz'
          headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'}
          viewer_url=f'{BASE}/kramerius/PShowPageDoc.do?it=0&id=8051962&picp=&idpi=13916277'
          req=urllib.request.Request(viewer_url,headers=headers)
          with urllib.request.urlopen(req,timeout=120) as r:
            html=r.read()
          Path('out/kramerius/viewer.html').write_bytes(html)
          text=html.decode('utf-8','replace')
          m=re.search(r'["\'](/kramerius/document/[^"\']+?\.djvu[^"\']*)["\']',text,re.I)
          if not m:
            raise SystemExit('DjVu document link not found')
          djvu_url=urllib.parse.urljoin(BASE,m.group(1).replace('&amp;','&'))
          req=urllib.request.Request(djvu_url,headers=headers)
          with urllib.request.urlopen(req,timeout=180) as r:
            data=r.read()
          Path('out/kramerius/page2.djvu').write_bytes(data)
          Path('out/kramerius/source.json').write_text(json.dumps({'viewer_url':viewer_url,'djvu_url':djvu_url,'bytes':len(data)},ensure_ascii=False,indent=2),'utf-8')
          PY
      - name: Convert DjVu to PNG
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq djvulibre-bin
          ddjvu -format=png out/kramerius/page2.djvu out/kramerius/page2.png
          file out/kramerius/page2.png
      - uses: actions/upload-artifact@v4
        with:
          name: urb-u-0021-sources
          path: out
