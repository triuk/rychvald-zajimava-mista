name: Export URB-U-0021 sources
on:
  push:
    branches: [agent/import-urbanek-pilot]
    paths:
      - research/urbanek-archive/.export-urb-u-0021
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Collect archive image and Kramerius page viewer
        shell: bash
        run: |
          mkdir -p out/archive out/kramerius
          cp 'sources/osobni-archiv-jaromira-urbanka/Články z Českého slova/21.jpg' out/archive/
          python - <<'PY'
          import json, re, urllib.request, urllib.parse
          from pathlib import Path

          BASE='https://kramerius.nkp.cz'
          headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'}
          log=[]

          def fetch(url, path):
            try:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=120) as r:
                data=r.read(); ctype=r.headers.get('content-type',''); status=r.status
              Path(path).write_bytes(data)
              log.append({'url':url,'status':status,'content_type':ctype,'bytes':len(data),'file':str(path)})
              return data
            except Exception as e:
              log.append({'url':url,'error':repr(e),'file':str(path)})
              return b''

          # Page 2 of the 8-page Prague morning edition, 12 October 1938, issue 281.
          page_id='8051962'
          idpi='13916277'
          page_url=f'{BASE}/kramerius/PShowPage.do?id={page_id}&it=0'
          pdata=fetch(page_url,'out/kramerius/page.html')
          viewer_url=f'{BASE}/kramerius/PShowPageDoc.do?it=0&id={page_id}&picp=&idpi={idpi}'
          vdata=fetch(viewer_url,'out/kramerius/viewer.html')
          vtext=vdata.decode('utf-8','replace')

          candidates=[]
          for value in re.findall(r'(?:href|src|value)=["\']([^"\']+)["\']',vtext,re.I):
            value=value.replace('&amp;','&')
            if any(k in value.lower() for k in ('djvu','image','img','stream','zoom','getfile','getimage')):
              candidates.append(urllib.parse.urljoin(BASE,value))
          Path('out/kramerius/viewer-links.json').write_text(json.dumps(list(dict.fromkeys(candidates)),ensure_ascii=False,indent=2),'utf-8')

          for i,url in enumerate(list(dict.fromkeys(candidates))):
            fetch(url,f'out/kramerius/candidate-{i:02d}.bin')

          Path('out/kramerius/requests.json').write_text(json.dumps(log,ensure_ascii=False,indent=2),'utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: urb-u-0021-sources
          path: out
