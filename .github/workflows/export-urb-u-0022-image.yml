name: Export URB-U-0022 image
on:
  push:
    branches: [agent/import-urbanek-pilot]
    paths:
      - research/urbanek-archive/.export-urb-u-0022
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/import-urbanek-pilot
      - name: Collect source image
        run: |
          mkdir -p out
          cp 'sources/osobni-archiv-jaromira-urbanka/Články z Českého slova/33.jpg' out/
      - uses: actions/upload-artifact@v4
        with:
          name: urb-u-0022-image
          path: out/33.jpg
