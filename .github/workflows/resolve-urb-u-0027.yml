          p = root / 'uncertainties/open-02b.yml'
          lines = p.read_text('utf-8').splitlines()
          lines = [ln for ln in lines if 'id: URB-U-0027' not in ln]
          text = '\n'.join(lines) + '\n'
          text = text.replace('scope: open_items_0027_0032', 'scope: open_items_0028_0032')
          p.write_text(text, 'utf-8')

