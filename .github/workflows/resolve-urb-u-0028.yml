name: Resolve URB-U-0028
on:
  push:
    branches: [agent/import-urbanek-pilot]
    paths:
      - research/urbanek-archive/.resolve-urb-u-0028
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/import-urbanek-pilot
      - name: Record resolution
        run: |
          python research/urbanek-archive/resolve-urb-u-0028.py
          rm -f research/urbanek-archive/.resolve-urb-u-0028
          rm -f research/urbanek-archive/resolve-urb-u-0028.py
          rm -f .github/workflows/resolve-urb-u-0028.yml
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Resolve URB-U-0028 as Olivie"
          git push origin HEAD:agent/import-urbanek-pilot
