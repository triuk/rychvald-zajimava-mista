name: Search Kakal sources
on:
  push:
    branches: [agent/import-urbanek-pilot]
    paths:
      - research/urbanek-archive/.search-kakal
  pull_request:
    types: [synchronize]
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/import-urbanek-pilot
      - name: Search text and PDF layers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          mkdir -p out/pdftext
          {
            echo '## TEXT FILE MATCHES'
            grep -RniE --binary-files=without-match 'Kakal|Kakał|Kakalův|Kakaluv' . \
              --exclude-dir=.git --exclude='*.pdf' --exclude='*.jpg' --exclude='*.JPG' --exclude='*.png' --exclude='*.db' || true
            echo
            echo '## PDF MATCHES'
            find sources -type f -iname '*.pdf' -print0 | while IFS= read -r -d '' f; do
              safe=$(echo "$f" | sha256sum | cut -d' ' -f1)
              pdftotext -layout "$f" "out/pdftext/$safe.txt" 2>/dev/null || continue
              if grep -niE 'Kakal|Kakał|Kakalův|Kakaluv' "out/pdftext/$safe.txt" >/tmp/matches; then
                echo "FILE: $f"
                cat /tmp/matches
                echo
              fi
            done
          } > out/results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kakal-source-search
          path: out/results.txt
          retention-days: 1
