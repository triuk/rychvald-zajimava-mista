name: Search Vaclav Valek
on:
  pull_request:
    types: [synchronize]
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/import-urbanek-pilot
      - name: Search text and filenames
        run: |
          mkdir -p out
          python - <<'PY'
          from pathlib import Path
          import re
          patterns = [re.compile(p, re.I) for p in [r'Václav\s+Válek', r'Vaclav\s+Valek', r'V\.\s*Válek', r'Válek', r'Valek']]
          lines=[]
          for p in Path('.').rglob('*'):
              if '.git' in p.parts or p.is_dir():
                  continue
              name=str(p)
              if any(rx.search(name) for rx in patterns):
                  lines.append(f'FILENAME\t{name}')
              try:
                  if p.stat().st_size > 5_000_000:
                      continue
                  data=p.read_bytes()
                  if b'\x00' in data[:4096]:
                      continue
                  text=data.decode('utf-8','ignore')
              except Exception:
                  continue
              for n,line in enumerate(text.splitlines(),1):
                  if any(rx.search(line) for rx in patterns):
                      lines.append(f'TEXT\t{name}:{n}\t{line}')
          Path('out/results.txt').write_text('\n'.join(lines) if lines else 'NO_MATCHES','utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vaclav-valek-search
          path: out/results.txt
