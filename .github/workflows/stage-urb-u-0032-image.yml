name: Stage URB-U-0032 image
on:
  push:
    branches: [agent/import-urbanek-pilot]
    paths:
      - .github/workflows/stage-urb-u-0032-image.yml
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/import-urbanek-pilot
      - name: Stage Base64 chunks
        run: |
          set -e
          out="research/urbanek-archive/tmp/urb-u-0032"
          rm -rf "$out"
          mkdir -p "$out"
          base64 -w 0 "sources/osobni-archiv-jaromira-urbanka/Ochotníci rychvald/Svět v obrazech.jpg" > "$out/all.b64"
          split -b 700000 -d -a 2 "$out/all.b64" "$out/part-"
          rm "$out/all.b64"
          find "$out" -maxdepth 1 -name 'part-*' -printf '%f\n' | sort > "$out/manifest.txt"
          wc -c "sources/osobni-archiv-jaromira-urbanka/Ochotníci rychvald/Svět v obrazech.jpg" > "$out/source-bytes.txt"
          rm -f .github/workflows/stage-urb-u-0032-image.yml
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stage URB-U-0032 image for review"
          git push origin HEAD:agent/import-urbanek-pilot
