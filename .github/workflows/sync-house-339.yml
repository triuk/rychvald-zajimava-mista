name: Sync house 339 verification
on:
  push:
    branches: [agent/import-urbanek-pilot]
    paths:
      - research/urbanek-archive/.sync-house-339
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/import-urbanek-pilot
      - name: Synchronize metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('research/urbanek-archive/collections/rychvaldske-vetrne-mlyny-batch-03.yml')
          s=p.read_text('utf-8')
          old='''    identification:\n      status: partially_verified\n      candidate_name: mlýnek za domem č. 339\n      candidate_basis: handwritten_note_in_document\n      note: Číslo domu je čitelné, ale místo, autor a datace náčrtu nejsou uvedeny.\n'''
          new='''    identification:\n      status: verified_document_group\n      verified_name: mlýnek za domem č. 339\n      basis: [handwritten_note_in_document, user_confirmation, visual_comparison]\n      related_ids: [urbanek-mlyny-037, urbanek-mlyny-038]\n      verification: research/urbanek-archive/verifications/urb-u-0010-house-339-device-group.md\n      linked_open_item: URB-U-0038\n      current_address_candidate:\n        address: "Bohumínská 339, 735 32 Rychvald"\n        parcel: "st. 548"\n        coordinates: [49.8707364, 18.3753053]\n        status: unverified_historical_continuity\n      note: Dokumentační celek je ověřen, přesná historická poloha zůstává otevřená.\n'''
          if old not in s: raise SystemExit('036 identification block not found')
          s=s.replace(old,new,1)

          old='''    identification:\n      status: unverified\n      candidate_name: mlýn u domku č. pop. 339\n      candidate_basis: parent_folder_and_related_sketch\n      note: Přímá vazba na číslo 339 nebyla na fotografii doložena.\n'''
          new='''    identification:\n      status: verified_document_group\n      verified_name: mlýnek za domem č. 339\n      basis: [user_confirmation, visual_comparison, related_handwritten_sketch]\n      related_ids: [urbanek-mlyny-036, urbanek-mlyny-038]\n      verification: research/urbanek-archive/verifications/urb-u-0010-house-339-device-group.md\n      linked_open_item: URB-U-0038\n      note: Fotografie patří k témuž zařízení jako náčrt; přesná historická poloha zůstává otevřená.\n'''
          if s.count(old) != 2: raise SystemExit(f'expected two photo blocks, found {s.count(old)}')
          s=s.replace(old,new,1)
          new2=new.replace('related_ids: [urbanek-mlyny-036, urbanek-mlyny-038]','related_ids: [urbanek-mlyny-036, urbanek-mlyny-037]')
          s=s.replace(old,new2,1)
          s=s.replace('  - Náčrt 036, fotografie 037 a 038 pravděpodobně tvoří dokumentační soubor jednoho zařízení, ale vazba na dům č. 339 musí být ověřena jiným pramenem.\n','  - Uživatel potvrdil, že náčrt 036 a fotografie 037–038 zachycují stejné zařízení označené v náčrtu jako mlýnek za domem č. 339; přesná historická poloha je vedena v URB-U-0038.\n')
          p.write_text(s,'utf-8')

          p=Path('research/urbanek-archive/STATUS.md'); s=p.read_text('utf-8')
          s=s.replace('- `resolved`: 20;', '- `resolved`: 21;', 1)
          s=s.replace('- celkem: 37.', '- celkem: 38.', 1)
          marker='`URB-U-0009` byla uzavřena pouze pro identifikaci snímku jako interiéru kostela sv. Anny v Rychvaldě. Význam čísla `304` a důvod uložení ve složce Kakalova mlýna zůstávají otevřeny jako `URB-U-0037`.\n'
          add=marker+'\n`URB-U-0010` byla uzavřena pro vztah náčrtu a dvou fotografií k jednomu mlýnku označenému jako zařízení za domem č. 339. Přesná historická poloha, kontinuita čísla domu, vlastník a datace zůstávají otevřeny jako `URB-U-0038`; dnešní Bohumínská 339 je pouze kandidát.\n'
          if marker in s and 'URB-U-0038' not in s:
              s=s.replace(marker,add,1)
          p.write_text(s,'utf-8')

          p=Path('research/urbanek-archive/state.yml'); s=p.read_text('utf-8')
          s=s.replace('summary: {open: 16, in_progress: 0, deferred: 0, resolved: 20, not_actionable: 1, total: 37}','summary: {open: 16, in_progress: 0, deferred: 0, resolved: 21, not_actionable: 1, total: 38}',1)
          marker='''    - id: URB-U-0009\n      result: rychvald_saint_anne_church_interior_verified\n      evidence: research/urbanek-archive/verifications/urb-u-0009-kostel-svate-anny.md\n      linked_open_item: URB-U-0037\n'''
          add=marker+'''    - id: URB-U-0010\n      result: house_339_windmill_sketch_and_photos_same_device_verified\n      evidence: research/urbanek-archive/verifications/urb-u-0010-house-339-device-group.md\n      linked_open_item: URB-U-0038\n'''
          if marker in s and 'result: house_339_windmill_sketch_and_photos_same_device_verified' not in s:
              s=s.replace(marker,add,1)
          marker2='''    - id: URB-U-0037\n      subject: archivní kontext fotografie kostela sv. Anny\n      unresolved: [folder_relation, meaning_of_304, possible_house_or_person_reference]\n      revisit_after: [new_archive_batch, new_caption, house_number_304_reference, Kakal_family_church_relation]\n'''
          add2=marker2+'''    - id: URB-U-0038\n      subject: mlýnek za domem č. 339\n      unresolved: [exact_historical_location, house_number_continuity, owner_identity, construction_date, disappearance_date, technology]\n      candidate_current_location: "Bohumínská 339, parcela st. 548"\n      revisit_after: [new_archive_batch, historical_map, aerial_photo, address_record, matching_landscape_photo]\n'''
          if marker2 in s and 'subject: mlýnek za domem č. 339' not in s:
              s=s.replace(marker2,add2,1)
          marker3='    - church interior is identified, but filename 304 and folder relation remain open in URB-U-0037\n'
          if marker3 in s and 'URB-U-0038' not in s[s.find('known_non_blocking_issues:'):]:
              s=s.replace(marker3,marker3+'    - house 339 windmill document group is verified, but exact historical location remains open in URB-U-0038\n',1)
          p.write_text(s,'utf-8')

          p=Path('research/urbanek-archive/reports/pilot-reconciliation.md'); s=p.read_text('utf-8')
          s=s.replace('- `resolved`: 20;', '- `resolved`: 21;', 1)
          s=s.replace('- celkem: 37.', '- celkem: 38.', 1)
          marker='`URB-U-0009` je uzavřena pro identitu fotografie jako interiér kostela sv. Anny v Rychvaldě. Význam čísla `304` a vztah ke složce Kakalova mlýna jsou vedeny v propojené otevřené položce `URB-U-0037`.\n'
          add=marker+'\n`URB-U-0010` je uzavřena pro dokumentační vztah náčrtu a fotografií k jednomu zařízení. Přesná historická poloha mlýnku označeného jako zařízení za domem č. 339 zůstává v propojené otevřené položce `URB-U-0038`.\n'
          if marker in s and 'URB-U-0038' not in s:
              s=s.replace(marker,add,1)
          p.write_text(s,'utf-8')

          p=Path('sources/index.yml'); s=p.read_text('utf-8')
          entries='''\n- source_id: web-ruian-rychvald-bohuminska-339\n  title: Adresní místo Bohumínská 339, Rychvald\n  document_type: official_address_register\n  institution: RÚIAN / VDP\n  url: https://2z3yffk.257.cz/vdp/ruian/adresnimista?cisDom=&cisOr=&kodOb=599107&kodVo=2961&nespravny=&ohradaId=&page=4&pscAp=&search=&sort=&typSo=\n  accessed: '2026-07-21'\n  digital_format: HTML\n  rights:\n    status: official_public_data\n  notes:\n    - Potvrzuje současné adresní místo č.p. 339 v ulici Bohumínská a kód adresního místa 14232618.\n    - Nepotvrzuje historickou polohu mlýnku.\n\n- source_id: web-csu-rso-rychvald-339\n  title: Stavební objekt Rychvald č.p. 339\n  document_type: official_building_register\n  institution: Český statistický úřad – Registr sčítacích obvodů a budov\n  url: https://apl2.czso.cz/irso4/budlist.jsp?b=21&hkodcis=51&kod=599107&kodcis=51&kodpol=nnnnnn&stranka=2&trideni=4\n  accessed: '2026-07-21'\n  digital_format: HTML\n  rights:\n    status: official_public_data\n  notes:\n    - Uvádí stavební objekt č.p. 339, ulici Bohumínská, kód RÚIAN 14141329 a kód RSO 1023646226.\n\n- source_id: web-finance-rychvald-bohuminska-339\n  title: Bohumínská 339, Rychvald – základní údaje a souřadnice\n  document_type: derived_public_register_page\n  institution: Finance.cz\n  url: https://rejstriky.finance.cz/adresa-rychvald-bohuminska-339-0-14232618\n  accessed: '2026-07-21'\n  digital_format: HTML\n  rights:\n    status: unclear\n  notes:\n    - Uvádí souřadnice adresního místa 49.870736388889, 18.375305277778.\n    - Použito pouze jako lokalizační kandidát pro URB-U-0038.\n\n- source_id: web-povetrnik-horni-datyne-record-198\n  title: Vratimov – Horní Datyně, replika mlýnku z U Školky 344\n  document_type: specialist_online_database\n  institution: Povětrník.cz\n  url: http://www.povetrnik.cz/vetrne-mlyny/detail/198\n  accessed: '2026-07-21'\n  digital_format: HTML\n  rights:\n    status: unclear\n  notes:\n    - Záznam byl prověřen a vyloučen jako identifikace mlýnku u č.p. 339.\n    - Týká se repliky podle jiného rychvaldského mlýnku z U Školky 344.\n'''
          if 'source_id: web-ruian-rychvald-bohuminska-339' not in s:
              s += entries
          p.write_text(s,'utf-8')
          PY
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/urbanek-archive/collections/rychvaldske-vetrne-mlyny-batch-03.yml research/urbanek-archive/STATUS.md research/urbanek-archive/state.yml research/urbanek-archive/reports/pilot-reconciliation.md sources/index.yml
          git commit -m "Sync house 339 windmill verification" || exit 0
          git push origin HEAD:agent/import-urbanek-pilot
