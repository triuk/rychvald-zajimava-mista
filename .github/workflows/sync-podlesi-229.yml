name: Sync Podlesi 229 metadata
on:
  push:
    branches: [agent/import-urbanek-pilot]
    paths:
      - research/urbanek-archive/.sync-podlesi-229
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/import-urbanek-pilot
      - name: Update metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('research/urbanek-archive/collections/rychvaldske-vetrne-mlyny.yml')
          s=p.read_text('utf-8')
          old='''    identification:\n      status: unverified\n      candidate_name: mlýn na Podlesí\n      candidate_basis: original_filename\n      note: Název a lokalizace vycházejí pouze z názvu souboru.\n'''
          new='''    identification:\n      status: verified\n      verified_name: větrný mlýnek s turbínou\n      archival_name: mlýn na Podlesí\n      verified_location: "U Školky 344, 735 32 Rychvald"\n      coordinates: [49.8516111, 18.3718333]\n      basis: [exact_visual_match_with_povetrnik_record, user_confirmation]\n      external_catalog:\n        database: Povětrník\n        record_id: 229\n        url: http://www.povetrnik.cz/vetrne-mlyny/detail/229\n      duplicate_thumbnail_name: P1010269.JPG\n      verification: research/urbanek-archive/verifications/urb-u-0003-0006-podlesi-povetrnik-229.md\n'''
          if old not in s: raise SystemExit('classification block not found')
          s=s.replace(old,new,1)
          s=s.replace('  - Ověřit lokalizaci a název objektu označeného souborem mlýn na podlesí.JPG.\n','')
          p.write_text(s,'utf-8')

          p=Path('sources/index.yml'); s=p.read_text('utf-8')
          if 'source_id: web-povetrnik-rychvald-u-skolky-344' not in s:
              s += '''\n- source_id: web-povetrnik-rychvald-u-skolky-344\n  title: Rychvald – větrný mlýnek s turbínou U Školky 344\n  document_type: odborna_online_databaze_technickeho_dedictvi\n  institution: Povětrník.cz – databáze větrných mlýnů a čerpadel v českých zemích\n  url: http://www.povetrnik.cz/vetrne-mlyny/detail/229\n  accessed: '2026-07-21'\n  time_period:\n    from: '1901'\n    to: '2026-07-21'\n    note: Databáze uvádí vznik po roce 1900 a rozebrání v roce 2014.\n  file: null\n  page_count: null\n  digital_format: HTML\n  readability:\n    status: good_via_http\n    note: Text, GPS a základní fotografie byly zkontrolovány.\n  visual_content:\n    photographs: present\n    maps: present\n    indexes: not_applicable\n    method: Základní fotografie byla porovnána s archivním souborem mlýn na podlesí.JPG.\n  missing_pages:\n    status: not_applicable\n  rights:\n    status: unclear\n    note: Záznam a fotografie byly použity pouze k ověření.\n  notes:\n    - Ověřuje URB-U-0006 jako adresu U Školky 344 a GPS 49.8516111, 18.3718333.\n    - Potvrzuje, že náhled P1010269.JPG odpovídá dochovanému souboru mlýn na podlesí.JPG.\n'''
          p.write_text(s,'utf-8')

          replacements = {
            'research/urbanek-archive/STATUS.md': [
              ('**12 chybějících plných originálů**','**11 chybějících plných originálů**'),
              ('- 1 v kolekci Rychvaldské větrné mlýny;','- 0 v kolekci Rychvaldské větrné mlýny;'),
              ('- `open`: 18;','- `open`: 16;'),
              ('- `resolved`: 16;','- `resolved`: 18;'),
            ],
            'research/urbanek-archive/state.yml': [
              ('missing_full_original_images_known_only_from_thumbnail_caches: 12','missing_full_original_images_known_only_from_thumbnail_caches: 11'),
              ('missing_full_original_images_known_only_from_cache: 1\n    reports:\n      - research/urbanek-archive/reports/rychvaldske-vetrne-mlyny-thumbnail-cache.md','missing_full_original_images_known_only_from_cache: 0\n    reports:\n      - research/urbanek-archive/reports/rychvaldske-vetrne-mlyny-thumbnail-cache.md'),
              ('summary: {open: 18, in_progress: 0, deferred: 0, resolved: 16, not_actionable: 1, total: 35}','summary: {open: 16, in_progress: 0, deferred: 0, resolved: 18, not_actionable: 1, total: 35}'),
              ('twelve full original images are missing; only thumbnails remain in caches','eleven full original images are missing; only thumbnails remain in caches'),
            ],
            'research/urbanek-archive/reports/pilot-reconciliation.md': [
              ('**12 chybějících plných originálů**','**11 chybějících plných originálů**'),
              ('| Rychvaldské větrné mlýny | 1 | `P1010269.JPG` |','| Rychvaldské větrné mlýny | 0 | `P1010269.JPG` je duplicitní náhled dochovaného souboru |'),
              ('| **Celkem** | **12** | náhledy nejsou náhradou plných originálů |','| **Celkem** | **11** | náhledy nejsou náhradou plných originálů |'),
              ('- `open`: 18;','- `open`: 16;'),
              ('- `resolved`: 16;','- `resolved`: 18;'),
              ('1. dvanáct plných originálů chybí;','1. jedenáct plných originálů chybí;'),
            ],
          }
          for fn,repls in replacements.items():
              p=Path(fn); s=p.read_text('utf-8')
              for a,b in repls:
                  if a in s: s=s.replace(a,b,1)
              p.write_text(s,'utf-8')
          PY
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/urbanek-archive/collections/rychvaldske-vetrne-mlyny.yml sources/index.yml research/urbanek-archive/STATUS.md research/urbanek-archive/state.yml research/urbanek-archive/reports/pilot-reconciliation.md
          git commit -m "Sync Podlesi mill verification" || exit 0
          git push origin HEAD:agent/import-urbanek-pilot
