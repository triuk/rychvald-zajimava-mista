name: Sync URB-U-0017 status
on:
  push:
    branches: [agent/import-urbanek-pilot]
    paths:
      - research/urbanek-archive/.sync-urb-u-0017
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/import-urbanek-pilot
      - name: Synchronize status files
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('research/urbanek-archive/STATUS.md'); s=p.read_text('utf-8')
          s=s.replace('- `open`: 15;', '- `open`: 14;', 1)
          s=s.replace('- `not_actionable`: 1;', '- `not_actionable`: 2;', 1)
          marker='`URB-U-0011` byla uzavřena jako chybně zařazená přesná kopie obrazu Kakalova mlýna ve složce domu č. 339. Jde o jiný objekt a soubor se nepoužívá jako doklad k mlýnku u č.p. 339; původní archivní cesta se zachovává.\n'
          add=marker+'\n`URB-U-0017` byla označena jako `not_actionable`: úzký proužek nad článkem v souboru `9.jpg` je pouze spodní okraj předchozího článku zachycený na fotografii navíc. Není součástí cílového výstřižku ani samostatným předmětem OCR či identifikace.\n'
          if marker in s and '`URB-U-0017` byla označena' not in s:
              s=s.replace(marker,add,1)
          p.write_text(s,'utf-8')

          p=Path('research/urbanek-archive/state.yml'); s=p.read_text('utf-8')
          s=s.replace('summary: {open: 15, in_progress: 0, deferred: 0, resolved: 22, not_actionable: 1, total: 38}', 'summary: {open: 14, in_progress: 0, deferred: 0, resolved: 22, not_actionable: 2, total: 38}', 1)
          marker='''    - id: URB-U-0011\n      result: kakal_mill_copy_in_house_339_folder_confirmed_misfiled\n      evidence: research/urbanek-archive/verifications/urb-u-0011-misfiled-kakal-copy.md\n'''
          add=marker+'''  not_actionable_items:\n    - id: URB-U-0017\n      result: incidental_previous_article_edge_excluded_from_clipping_scope\n      evidence: research/urbanek-archive/ocr/urbanek-ceske-slovo-010-b-document-text.md\n'''
          if marker in s and 'incidental_previous_article_edge_excluded_from_clipping_scope' not in s:
              s=s.replace(marker,add,1)
          p.write_text(s,'utf-8')

          p=Path('research/urbanek-archive/reports/pilot-reconciliation.md'); s=p.read_text('utf-8')
          s=s.replace('- `open`: 15;', '- `open`: 14;', 1)
          s=s.replace('- `not_actionable`: 1;', '- `not_actionable`: 2;', 1)
          marker='`URB-U-0011` je uzavřena jako chybně zařazená přesná kopie obrazu Kakalova mlýna. Nezachycuje mlýnek za domem č. 339 a soubor se nepoužívá jako doklad k tomuto zařízení; původní archivní cesta zůstává zachována.\n'
          add=marker+'\n`URB-U-0017` je `not_actionable`: spodní okraj předchozího článku je na fotografii `9.jpg` pouze vedlejším obsahem mimo rozsah cílového výstřižku a dále se neidentifikuje ani nepřepisuje.\n'
          if marker in s and '`URB-U-0017` je `not_actionable`' not in s:
              s=s.replace(marker,add,1)
          p.write_text(s,'utf-8')
          PY
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/urbanek-archive/STATUS.md research/urbanek-archive/state.yml research/urbanek-archive/reports/pilot-reconciliation.md
          git commit -m "Sync incidental fragment status" || exit 0
          git push origin HEAD:agent/import-urbanek-pilot
