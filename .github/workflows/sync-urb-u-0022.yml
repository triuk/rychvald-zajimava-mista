name: Sync URB-U-0022 closure
on:
  push:
    branches: [agent/import-urbanek-pilot]
    paths:
      - research/urbanek-archive/.sync-urb-u-0022
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/import-urbanek-pilot
      - name: Update summary files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = {
            'research/urbanek-archive/STATUS.md': [
              ('- `open`: 12;', '- `open`: 11;'),
              ('- `resolved`: 24;', '- `resolved`: 25;'),
              ('`URB-U-0021` byla uzavřena jako známá ořezová lakuna článku „Polský zábor českých obcí dokončen“. Fotografie zachycuje pouze horní část novinové strany; chybějící spodní části sloupců zůstávají označeny a nesmějí být rekonstruovány odhadem.\n',
               '`URB-U-0021` byla uzavřena jako známá ořezová lakuna článku „Polský zábor českých obcí dokončen“. Fotografie zachycuje pouze horní část novinové strany; chybějící spodní části sloupců zůstávají označeny a nesmějí být rekonstruovány odhadem.\n\n`URB-U-0022` byla uzavřena jako známá fyzická lakuna ve výstřižku `33.jpg`. Několik zničených řádků zůstává výslovně označeno a nesmí být rekonstruováno odhadem.\n')
            ],
            'research/urbanek-archive/state.yml': [
              ('summary: {open: 12, in_progress: 0, deferred: 0, resolved: 24, not_actionable: 2, total: 38}',
               'summary: {open: 11, in_progress: 0, deferred: 0, resolved: 25, not_actionable: 2, total: 38}'),
              ('    - id: URB-U-0021\n      result: known_cropping_lacuna_closed\n      evidence: research/urbanek-archive/ocr/urbanek-ceske-slovo-022-a-document-text.md\n',
               '    - id: URB-U-0021\n      result: known_cropping_lacuna_closed\n      evidence: research/urbanek-archive/ocr/urbanek-ceske-slovo-022-a-document-text.md\n    - id: URB-U-0022\n      result: known_physical_lacuna_closed\n      evidence: research/urbanek-archive/ocr/urbanek-ceske-slovo-035-document-text.md\n')
            ],
            'research/urbanek-archive/reports/pilot-reconciliation.md': [
              ('- `open`: 12;', '- `open`: 11;'),
              ('- `resolved`: 24;', '- `resolved`: 25;'),
              ('`URB-U-0021` je uzavřena jako známá ořezová lakuna. Archivní fotografie zachycuje pouze horní část novinové strany; chybějící spodní části sloupců zůstávají výslovně označeny a nejsou rekonstruovány.\n',
               '`URB-U-0021` je uzavřena jako známá ořezová lakuna. Archivní fotografie zachycuje pouze horní část novinové strany; chybějící spodní části sloupců zůstávají výslovně označeny a nejsou rekonstruovány.\n\n`URB-U-0022` je uzavřena jako známá fyzická lakuna ve výstřižku `33.jpg`. Veškerý dochovaný text je přepsán a několik zničených řádků zůstává označeno bez odhadované rekonstrukce.\n')
            ],
          }

          for filename, replacements in files.items():
              path = Path(filename)
              text = path.read_text('utf-8')
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Missing expected text in {filename}: {old[:80]}')
                  text = text.replace(old, new, 1)
              path.write_text(text, 'utf-8')
          PY
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/urbanek-archive/STATUS.md research/urbanek-archive/state.yml research/urbanek-archive/reports/pilot-reconciliation.md
          git commit -m "Sync URB-U-0022 closure"
          git push origin HEAD:agent/import-urbanek-pilot
