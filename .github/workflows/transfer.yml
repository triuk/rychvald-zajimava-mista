name: Temporary OCR transfer
on:
  push:
    branches:
      - tmp/ocr-transfer-20260801
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: transfer-probe
          path: probe.pdf
          compression-level: 0
          if-no-files-found: error
