  content_summary: Rukopisný oddíl líčí jazykový a církevní konflikt kolem výuky náboženství v rychvaldských českých školách,
    faráře Ferdinanda Němce, zásahy Národního a plebiscitního výboru v letech 1919–1920 a závěrem příchod Karla Vodičky, který
    se podle textu ujal úřadu 1. května 1920.
  evidentiary_limit: Vizuální kontrola potvrzuje znění nadpisu, návaznost stran a čitelné osoby a letopočty. Historická správnost
    vyprávění, autorství rukopisu, přesný svazek a čísla stran nejsou tímto indexačním průchodem ověřeny.
