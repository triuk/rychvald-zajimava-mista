batch_findings:
  general: 'Pět archivních obrazů: tři exteriéry různých staveb, skupinový portrét před budovou s bannerem k výstavě 60 let školy v Rychvaldě
    na Podlesí a exteriér stavby se sakrální architekturou.'
  exact_binary_duplicates_within_batch: 0
  metadata_scope: Žádný z pěti JPEGů neobsahuje použitelná EXIF metadata. Z absence EXIF se neodvozuje historická datace ani způsob vzniku digitalizace.
  visible_text_scope: Na img044.jpg je bezpečně čitelné „VÝSTAVA 60 let školy V RYCHVALDĚ NA PODLESÍ“. Spodní údaje banneru nejsou dostatečně
    čitelné pro spolehlivou dataci. Na img042.jpg je tabulka a znak, ale text tabulky není bezpečně čitelný.
  identity_scope: Čitelný banner je evidován jako textový údaj pramene. Sám o sobě neidentifikuje osoby, přesnou dataci, přesnou budovu ani všechny
    okolnosti události. U ostatních staveb se identita, funkce a lokalita nedovozují z architektury.
