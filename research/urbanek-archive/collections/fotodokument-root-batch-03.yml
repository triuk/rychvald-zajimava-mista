batch_findings:
  general: 'Pět archivních obrazů: obchodní budova s česko-polskými nápisy, dva další neidentifikované stavební exteriéry, budova označená nápisem „KULTURNÍ DŮM“ a detail bohatě zdobeného průjezdního portálu.'
  exact_binary_duplicates_within_batch: 0
  metadata_scope: Žádný z pěti JPEGů neobsahuje použitelná EXIF metadata. Z absence EXIF se neodvozuje historická datace ani způsob vzniku digitalizace.
  visible_text_scope: Na img047.jpg jsou bezpečně čitelné „OVOCE-ZELENINA / OWOCE-JARZYNY“, „MLÉKÁRNA / MLECZARNIA“, české „POTRAVINY-LAHŮDKY“ a číslo 70; nečitelná polská řádka pod pravým nápisem není rekonstruována. Na img050.jpg je bezpečně čitelné „KULTURNÍ DŮM“ a na jednom emblému písmena „ROH“.
  identity_scope: Viditelné nápisy jsou evidovány jako textový údaj pramene. Nápis „KULTURNÍ DŮM“ dokládá označení/funkci této budovy v okamžiku zachycení, ale sám neprokazuje přesnou lokalitu, oficiální název, provozovatele ani datum snímku.
