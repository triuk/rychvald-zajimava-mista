  identity_scope: Sakrální charakter věžové architektury je popsán pouze podle viditelných stavebních znaků. Přesný název,
    denominace, lokalita ani vztah mezi věží na img057.jpg a vzdálenou špičatou věží na img058.jpg nejsou bez dalšího pramene
    tvrzeny.
