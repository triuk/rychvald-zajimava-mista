batch_findings:
  general: Pět archivních obrazů – dva starší domovní exteriéry, skupinový snímek s organizačním praporem, skupina před školní budovou a skupina před budovou s částečným německým nápisem.
  exact_binary_duplicates_within_batch: 0
  metadata_scope: Žádný z pěti JPEGů neobsahuje použitelná EXIF metadata. Z absence EXIF se neodvozuje historická datace ani způsob vzniku digitalizace.
  visible_text_scope: Na img178.jpg jsou bezpečně čitelné texty „STRANA NÁR. SOCIALISTICKÁ“, „RYCHVALD“ a rok „1929“. Na img197.jpg je bezpečně čitelné „NÁRODNÍ ŠKOLA“. Na img200.jpg je z oříznutého německého nápisu bezpečně čitelné pouze slovo „Gastwirtschaft“; předcházející část názvu není rekonstruována.
  identity_scope: Čitelné texty jsou evidovány jako údaje pramene. Nejsou z nich bez dalšího podkladu odvozovány identity osob, přesný oficiální název organizace, přesná škola, provozovna, lokalita, vlastnictví ani historická datace fotografie. Uniformní oděv na img200.jpg není používán k určení konkrétní složky nebo funkce.
