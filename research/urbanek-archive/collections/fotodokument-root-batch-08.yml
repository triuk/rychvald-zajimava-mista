batch_findings:
  general: Pět archivních obrazů – skupina před větší budovou s koňským povozem, skupina před dřevěnou budovou s pivním nápisem, detail odznaku či znaku se stuhami a dva snímky mostově působících konstrukcí se sutí nebo poškozením.
  exact_binary_duplicates_within_batch: 0
  metadata_scope: Žádný z pěti JPEGů neobsahuje použitelná EXIF metadata. Z absence EXIF se neodvozuje historická datace ani způsob vzniku digitalizace.
  visible_text_scope: Na img202.jpg je bezpečně čitelné „Českobudějovické akciové pivo“. Na img203.jpg jsou bezpečně čitelné „ČESKÝ ČL. SPOLEK“, „VLASTIMIL“ a „V RYCHVALDĚ 1893“. Úzký nápis nad vstupem na img201.jpg není bezpečně čitelný.
  identity_scope: Čitelné texty a rok jsou evidovány jako údaje pramene. Zkratka „ČL.“ není rozepisována a rok „1893“ není bez dalšího pramene vykládán jako datum výroby předmětu ani datum pořízení fotografie. Z pivního nápisu se neurčuje přesná provozovna, provozovatel, lokalita ani datum.
  scene_relationship_scope: img206.jpg a img216.jpg oba zachycují mostově působící konstrukce se sutí či poškozením. Jejich přesná identita, lokalita, důvod stavu, datace a vzájemný vztah nejsou z obrazů samotných určeny.
