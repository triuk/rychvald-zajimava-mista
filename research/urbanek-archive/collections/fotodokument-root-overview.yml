interpretation_rules:
- The folder title fotodokument and imgNNN filenames are archival metadata, not independent proof of location, date, photographer or subject identity.
- Architectural appearance may be described, but building identity, function, ownership and historical date require corroborating evidence.
- Absence of EXIF metadata does not establish the age of the original photograph or the date and method of digitization.
- Readable banner wording verifies the visible text only; it does not independently identify every person, exact event date, exact building or
  full circumstances.
- Exact binary duplicates remain separate archive paths but only one independent image if such a duplicate is demonstrated.
