interpretation_rules:
- The folder title fotodokument and imgNNN filenames are archival metadata, not independent proof of location, date, photographer or subject identity.
- Architectural appearance may be described, but building identity, ownership and historical date require corroborating evidence.
- A clearly readable facade sign may verify the wording and, where explicit, the contemporaneous advertised function or designation of the building; it does not by itself establish exact location, official institution name, operator, ownership or date.
- Absence of EXIF metadata does not establish the age of the original photograph or the date and method of digitization.
- Readable banner, shop or object wording verifies the visible text only; partially legible or cropped text is not reconstructed and abbreviations are not expanded without corroboration.
- A visible year on a photographed object is recorded as source wording and is not automatically treated as manufacture date, event date or photographic date.
- Visible political symbols and organizational wording are recorded descriptively; they do not by themselves establish event context, participant identity or a formal historical interpretation beyond the visible source wording.
- Visible uniform-like clothing is described without assigning service, rank or affiliation.
- Similar visual subject matter in separate photographs does not establish that they show the same site, structure or event.
- Exact binary duplicates remain separate archive paths but only one independent image if such a duplicate is demonstrated.
