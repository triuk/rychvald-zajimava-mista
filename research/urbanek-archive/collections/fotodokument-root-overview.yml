interpretation_rules:
- The folder title fotodokument and imgNNN filenames are archival metadata, not independent proof of location, date, photographer or subject identity.
- Architectural appearance may be described, but building identity, ownership and historical date require corroborating evidence.
- A clearly readable facade sign may verify the wording and, where explicit, the contemporaneous advertised function or designation of the building; it does not by itself establish exact location, official institution name, operator, ownership or date.
- Absence of EXIF metadata does not establish the age of the original photograph or the date and method of digitization.
- Readable banner or shop wording verifies the visible text only; partially legible text is not reconstructed.
- Exact binary duplicates remain separate archive paths but only one independent image if such a duplicate is demonstrated.
