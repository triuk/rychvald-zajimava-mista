batch_findings:
  general: Pět samostatných šikmých leteckých pohledů na městské centrum, sídlištní zástavbu a okrajovou zemědělskou krajinu.
  folder_title_interpretation: Název složky je archivní metadata. Obrazy v této dávce nemají viditelné okraje stran ani tištěné
    popisky; samotný název proto neprokazuje, zda jde o zdrojové fotografie, reprodukce z knihy nebo soubory připravené pro
    sazbu.
  filename_zero_interpretation: Soubor 0 titulní stránka.jpg vizuálně obsahuje letecké panorama bez viditelného titulního
    textu. Název může označovat zamýšlené použití, nikoli fotografovanou titulní stranu.
  metadata_sessions:
  - 0 titulní stránka.jpg, 1.jpg a 4.jpg mají EXIF DateTime 2013-08-30.
  - 2.jpg a 3.jpg mají EXIF DateTime 2013-08-07.
  - Soubory 0–3 uvádějí software Picasa; 4.jpg tento tag nemá.
  exact_binary_duplicates_within_batch: 0
  visual_overlap: Snímky 0–3 se částečně prostorově překrývají, ale nejsou totožné a představují různé záběry.
  text_content: V obrazech není čitelný souvislý knižní text ani bibliografický údaj.
