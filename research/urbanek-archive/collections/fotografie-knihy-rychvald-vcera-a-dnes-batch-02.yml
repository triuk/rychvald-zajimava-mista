batch_findings:
  general: Pět samostatných šikmých leteckých pohledů na městské centrum, rybniční krajinu a okrajovou obytnou zástavbu mezi
    poli.
  folder_title_interpretation: Název složky zůstává archivním údajem. Snímky nemají viditelné okraje tištěných stran ani bibliografické
    popisky; dávka sama neprokazuje způsob jejich použití v knize.
  metadata_sessions:
  - 6.jpg a 5.jpg mají EXIF DateTime 2013-08-07 18:05:39 a 18:05:49 a pravděpodobně tvoří krátkou fotografickou sekvenci;
    jde o inferenci z desetisekundového odstupu a překrývajícího se prostoru.
  - 7.jpg má EXIF DateTime 2013-08-30 16:56:01.
  - 8.jpg má EXIF DateTime 2013-09-28 11:28:33.
  - 9.jpg má EXIF DateTime 2012-03-24 05:24:23 a zřetelně odlišný sezónní vzhled.
  - Pouze 5.jpg uvádí EXIF software Picasa; 6.jpg–9.jpg tento tag nemají.
  exact_binary_duplicates_within_batch: 0
  visual_overlap: Snímky 5.jpg a 6.jpg zachycují částečně překrývající se centrální prostor z odlišného rámování. Snímky 7.jpg–9.jpg
    zobrazují různé části okrajové obytné krajiny.
  text_content: V obrazech není čitelný souvislý knižní text ani bibliografický údaj.
