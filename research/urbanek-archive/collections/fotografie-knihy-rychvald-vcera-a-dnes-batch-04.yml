  general: Pět samostatných šikmých leteckých pohledů na obytné části, hlavní komunikace a křižovatky, vodní plochu,
    věžovou budovu a odstavnou nebo parkovací plochu s vozidly.
  folder_title_interpretation: Název složky zůstává archivním údajem. Ani tato dávka neobsahuje viditelné okraje knižních
    stran nebo bibliografický text.
  metadata_sessions:
  - 17.jpg a 15.jpg mají EXIF časy 2012-06-30 05:20:13 a 05:20:50 a tag software PMB. Časový odstup 37 sekund podporuje
    pracovní zařazení do jedné fotografické relace, ale obrazy nemají zjištěný prostorový překryv.
  - 19.jpg má EXIF čas 2012-09-28 23:39:36, zatímco obraz viditelně zachycuje denní světlo. EXIF neobsahuje kontext časového
    pásma a údaj proto nelze považovat za spolehlivý čas expozice.
  - 18.jpg má EXIF čas 2013-08-07 18:10:20 a tag software Picasa.
  - 16.jpg má EXIF čas 2013-08-30 16:54:21 a nemá vyplněný tag software.
  exact_binary_duplicates_within_batch: 0
  exact_binary_duplicates_against_batches_01_03: 0
  visual_overlap: V dávce nebyl zjištěn jednoznačný prostorový překryv. Podobnost prostředí sama o sobě není důkazem
    stejného místa.
  text_content: V obrazech není čitelný souvislý knižní text ani bibliografický údaj.
