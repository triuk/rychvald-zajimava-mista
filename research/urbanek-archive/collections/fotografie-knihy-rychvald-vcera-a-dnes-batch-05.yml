batch_findings:
  general: Pět samostatných šikmých leteckých pohledů na průmyslový nebo servisní komplex u vodních ploch, zemědělskou
    a obytnou krajinu, rozvojové nebo stavební plochy, rozsáhlý vícekřídlý budovní komplex a rozptýlenou okrajovou zástavbu.
  folder_title_interpretation: Název složky zůstává archivním údajem. Ani tato dávka neobsahuje viditelné okraje knižních
    stran nebo bibliografický text.
  metadata_sessions:
  - 22.jpg a 23.jpg mají EXIF časy 2013-08-30 17:25:54 a 17:22:54, tedy odstup tří minut. Časová blízkost podporuje pracovní
    zařazení do jedné letecké relace, ale jednoznačný prostorový překryv nebyl zjištěn.
  - 21.jpg má EXIF čas 2013-08-30 16:56:48, tedy stejné datum jako 22.jpg a 23.jpg; samotné datum neprokazuje shodné
    místo ani bezprostřední sekvenci.
  - 20.jpg má EXIF čas 2013-08-07 18:02:00 a tag software Picasa.
  - 24.jpg má EXIF čas 2013-09-28 11:19:31 a nemá vyplněný tag software.
  exact_binary_duplicates_within_batch: 0
  exact_binary_duplicates_against_batches_01_04: 0
  visual_overlap: V dávce nebyl zjištěn jednoznačný prostorový překryv. Snímky 21.jpg, 22.jpg a 24.jpg zachycují podobný
    typ rozptýlené obytné a zemědělské krajiny, ale jejich identita místa není bez dalšího podkladu prokázána.
  text_content: V obrazech není čitelný souvislý knižní text ani bibliografický údaj.
