batch_findings:
  general: Pět samostatných šikmých leteckých pohledů na rozptýlenou obytnou a zemědělskou krajinu, místní komunikace, silniční
    křižovatky, lesní porosty a vzdálená sídelní nebo průmyslová panoramata.
  folder_title_interpretation: Název složky zůstává archivním údajem. Ani tato dávka neobsahuje viditelné okraje knižních
    stran nebo bibliografický text.
  metadata_sessions:
  - 26.jpg, 28.jpg a 29.jpg mají EXIF časy 2013-09-28 11:12:18, 11:13:31 a 11:14:59. Časový rozsah dvě minuty a 41 sekund
    podporuje pracovní zařazení do jedné fotografické relace, ale nebyl zjištěn jednoznačný prostorový překryv.
  - 27.jpg a 25.jpg mají EXIF časy 2013-04-25 15:39:10 a 15:47:00. Shodné datum a odstup sedm minut a 50 sekund mohou odpovídat
    jedné letové relaci, samy však neprokazují bezprostřední obrazovou sekvenci.
  - Pouze 28.jpg uvádí software Picasa; ostatní soubory dávky nemají vyplněný tag software.
  exact_binary_duplicates_within_batch: 0
  exact_binary_duplicates_against_batches_01_05: 0
  visual_overlap: Jednoznačný prostorový překryv nebyl zjištěn. Soubory 25.jpg a 29.jpg obsahují podobně působící vzdálené
    průmyslové a obytné panorama, ale bez ověřeného společného orientačního bodu se nevedou jako překrývající se záběry.
  text_content: V obrazech není čitelný souvislý knižní text ani bibliografický údaj.
