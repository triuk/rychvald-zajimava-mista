batch_findings:
  general: Pět samostatných leteckých pohledů na obytnou krajinu, sklizené pole, modelářskou závodní dráhu a tenisový areál.
  folder_title_interpretation: Název složky zůstává archivním údajem. Ani tato dávka neobsahuje viditelné okraje knižních
    stran nebo bibliografický text.
  metadata_sessions:
  - 31.jpg má EXIF čas 2013-09-28 11:11:54; spolu s dříve zpracovanými 26.jpg, 28.jpg a 29.jpg leží v časovém rozsahu tři
    minuty a pět sekund. To podporuje pracovní zařazení do jedné fotografické relace, ale jednoznačný prostorový překryv nebyl
    zjištěn.
  - 30.jpg a dříve zpracované 19.jpg mají EXIF časy 2012-09-28 23:41:54 a 23:39:36. Oba obrazy zachycují denní světlo, takže
    hodinové údaje jsou vedeny jako společná metadata s pravděpodobně nesprávnou hodinovou složkou, nikoli jako spolehlivý
    čas expozice.
  - Žádný soubor dávky nemá vyplněný EXIF tag software.
  exact_binary_duplicates_within_batch: 0
  exact_binary_duplicates_against_batches_01_06: 0
  visual_overlap: Jednoznačný prostorový překryv nebyl zjištěn. Snímky 30.jpg a 31.jpg zachycují podobný typ obytné krajiny,
    ale mají odlišné kompozice a bez společného ověřeného orientačního bodu se nevedou jako překrývající se záběry.
  text_content: Soubor 33.jpg obsahuje čitelný nápis „RC TEAM RYCHVALD“. Jde o text v obraze, nikoli bibliografický údaj nebo
    důkaz použití fotografie v knize.
