batch_findings:
  general: Pět samostatných šikmých leteckých pohledů na obytnou a zemědělskou krajinu s komunikacemi, rybníky nebo jinými
    vodními plochami, lesními okraji a rozsáhlejšími polními či vodohospodářskými celky.
  folder_title_interpretation: Název složky zůstává archivním údajem. Ani tato dávka neobsahuje viditelné okraje knižních
    stran nebo bibliografický text.
  metadata_sessions:
  - 37.jpg má EXIF čas 2013-09-28 11:37:53. Se snímky 26.jpg, 28.jpg, 29.jpg, 31.jpg a 34.jpg sdílí datum; časový rozsah mezi
    31.jpg a 37.jpg činí 25 minut a 59 sekund. To dovoluje pracovní zařazení do širší fotografické relace, ale jednoznačný
    prostorový překryv nebyl zjištěn.
  - 38.jpg a 39.jpg mají EXIF časy 2013-08-30 16:51:12 a 17:11:43. Odstup 20 minut a 31 sekund a podobný krajinný charakter
    mohou odpovídat jedné letové relaci, ale nebyl zjištěn jednoznačný společný orientační bod.
  - 35.jpg viditelně zachycuje denní světlo, přesto EXIF uvádí 22:36:44. Hodinová složka se proto vede jako nespolehlivá metadata,
    nikoli jako prokázaný čas expozice.
  - 36.jpg uvádí software PMB; 38.jpg a 39.jpg Picasa; 35.jpg a 37.jpg nemají tag software vyplněn.
  exact_binary_duplicates_within_batch: 0
  exact_binary_duplicates_against_batches_01_07: 0
  visual_overlap: Snímky 35.jpg a 36.jpg zachycují podobně vodnatou obytnou krajinu a 38.jpg s 39.jpg související typ zemědělské
    a vodní krajiny. Bez společného ověřeného orientačního bodu se však žádná dvojice nevede jako prokázaný překryv.
  text_content: V obrazech není čitelný souvislý knižní text ani bibliografický údaj.
