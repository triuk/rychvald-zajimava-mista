batch_findings:
  general: Pět samostatných leteckých pohledů na rybniční krajinu, venkovní veřejnou akci, komunikaci s přilehlým provozním
    areálem a dvě překrývající se podoby soustředěnějšího sídelního centra s kostelními stavbami a vodními plochami.
  folder_title_interpretation: Název složky zůstává archivním údajem. Ani tato dávka neobsahuje viditelné okraje knižních
    stran nebo bibliografický text.
  metadata_sessions:
  - 40.jpg a 42.jpg mají EXIF časy 2013-08-07 18:08:36 a 18:08:45, oba uvádějí software Picasa. Odstup devět sekund podporuje
    zařazení do jedné fotografické sekvence, ale jednoznačný prostorový překryv nebyl zjištěn.
  - 41.jpg a dříve zpracované 33.jpg mají EXIF časy 2013-10-05 15:27:02 a 15:29:29. Odstup dvě minuty a 27 sekund může odpovídat
    jedné letové relaci, ale snímky zachycují odlišné areály a prostorový překryv nebyl zjištěn.
  - 43.jpg a 44.jpg mají EXIF časy 2012-11-10 23:46:59 a 23:40:07 a zřetelně se překrývají v prostoru sídelního centra, komunikací,
    kostelních staveb a vodních ploch. Oba obrazy zachycují denní světlo, takže hodinová složka není vedena jako spolehlivý
    čas expozice.
  - 40.jpg a 42.jpg uvádějí software Picasa; 41.jpg, 43.jpg a 44.jpg nemají tag software vyplněn.
  exact_binary_duplicates_within_batch: 0
  exact_binary_duplicates_against_batches_01_08: 0
  visual_overlap: Snímky 43.jpg a 44.jpg tvoří prokázanou překrývající se dvojici s odlišnou kompozicí a binárními hashi.
    U časově velmi blízkých snímků 40.jpg a 42.jpg nebyl společný orientační bod spolehlivě potvrzen.
  text_content: Soubor 41.jpg obsahuje čitelný nápis „Hruška“ na obchodní budově. Jde o text v obraze, nikoli bibliografický
    údaj ani samostatný důkaz přesné lokace, názvu akce nebo použití fotografie v knize.
