batch_findings:
  general: Pět samostatných šikmých leteckých pohledů na rybniční a mokřadní krajinu, obytnou zástavbu u lesního okraje, rozptýlené
    venkovské osídlení, izolovanou skupinu domů mezi poli a rozsáhlou vícekřídlou budovu u hlavní komunikace.
  folder_title_interpretation: Název složky zůstává archivním údajem. Ani tato dávka neobsahuje viditelné okraje knižních
    stran nebo bibliografický text.
  metadata_sessions:
  - 46.jpg a dříve zpracované 41.jpg mají EXIF časy 2013-10-05 15:20:10 a 15:27:02. Odstup šest minut a 52 sekund může odpovídat
    jedné letové relaci, ale snímky zachycují odlišný typ zástavby a prostorový překryv nebyl zjištěn.
  - 49.jpg a dříve zpracované 20.jpg mají EXIF časy 2013-08-07 18:01:16 a 18:02:00. Odstup 44 sekund podporuje jednu fotografickou
    sekvenci, ale jednoznačný společný orientační bod nebyl potvrzen. Do stejného širšího časového bloku patří také 40.jpg
    a 42.jpg.
  - 47.jpg má EXIF čas 2012-11-11 00:13:15, zatímco dříve zpracované 43.jpg a 44.jpg uvádějí časy 2012-11-10 kolem 23:40.
    Všechny tři obrazy zachycují denní světlo a prostorový překryv 47.jpg s touto dvojicí nebyl zjištěn; hodinové údaje proto
    nepodporují spolehlivé časové řazení.
  - 48.jpg viditelně zachycuje denní světlo, přesto EXIF uvádí 23:33:18. Hodinová složka se proto vede jako nespolehlivá metadata,
    nikoli jako prokázaný čas expozice.
  - Žádný soubor dávky 10 nemá vyplněný EXIF tag software.
  exact_binary_duplicates_within_batch: 0
  exact_binary_duplicates_against_batches_01_09: 0
  visual_overlap: Mezi soubory dávky ani proti lokálně porovnávaným dříve zpracovaným snímkům nebyl potvrzen jednoznačný prostorový
    překryv. Časová blízkost některých dvojic proto zůstává pouze metadatačním vodítkem.
  text_content: V obrazech není čitelný souvislý knižní text ani bibliografický údaj.
