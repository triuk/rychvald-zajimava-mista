batch_findings:
  general: Čtyři samostatné šikmé letecké pohledy na rozsáhlý zemědělský nebo provozní areál, nízkou budovu u hlavní komunikace,
    vícekřídlý objekt mezi poli a sídelní centrum za soustavou vodních ploch.
  folder_title_interpretation: Název složky zůstává archivním údajem. Ani tato dávka neobsahuje viditelné okraje knižních
    stran nebo bibliografický text.
  metadata_sessions:
  - 50.jpg a dříve zpracované 32.jpg mají EXIF časy 2013-08-30 17:42:15 a 17:42:38. Odstup 23 sekund a shodné sklizené pole
    s balíky potvrzují jednu fotografickou sekvenci a prostorový překryv.
  - 51.jpg má stejné datum EXIF jako dříve zpracované 25.jpg a 27.jpg, avšak časové odstupy přesahují 23 minut a společný
    orientační bod nebyl potvrzen.
  - 52.jpg a dříve zpracované 30.jpg mají stejné datum EXIF a časy vzdálené 11 minut a 20 sekund. Oba snímky zachycují denní
    světlo navzdory pozdně večerním hodinám a prostorový překryv nebyl zjištěn; hodinové údaje proto nejsou spolehlivé pro
    časové řazení.
  - 53.jpg se zřetelně prostorově překrývá s 43.jpg a 44.jpg v oblasti sídelního centra, kostelní věže a soustavy vodních
    ploch. Soubory mají odlišná data EXIF, roční období, kompozice i binární hashe.
  - Software Picasa uvádí pouze 52.jpg; 50.jpg, 51.jpg a 53.jpg tag software nemají.
  exact_binary_duplicates_within_batch: 0
  exact_binary_duplicates_against_batches_01_10: 0
  visual_overlap: Potvrzen je prostorový překryv 50.jpg s 32.jpg a 53.jpg s dvojicí 43.jpg a 44.jpg. Mezi ostatními soubory
    dávky nebyl jednoznačný překryv zjištěn.
  text_content: V obrazech není čitelný souvislý knižní text ani bibliografický údaj.
