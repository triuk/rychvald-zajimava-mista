interpretation_rules:
- Folder and filename wording is archival metadata, not independent proof of book publication, page placement, date, authorship
  or depicted location.
- EXIF dates are preserved as embedded file metadata and are not independent proof of publication date or photographer.
- Overlapping aerial views are separate evidence only when the image files and viewpoints are distinct.
- Exact building, road, railway, sports-facility and water-body identities remain unverified unless supported by captions,
  maps, user testimony or documentary sources.
- Visible text RC TEAM RYCHVALD in 33.jpg supports a Rychvald association but does not establish exact location, event identity,
  publication use or photographer.
- Visible text Hruška in 41.jpg identifies a commercial sign in the image but does not independently establish the exact branch,
  event identity, depicted location, publication use or photographer.
- Daylight scenes in 19.jpg, 30.jpg, 35.jpg, 43.jpg, 44.jpg, 47.jpg, 48.jpg and 52.jpg conflict with late-evening or near-midnight
  EXIF clock values; those clock values are not treated as reliable exposure times.
- Verified visual overlaps include 50.jpg with 32.jpg and 53.jpg with 43.jpg and 44.jpg; the distinct files and viewpoints
  remain separately indexed.
