      scene_text: not_detected

  - id: urbanek-ccs-005
    visual_type: historical_black_and_white_construction_photograph_reproduction
    description: >-
      Téměř dokončená podélná kostelní budova se střechou, vysokými okny a věží;
      lešení zůstává zejména kolem věže a části průčelí. V pravém pozadí je vidět
      věž dalšího kostela nebo obdobné výrazné stavby.
    subject_tags: [church_near_completion, tower_scaffolding, long_nave, surrounding_settlement, distant_spire]
