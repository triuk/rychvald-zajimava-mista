    status: candidate_pending_cross_source_review
  - question: Jak přesně zní stranově převrácený nápis nad oltářem na urbanek-ccs-007?
    status: candidate_pending_better_copy_or_parallel_photo
  - question: Kdo vytvořil obraz za oltářem a jaký výjev zachycuje?
    status: candidate_pending_later_collection_comparison
  - question: Potvrzuje jiný pramen, že urbanek-ccs-010 zachycuje tryznu za T. G. Masaryka roku 1937 a faráře Karla Vodičku?
    status: candidate_pending_cross_source_review

next_action: >-
  Pokračovat položkami 11–15. Archivní datace a jména porovnávat s pozdějšími
  popisky, kronikami a dalšími fotografiemi; stabilní nejistotu založit až tehdy,
  zůstane-li otázka po vnitřním porovnání kolekce podstatná a nevyřešená.
