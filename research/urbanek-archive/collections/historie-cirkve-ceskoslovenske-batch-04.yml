batch_assessment:
  status: partially_verified
  conclusion: >-
    Dávka obsahuje dvě barevné dokumentační fotografie nástěnných maleb, dva
    historické exteriéry sboru a skupinovou fotografii před varhanními píšťalami.
    Obrazově lze popsat výjevy, podobu budovy, zahradní úpravu a přítomnost varhan;
    data 1932 a 1946, konkrétní okupační zásahy, autorství maleb, identita osob a
    historie varhan vycházejí z archivních názvů a vyžadují další prameny.
  sequence_note: >-
    Číslování dochovaných souborů po položce 15 pokračuje 17, 17a, 19, 21 a 22.
    Samotné mezery neprokazují chybějící originály; otázka je vedena v URB-U-0047.

