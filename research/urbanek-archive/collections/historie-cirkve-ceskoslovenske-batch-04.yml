  - id: urbanek-ccs-016
    visual_type: modern_color_documentation_of_mural
    description: >-
      Široká nástěnná malba s dvojicí výrazných duchovních postav uprostřed,
      skupinou lidí vlevo a dvojicí slavnostně oděných postav s doprovodem vpravo.
      Jedna ústřední postava drží dvojramenný kříž. Na malbě jsou patrné praskliny.
    subject_tags: [mural, clergy_figures, double_cross, historical_religious_scene, wall_cracks]
