batch_assessment:
  status: partially_verified
  conclusion: >-
    Dávka obsahuje tři snímky svatebního obřadu, celkový pohled na interiér směrem
    ke kůru a venkovní skupinovou fotografii. Shoda oděvů, prostředí a pořadí
    souborů podporuje pracovní hypotézu, že první tři obrazy tvoří jednu svatební
    sérii, ale totožnost osob, přesné datum a rok 1948 nejsou obrazem samostatně
    doloženy. Interiérový snímek ukazuje varhanní píšťaly na kůru při starším
    uspořádání a výzdobě sálu. Jméno biskupa Ferdinanda Stibora, návštěva Rychvaldu
    a rok 1948 u posledního snímku pocházejí z archivního názvu.
  basis:
    - visual_interior_continuity
    - clothing_and_event_continuity
    - archival_sequence
    - verified_repo_files

