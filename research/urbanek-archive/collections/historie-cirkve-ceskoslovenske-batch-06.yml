  - id: urbanek-ccs-029
    archival_filename: "31  V r. 1957 byly na čelní stěnu nakresleny obrazy ak. malí.jpg"
    visual_type: historical_black_and_white_decorated_chancel_photograph_reproduction
    description: >-
      Celkový pohled na kněžiště po doplnění figurální výzdoby. Vlevo je výjev
      křtu Ježíše, vpravo setkání vzkříšeného Krista se ženou a kolem centrálního
      kříže je oblačný a paprskový motiv. Pod bočními obrazy jsou textové nápisy.
    subject_tags: [wall_murals, baptism_of_Jesus, risen_Christ_scene, crucifix, biblical_inscriptions, congregation]
    identification:
