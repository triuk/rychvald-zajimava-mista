schema_version: 1
collection_id: urbanek-ccs-history
batch_id: reconstructed-chancel-carpet-and-obsil-murals-06
status: completed_first_visual_pass
item_count: 5
source_scope: "1 Od položení základního kamene. Histotie rychvaldského kostela / archivní soubory 28–32"
attribution: "Z osobního archivu p. Jaromíra Urbánka."
rights: unknown

batch_assessment:
  status: partially_verified
  conclusion: >-
    Dávka obrazově dokumentuje nejméně tři po sobě jdoucí stavy kněžiště:
    zjednodušený stav po výrazné stavební nebo výtvarné úpravě, tentýž prostor při
    slavnostní bohoslužbě, pozdější doplnění koberců a nakonec figurální výzdobu
    čelní stěny dochovanou také na novodobém barevném snímku. Roky 1949 a 1957,
    označení rekonstrukce a příjmení Obšil pocházejí z archivních názvů souborů.
    Biblické nápisy na urbanek-ccs-030 jsou obrazově čitelné.
  basis:
    - repeated_architectural_features
    - visual_change_sequence
    - readable_scene_text
    - archival_sequence
    - verified_repo_files

items:
  - id: urbanek-ccs-026
    archival_filename: "28  1949 , rekonstruované kněžiště.jpg"
    visual_type: historical_black_and_white_chancel_architectural_photograph_reproduction
    description: >-
      Čelní pohled na výrazně zjednodušené kněžiště. V hlubokém obloukovém výklenku
      je velký kříž s korpusem, před ním jednoduchý pravoúhlý oltář se znakem kalicha.
      Boční stěny jsou bez figurálních maleb a stupně nejsou pokryty celoplošným kobercem.
    subject_tags: [reconstructed_chancel, crucifix, altar, chalice_symbol, bare_walls, architectural_state]
    identification:
      status: partially_verified
      archival_claim: "rekonstruované kněžiště roku 1949"
      verified_from_image: [simplified_chancel_state, crucifix_and_altar_configuration, absence_of_later_side_murals]
      unverified: [exact_date, year_1949, exact_reconstruction_scope, responsible_designer_or_builder]
    ocr:
      document_text: not_applicable
      scene_text: not_detected
    uncertainty_ids: [URB-U-0049]

  - id: urbanek-ccs-027
    archival_filename: "29  1949 Slavnostní bohoslužby po rekonstrukci  bohoslužby s.jpg"
    visual_type: historical_black_and_white_crowded_service_photograph_reproduction
    description: >-
      Zaplněný sbor při bohoslužbě v témže zjednodušeném kněžišti jako na
      urbanek-ccs-026. Za oltářem stojí tři duchovní nebo obřadní osoby, v lavicích
      je početné shromáždění a vlevo je prapor. Na dveřích je tabule s čísly 15 a 8,
      její slovní popisky nejsou bezpečně čitelné.
    subject_tags: [post_reconstruction_service, congregation, clergy, flag, hymn_board, reconstructed_chancel]
    identification:
      status: partially_verified
      archival_claim: "slavnostní bohoslužby po rekonstrukci roku 1949"
      verified_from_image: [large_service, same_chancel_state_as_urbanek_ccs_026, three_officiants]
      unverified: [exact_date, year_1949, event_purpose, identities_of_officiants, meaning_of_board_numbers]
    ocr:
      document_text: not_applicable
      scene_text:
        status: visually_checked_partial
        location: board on left door
        transcription: "[nečitelné] 15 / [nečitelné] 8"
        note: Slovní označení nelze bezpečně přepsat.
    uncertainty_ids: [URB-U-0049, URB-U-0051]

  - id: urbanek-ccs-028
    archival_filename: "30  pozdeji bylo kněžiště opatřeno kobercem.jpg"
    visual_type: historical_black_and_white_liturgical_event_photograph_reproduction
    description: >-
      Detail kněžiště se stejným křížem a oltářem. Stupně, plocha kolem oltáře a
      přední část jsou pokryty několika vzorovanými koberci. Za oltářem stojí dva
      duchovní, další osoba v rouchu čte nebo promlouvá před oltářem.
    subject_tags: [carpeted_chancel, clergy, liturgical_event, crucifix, altar, interior_change]
    identification:
