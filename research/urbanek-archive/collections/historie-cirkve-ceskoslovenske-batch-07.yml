attribution: "Z osobního archivu p. Jaromíra Urbánka."
rights: unknown

batch_assessment:
  status: partially_verified
  conclusion: >-
    Dávka obsahuje jeden pohled na mimořádně zaplněný interiér sboru a čtyři
    skupinové fotografie spojované s prvním přijímáním. Obrazově je doložena vysoká
    účast, slavnostní oděv dětí, květiny, přítomnost duchovních a opakované použití
    stejného vstupního průčelí. Rok 1965, čtyřicáté výročí, označení prvního
    poválečného přijímání, jména osob, vztah „o rok později“ a příčinná interpretace
    úbytku účasti pocházejí z archivních názvů a nejsou samy obrazem ověřeny.
  working_hypothesis: >-
    Urbanek-ccs-033 a urbanek-ccs-035 mohou být oddělené dívčí a chlapecké skupinové
    snímky téhož přijímání; urbanek-ccs-034 může zachycovat následující ročník.
    Hypotéza vychází z pořadí, obdobného místa, slavnostního oděvu a formulace názvů,
    nikoli z identifikace osob podle tváře.
  basis:
    - repeated_portico_architecture
    - ceremonial_clothing_and_flowers
    - archival_sequence
    - verified_repo_files
    - visually_readable_facade_motto

