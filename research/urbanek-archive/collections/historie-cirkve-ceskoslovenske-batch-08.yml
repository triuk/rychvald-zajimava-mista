batch_assessment:
  status: partially_verified
  conclusion: >-
    Dávka dokumentuje malou slavnostní skupinu dětí s duchovní, tři generačně
    odlišné skupinové fotografie spojované s radou starších a velký smíšený pěvecký
    sbor. Obraz potvrzuje složení a uspořádání skupin, nikoli jména, funkce nebo data
    uvedená v archivních názvech. Dva názvy jsou useknuté právě v identifikačně
    podstatné části a nebyly doplněny odhadem.
  basis:
    - visual_group_composition
    - repeated_exterior_setting
    - archival_sequence
    - verified_repo_files

