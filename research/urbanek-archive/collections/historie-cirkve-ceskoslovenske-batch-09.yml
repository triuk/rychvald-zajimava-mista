batch_assessment:
  status: partially_verified
  conclusion: >-
    Dávka dokumentuje novodobý pěvecký sbor a hudebníky při jednom či více
    vystoupeních v interiéru Husova sboru a velkou historickou skupinu spojovanou
    archivním názvem s inaugurací Gabriela Chrobáčka. Obrazy potvrzují sbor,
    dirigenta, nástroje, varhany, skupinové uspořádání a biskupskou insignii,
    nikoli přesná data, jména, funkce, události ani vzájemnou časovou vazbu snímků.
    Název souboru 47 je useknut v identifikačně významné části.
  basis:
    - visual_performance_content
    - repeated_church_interior
    - archival_sequence
    - verified_repo_files
    - embedded_capture_metadata_review

