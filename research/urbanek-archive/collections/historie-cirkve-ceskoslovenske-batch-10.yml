batch_assessment:
  status: partially_verified
  conclusion: >-
    Dávka dokumentuje předání plastiky duchovnímu s biskupskou insignií, výroční
    shromáždění v kněžišti, křestní obřad a dva novodobé záběry husovské vzpomínky.
    Obrazy potvrzují viditelné obřady, osoby, předměty a prostředí, nikoli přesná
    data, identity nebo institucionální významy uvedené v názvech. Metadata dvou
    souborů nejsou spolehlivou datací události a jeden archivní název je useknutý.
    Pozdější přesné porovnání s urbanek-ccs-097 a 098 potvrdilo, že urbanek-ccs-046
    je další reprodukcí téže původní fotografie; samostatná listina na ní není
    spolehlivě rozeznatelná.
  basis:
    - full_image_visual_review
    - embedded_metadata_review
    - archival_sequence
    - verified_repo_files
    - exact_cross_batch_visual_comparison

