batch_assessment:
  status: partially_verified
  conclusion: >-
    Čtyři fotografie pokračují v novodobé sérii husovské vzpomínky. Snímky 52b,
    53 a 54 obrazově zachycují tutéž hranici před zapálením, při hoření a v širším
    pohledu s davem a hasiči. Snímek 52a zachycuje českou vlajku a dechovou hudbu
    v průvodu; jeho vztah ke stejnému ročníku je pravděpodobný, nikoli definitivně
    prokázaný. Pátý snímek dokumentuje kostýmovanou scénu archivně označenou jako
    živý betlém. Jména, pořadatelé a přesná data nejsou obrazem ověřena.
  basis:
    - visual_sequence_comparison
    - identical_bonfire_structure_and_portrait
    - archival_sequence
    - verified_repo_files

