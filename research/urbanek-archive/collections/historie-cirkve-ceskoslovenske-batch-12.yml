attribution: "Z osobního archivu p. Jaromíra Urbánka."
rights: unknown

batch_assessment:
  status: partially_verified
  conclusion: >-
    Dávka rozšiřuje živý betlém o samostatný snímek s živým dítětem a embedded
    datem roku 2008, obsahuje dva koncertní záběry se shodným fotoaparátem a datem
    12. června 2011 a dokumentuje pamětní desku Karla a Libuše Vodičkových spolu s
    portrétem archivně připisovaným Karlu Vodičkovi. Koncertní názvy jsou ve vzájemném
    napětí: jeden uvádí Svatováclavský festival, druhý adventní koncerty, přestože
    metadata ukazují tentýž červnový den. Nápis na pamětní desce je čitelný, ale jeho
    historická tvrzení vyžadují nezávislé potvrzení.
  basis:
    - visual_review
    - embedded_metadata_comparison
    - scene_text_transcription
    - verified_repo_files

