item_count: 5
source_scope: >-
  První podsložka – archivní soubory 61 až 63; druhá podsložka
  „Návštěva faráře Vodičky v r. 1965 a v r. 1970 u příležitosti 50“ – soubory 1 a 2.
attribution: "Z osobního archivu p. Jaromíra Urbánka."
rights: unknown

batch_assessment:
  status: partially_verified
  conclusion: >-
    Tři samostatné portrétní nebo obřadní fotografie jsou archivně označeny jmény
    Gabriela Chrobáčka, Leonarda Bogumského a Jany Šilerové. Obrazy potvrzují pouze
    duchovní oděv, liturgické prostředí a insignie; jména, tituly a úřady vyžadují
    dokumentární potvrzení. Dva následující snímky zachycují tutéž čtveřici sedících
    osob, jednou uvnitř širší skupiny a jednou samostatně v zahradě. Archivní názvy
    je spojují s faráři Vodičkou a Bogumským a jejich manželkami, ale jednotlivé osoby
    nelze přiřadit pouze podle vzhledu a datum 1965 či 1970 není z obrazu zjistitelné.
  basis:
    - visual_review
    - cross_image_group_comparison
    - archival_sequence
    - verified_repo_files

