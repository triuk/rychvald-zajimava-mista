  Druhá podsložka – archivní soubory 3 až 6; třetí podsložka
  „Biskup Ferdinand Stibor v Rychvaldě“ – soubor 1.
attribution: "Z osobního archivu p. Jaromíra Urbánka."
rights: unknown

batch_assessment:
  status: partially_verified
  conclusion: >-
    První dva archivní soubory zachycují přesně tentýž fotografický obraz přivítání
    duchovního dítětem; soubor 066 je těsnější výřez a jiné zvětšení širšího souboru
    067. Archivní názvy spojují obraz s padesátým výročím roku 1970, useknutým jménem
    „Kare…“ a biskupem Marceluchem, ale žádné z těchto tvrzení není obrazem nezávisle
    potvrzeno. Další dva snímky zachycují křestní obřady s různými rodinnými skupinami;
    pouze jeden kojenec je na každém záběru jednoznačně viditelný a tvrzení o trojích
    křtinách vyžaduje matriku nebo program. Poslední snímek otevírá starší venkovní sérii
    uvítání chlebem a solí, kterou archivní struktura připisuje Ferdinandu Stiborovi.
  basis:
    - visual_review
    - exact_image_crop_and_scale_comparison
    - event_sequence_comparison
    - verified_repo_files

