batch_assessment:
  status: partially_verified
  conclusion: >-
    Pět fotografií rozšiřuje archivní sérii návštěvy připisované Ferdinandu Stiborovi.
    Soubory 2 a 2a zachycují tutéž nebo bezprostředně navazující venkovní situaci z
    rozdílného záběru. Následují skupinové snímky před oltářem a velká společná
    fotografie s dětmi. Soudržnost série podporuje pořadí, prostředí a opakující se
    účastníci; jméno hosta, datum, funkce a identity osob však fotografie samy nepotvrzují.
  basis: [visual_sequence_comparison, archival_folder_context, repeated_people_and_clothing, verified_repo_files]

