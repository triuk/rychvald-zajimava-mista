status: completed_first_visual_pass
item_count: 5
source_scope: >-
  Poslední soubor podsložky 3 Biskup Ferdinand Stibor v Rychvaldě a první čtyři
  soubory podsložky 4 Slavnostní volba a jmenování biskupem Gabriela Chrobáčka v r. 19
attribution: "Z osobního archivu p. Jaromíra Urbánka."
rights: unknown

batch_assessment:
  status: partially_verified
  conclusion: >-
    První snímek uzavírá sérii návštěvy archivně připisované Ferdinandu Stiborovi
    sedmičlennou venkovní skupinou označenou jako rada starších. Název obsahuje pouze
    fragmenty několika jmen a končí řetězcem Šm. Zbývající čtyři snímky otevírají
    souvislou interiérovou sérii slavnostního církevního shromáždění: skupinu duchovních
    s řetězy nebo insigniemi, jednotlivého řečníka s listinou, obřad u oltáře a zaplněnou
    loď. Obrazová návaznost podporuje jednu událost, ale nepotvrzuje jméno Gabriela
    Chrobáčka, rok, přesný úkon ani role jednotlivých osob.
  basis:
    - visual_review
    - archival_sequence
    - repeated_interior_and_participants
    - exact_repository_paths_confirmed
    - git_blob_sha_computed_from_unchanged_source_bytes

