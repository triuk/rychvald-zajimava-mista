    Čtyři snímky pokračují v obřadní části série: položení ruky na skloněného
    duchovního, úkony u oltáře, práce s knihou a kalichem a přítomnost více duchovních
    s řetězy nebo insigniemi. Pátý snímek zachycuje gratulaci ženy duchovnímu;
    označení ženy jako manželky pochází pouze z archivního názvu. Přesný význam
    rituálů, jména, úřady ani datum nejsou obrazem samostatně potvrzeny.
