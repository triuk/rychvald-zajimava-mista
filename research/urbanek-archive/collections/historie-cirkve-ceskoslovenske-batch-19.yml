batch_assessment:
  status: partially_verified
  conclusion: >-
    Pět snímků pokračuje ve slavnostní obřadní posloupnosti. Zachycují vystoupení
    duchovního před shromážděním, fyzické nasazení řetězu nebo insignie skloněnému
    duchovnímu, společný úkon u oltáře s kalichem a otevřenou knihou, setkání s listinou
    nebo složeným dokumentem a následné vystoupení duchovního s již nasazeným řetězem.
    Obrazová návaznost podporuje jeden investiční či jmenovací celek, ale fotografie samy
    neurčují jména, úřady, datum, právní význam insignie ani přesné znění dokumentu.
  basis:
    - visual_sequence_comparison
    - repeated_clergy_and_interior
    - archival_sequence
    - verified_repo_files

