batch_assessment:
  status: partially_verified
  conclusion: >-
    Pět snímků pokračuje v závěrečné části slavnostní série. Zachycují gratulaci
    krojované ženy nebo dívky s kyticí, předání světlé plastiky duchovnímu s řetězem,
    další vystoupení duchovního s listem papíru a stojící shromáždění v lavicích.
    Urbanek-ccs-097 a 098 jsou odlišné reprodukce nebo výřezy téže původní fotografie
    a přesné vizuální porovnání potvrzuje, že stejnou předlohu používá také dřívější
    urbanek-ccs-046. Tři soubory jsou proto tři archivní položky, ale jen jeden
    nezávislý obrazový záznam. Fotografie samy neurčují jména, datum, úřady, původ
    kroje, osobu předávajícího ani námět a provenienci plastiky.
  basis:
    - full_image_visual_review
    - exact_cross_batch_visual_comparison
    - repeated_clergy_congregation_and_interior
    - archival_sequence
    - verified_repo_files

