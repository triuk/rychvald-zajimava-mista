batch_assessment:
  status: partially_verified
  conclusion: Urbanek-ccs-101 uzavírá Chrobáčkovu podsložku a je přesnou binární kopií urbanek-ccs-045; oba soubory mají shodný
    Git blob SHA a nepředstavují dvě nezávislá obrazová svědectví. Položky 102–105 otevírají podsložku kaple CČS na Ostravici.
    Zachycují malou modernistickou stavbu na svahu s oddělenou vysokou zvonicovou konstrukcí, oltář s kruhovým figurálním
    oknem a dvě slavnostní fotografie s vloženými psanými popisky. Archivní názvy a popisky připisují objekt CČS, zvoničku
    Winklerovi, okenní portrét Janu Husovi, muže v obleku Chrobáčkovi a vítaného duchovního biskupovi; fotografie samy neověřují
    přesné datum, místo, osoby, funkce, stavební historii ani vztah obou slavnostních snímků.
  basis:
  - full_image_visual_review
  - exact_git_blob_comparison
  - embedded_caption_transcription
  - architectural_and_interior_comparison
  - archival_sequence
  - verified_repo_files
