batch_assessment:
  status: partially_verified
  conclusion: >-
    Dávka pokračuje slavnostní sérií uvítáním duchovního archivně označeného jako biskup
    zástupcem MNV a dále dokumentuje moderní podobu dřevěné chatky, staré dřevěné věžové
    konstrukce označené jako Winklerova zvonička a dvou pamětních desek. Konstrukce na
    urbanek-ccs-108 odpovídá typem a proporcemi věži vedle kaple na historickém snímku
    urbanek-ccs-102, což podporuje vztah k témuž objektu, ale samo neurčuje jeho funkci,
    dataci ani osobu Winklera. Desky na urbanek-ccs-109 a 110 obsahují čitelné údaje o
    roce 1937, Ferdinandu Stiborovi, Bohumíru Liškovi a Alfredu Farníkovi. Ověřeno je
    znění nápisů, nikoli bez dalšího jejich historická správnost.
  basis:
    - full_image_visual_review
    - manual_scene_text_transcription
    - architectural_cross_batch_comparison
    - verified_repo_files
    - embedded_metadata_review
