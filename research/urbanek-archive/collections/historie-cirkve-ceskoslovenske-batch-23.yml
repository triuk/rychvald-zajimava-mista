batch_assessment:
  status: partially_verified
  conclusion: >-
    Dávka rozšiřuje slavnostní sérii o uvítání duchovního archivně označeného jako biskup
    správcem Husitské kaple a o celkový záběr z bohoslužeb před otevřeným vstupem kaple.
    Další tři snímky dokumentují starou dřevěnou zvonici se zavěšeným zvonem a novou
    dřevěnou zvonici ze dvou úhlů. Archivní název urbanek-ccs-114 tvrdí, že stará zvonice
    byla roku 2016 demontována a nahrazena novou. EXIF položek 114 a 115 uvádí pořízení
    2. října 2016 v rozmezí 39 sekund, což podporuje, že nová konstrukce existovala
    nejpozději tohoto dne, nikoli však přesné datum demontáže, stavby nebo předání.
  basis:
  - full_image_visual_review
  - manual_scene_text_transcription
  - architectural_cross_batch_comparison
  - embedded_EXIF_review
  - verified_repo_files
