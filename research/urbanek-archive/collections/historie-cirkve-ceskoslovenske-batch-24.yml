batch_assessment:
  status: partially_verified
  conclusion: První čtyři položky pokračují v moderní dokumentaci areálu z 2. října 2016. Zachycují společný pohled na novou
    zvonici a kapli, průčelí kaple s pamětní deskou, detail stejné fyzické desky jako na urbanek-ccs-109 a detail střešního
    znaku tvořeného křížem a kalichem. EXIF časy 14:05:52–14:07:01 a stejný fotoaparát podporují jedno souvislé fotografické
    sezení navazující na urbanek-ccs-114 a 115. Urbanek-ccs-120 je historický portrét duchovního s vloženým popiskem „Biskup
    dr.Horský“; archivní název přidává rozmezí 1945–1946. Ověřeno je znění popisku a obrazové znaky, nikoli osoba, úřad, datum
    nebo vztah k dřívější skupině rady starších.
  basis:
  - full_image_visual_review
  - manual_scene_text_transcription
  - architectural_and_object_cross_batch_comparison
  - embedded_EXIF_review
  - verified_repo_files
