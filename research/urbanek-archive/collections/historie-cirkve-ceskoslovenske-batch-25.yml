batch_assessment:
  status: partially_verified
  conclusion: >-
    Dávka dokumentuje závěr venkovní bohoslužby, rozsáhlé shromáždění a navazující
    průvod na venkovské komunikaci. Položky 123 až 125 spojují stejné typy vysokých
    praporů, krojované účastnice, děti, civilní účastníky a početnou skupinu duchovních.
    Položky 121 a 122 obsahují čitelné vložené popisky „Závěr bohoslužeb.“ a
    „Záběr z bohoslužeb.“ Archivní název položky 122 uvádí pouze useknutou formulaci
    „asi v r. 1945 nebo…“; druhý rok ani pokračování nejsou rekonstruovány. Série může
    souviset s portrétem archivně označeným jako biskup dr. Horský, ale osoby nelze
    ztotožnit pouze podle vzhledu, oděvu nebo insignie.
  basis:
    - full_image_visual_review
    - manual_scene_text_transcription
    - procession_and_setting_cross_image_comparison
    - archival_sequence
    - verified_repo_files
  related_open_items: [URB-U-0059]
