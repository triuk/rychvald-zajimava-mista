batch_assessment:
  status: partially_verified
  conclusion: Dávka pokračuje historickou slavnostní sérií u kaple. Položka 127 zachycuje velmi početné shromáždění před kaplí
    a navazuje na venkovní bohoslužbu a průvod z předchozí dávky. Položky 126, 128, 129 a 130 zachycují duchovní při projevech,
    čtení nebo předávání listiny v interiéru či v otevřeném vstupu kaple. Opakované prostředí, oděvy a insignie podporují
    souvislost se stejným slavnostním okruhem, nikoli přesné datum nebo identitu osob. Archivní název položky 128 uvádí „Vlevo
    Leonard Bugumský“, ale v levé části je několik mužů; přesný referent názvu a osoba vyžadují dokumentární ověření.
