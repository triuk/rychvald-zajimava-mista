batch_assessment:
  status: partially_verified
  conclusion: 'Dávka pokračuje historickou slavnostní sérií. Položka 131 zachycuje ženu ve zdobeném oděvu s kyticí před duchovním
    s řetězem nebo insignií. Položky 132 a 133 jsou dvě různé archivní reprodukce téhož podkladového záběru: muž v obleku
    stojí vedle duchovního, který drží zavinuté dítě a kytici; položka 133 zachovává širší okolí. Jde o dva soubory, ale pouze
    jeden nezávislý obrazový doklad. Položka 134 zachycuje další projev duchovního s papírem a položka 135 zaplněný interiér
    s účastníky v dřevěných lavicích. Snímky podporují společný slavnostní okruh, nikoli přesné datum, účel dětského úkonu
    nebo identity osob.'
