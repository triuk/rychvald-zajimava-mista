batch_assessment:
  status: partially_verified
  conclusion: Dávka pokračuje venkovní historickou slavnostní sérií. Položka 136 zachycuje skupinu mužů v duchovních oděvech
    s knihami, přičemž několik osob má otevřená ústa a zřejmě zpívá. Položka 137 zachycuje početné shromáždění, dvě ženy ve
    zdobeném oděvu a ženu stojící zády s pozvednutou paží, jejíž gesto odpovídá řízení společného zpěvu. Položka 138 spojuje
    dva duchovní s knihami, dvě zdobeně oděné ženy, děti a vysoké žerdi nebo prapory. Položka 139 zachycuje samostatný projev
    duchovního s knihou a výrazným řetězem u oltáře. Položka 140 dokumentuje velmi početný dav na zalesněném svahu, několik
    deštníků a fotografa s fotoaparátem. Sdílené prostředí, účastníci a pořadí podporují společný slavnostní okruh, nikoli
    automaticky jediný den, přesné datum nebo identity osob.
  basis:
  - full_image_visual_review
  - architectural_and_personnel_cross_image_comparison
  - archival_sequence
  - verified_repo_files
  related_open_items:
