batch_assessment:
  status: partially_verified
  conclusion: >-
    Položka 141 uzavírá ostravickou podsložku velkým skupinovým portrétem před vstupem do budovy. Archivní název
    snímek přibližně datuje do roku 1947 a označuje jej jako zájezd Rychvaldských s biskupem; obraz sám potvrzuje
    pouze skupinu dospělých a dětí, nikoli datum, místo, účel cesty ani identitu biskupa. Položky 142 až 145 otevírají
    novou pohřební sérii v témže chrámovém interiéru. Zachycují rakev pod velkým krucifixem, květiny, věnce a svíce;
    první dva záběry také uniformované muže stojící u rakve a druhý záběr početné shromáždění. Na položkách 144
    a 145 stojí u rakve čtyři osoby v dlouhých tmavých oděvech. Název podsložky připisuje sérii pohřbu faráře ThDr.
    Karla Vodičky v červnu 1970, avšak tato atribuce není obrazem samostatně potvrzena.
  basis:
    - full_image_visual_review
    - cross_image_interior_comparison
    - archival_filename_and_folder_context
    - embedded_metadata_inspection
    - verified_repo_files
  related_open_items:
    - URB-U-0067
    - URB-U-0070
