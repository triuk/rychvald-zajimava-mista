batch_assessment:
  status: partially_verified
  conclusion: >-
    Dávka pokračuje pohřební sérií. Položka 146 zachycuje stojící osobu v dlouhém tmavém oděvu u rakve nebo katafalku, věnců
    a svící a řady sedících účastníků. Položka 147 dokumentuje zaplněný interiér pod varhanní kruchtou; několik osob v přední
    řadě drží kapesníky u obličeje. Položka 148 zachycuje vynášení rakve z budovy, na níž je čitelný nápis „HUSOVA ČESKOSLOVENSKÁ
    BOHOSLOVECKÁ FAKULTA V PRAZE“. Tento nápis dokládá označení budovy zachycené na fotografii, nikoli sám o sobě identitu
    zemřelého, přesné datum nebo přesnou adresu. Položky 149 a 150 zachycují bezprostředně navazující venkovní situaci před
    stejným vstupem: několik osob v uniformách, salutování, osobu s četnými dekoracemi a účastníky stojící ve dveřích. Číslo
    5 je viditelné na fasádě. Organizace uniformovaných osob, status čestné stráže a všechny identity zůstávají neurčeny.
  basis:
    - full_image_visual_review
    - cross_image_sequence_comparison
    - manual_scene_text_transcription
    - embedded_metadata_inspection
    - verified_repo_files
  related_open_items:
    - URB-U-0067
