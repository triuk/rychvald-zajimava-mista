batch_assessment:
  status: partially_verified
  conclusion: Dávka uzavírá šestou podsložku. Položka 151 zachycuje další venkovní situaci před vstupem Husovy československé
    bohoslovecké fakulty v Praze s civilními, duchovními a uniformovanými účastníky. Položka 152 zachycuje ženu v tmavém oděvu
    doprovázenou dvěma muži na schodech téhož vstupu; identity ani přesný vztah osob nejsou obrazem určeny. Položka 153 ukazuje
    oltář s velkým krucifixem, svícemi, květinami a malým rámovaným portrétem s černou stuhou; umístění v Rychvaldě pochází
    z archivního názvu. Položka 154 je bližší záběr stejného pietního uspořádání a portrétu, jehož identifikace jako Karla
    Vodičky pochází z archivního názvu. Položka 155 je přesný binární duplikát urbanek-ccs-059 pod jinou archivní cestou.
    Deska čitelně uvádí jména, životní data a role Karla Vodičky a jméno a životní data Libuše Vodičkové. Text desky dokládá
    znění nápisu, nikoli sám o sobě historickou správnost údajů. Fotografické metadata položky 155 uvádějí pořízení 14. října
    2010; nejde o datum instalace desky.
