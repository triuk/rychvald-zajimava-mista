batch_assessment:
  status: partially_verified
  conclusion: 'Dávka otevírá sedmou podsložku, kterou archivní název připisuje pohřbu biskupa Ferdinanda Stibora v říjnu 1956.
    Položka 156 je samostatný venkovní portrét staršího muže; jméno a rok pocházejí pouze z názvu souboru. Položky 157 a 158
    zachycují stejný pohřební interiér s otevřenou rakví, viditelným tělem, vysokými svícemi, květinami a několika stojícími
    účastníky. Umístění v radvanickém Husově sboru a označení účastníků jako čestné stráže jsou archivní tvrzení, která obraz
    sám plně nepotvrzuje. Položky 159 a 160 zachycují navazující venkovní situaci před vstupem: skupinu osob v dlouhých tmavých
    oděvech s výraznými řetězy nebo medailony, civilní účastníky a následně početné shromáždění s prapory. Identity, úřady,
    organizace praporů, přesné datum, místo a sled obřadu zůstávají neověřeny.'
  basis:
  - full_image_visual_review
  - cross_image_sequence_comparison
  - manual_scene_text_review
  - embedded_metadata_inspection
  - exact_git_blob_verification
  related_open_items:
  - URB-U-0071
