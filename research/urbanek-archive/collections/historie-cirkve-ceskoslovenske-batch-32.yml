next_action: Pokračovat položkami urbanek-ccs-161 až urbanek-ccs-165, tedy soubory 6 až 10 v téže podsložce. Celou pohřební
  sérii porovnat s nekrologem, smutečním oznámením, programem pohřbu, církevní kronikou, dobovým tiskem a materiály radvanického
