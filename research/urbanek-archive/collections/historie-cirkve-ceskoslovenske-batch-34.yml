  conclusion: Položky 166 až 170 pokračují v pohřební venkovní sekvenci. Položky 166 a 169 zachycují tutéž nebo bezprostředně
    navazující část průvodu s bohatě zdobenou uzavřenou rakví nesenou několika muži v dlouhých tmavých oděvech. Položky 167
    a 168 zachycují skupiny osob s řetězy a medailony kráčející ulicí a položka 170 širší průvod s duchovními a civilními
    účastníky. Obrazová návaznost podporuje jednu událost, ale sama nepotvrzuje Ferdinanda Stibora, říjen 1956, přesné místo,
    identity a úřady osob ani úplnou trasu a program pohřbu.
