batch_assessment:
  status: partially_verified
  conclusion: 'Položky 171 až 175 uzavírají dvacetisnímkovou podsložku. Zachycují pokračování uličního průvodu: skupiny nesoucí
    několik velkých květinových věnců, osoby v dlouhých tmavých oděvech s knihami nebo deskami, širší pohled na průvod s nesenou
    zdobenou rakví, bližší záběr stejné nebo bezprostředně navazující situace a početný civilní zástup. Obrazová návaznost
    podporuje jednu událost, ale sama nepotvrzuje Ferdinanda Stibora, říjen 1956, přesné místo, identitu rakve, osoby, organizace
    ani úplnou trasu a program.'
