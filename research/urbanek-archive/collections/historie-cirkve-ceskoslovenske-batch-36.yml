batch_assessment:
  status: partially_verified
  conclusion: Položky 176 až 180 tvoří obrazově souvislou sérii jedné bohoslužby nebo bezprostředně navazujícího církevního
    obřadu ve stejném interiéru. Zachycují několik osob v dlouhých tmavých oděvech u oltáře pod krucifixem, kalich a knihy,
    gesto se vzpaženýma rukama, shromáždění v lodi a na galerii, prapor nebo korouhev, řečníka u pultu a obřadní úkon mezi
    dvěma muži u oltáře. Archivní název připisuje sérii faráři Leonardu Bogumskému, Doubravě a neznámým oslavám, ale fotografie
    samy nepotvrzují osobu, místo, datum, účel slavnosti ani přesný liturgický úkon.
