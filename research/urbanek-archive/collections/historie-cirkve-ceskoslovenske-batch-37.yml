batch_assessment:
  status: partially_verified
  conclusion: Položky 181 až 185 tvoří obrazově souvislou sekvenci jedné bohoslužby nebo bezprostředně navazujícího církevního
    obřadu ve stejném interiéru. Čtyři záběry zachycují oltář s figurálním obrazem, svícemi, květinami a textilií s částečně
    čitelným biblickým textem a odkazem 1 Petr 4,11; další snímek zachycuje kazatele u vyvýšené dřevěné kazatelny. Archivní
    název připisuje událost roku 1969, evangelickému chrámu na Ostravici a ekumenickému charakteru, ale fotografie samy nepotvrzují
    rok, přesné místo, denominace, jména účastníků ani program.
