  conclusion: 'Položky 186 až 190 tvoří začátek výročního kalendáře pro rok 2015: titulní stranu, textový historický souhrn
    1920–2015 a měsíční strany leden až březen. Měsíční strany znovu používají dříve samostatně evidované fotografie stavby,
    původního interiéru a skupin rady starších. Kalendář je proto sekundární kompilace, nikoli další nezávislý obrazový doklad
    zachycených událostí. Čitelné titulky a historická tvrzení dokládají znění kalendáře, nikoli automaticky jejich historickou
    správnost.'
