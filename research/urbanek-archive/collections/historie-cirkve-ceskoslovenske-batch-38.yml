- id: urbanek-ccs-187
  archival_filename: 2.jpg
  dimensions_px:
  - 2385
  - 3354
  color_mode: CMYK
  visual_type: modern_commemorative_calendar_historical_narrative_page
  description: Textová strana s nadpisem 1920–2015. Souvislý historický přehled popisuje založení náboženské obce, výstavbu
    a výzdobu sboru, období polské a německé okupace, poválečné úpravy, zvony, faráře a novodobé kulturní aktivity.
  verified_from_image:
  - heading_1920_2015
  - dense_czech_historical_narrative
  - claims_about_foundation_construction_occupation_postwar_changes_bells_clergy_and_cultural_activities
  - chalice_and_cross_emblem
  text_review:
    status: visually_checked_good_readability
    transcription_scope: Hlavní tvrzení byla vytěžena; úplný doslovný přepis dekorativního písma zůstává součástí pozdějšího
      OCR review.
    selected_claims:
    - Založení Církve československé v Rychvaldu dne 11. 4. 1920 na schůzi v hostinci Na Fojtství za účasti Ferdinanda Stibora.
    - Rozhodnutí o stavbě roku 1923, položení základního kamene 29. září 1924 a slavnostní předání stavby 6. července 1925.
    - Plány připisované Ferdinandu Střelci a stavba firmě Otmara Pazourka z Moravské Ostravy.
    - Instalace varhan roku 1927, obrazy nad balkony roku 1932 a poválečné úpravy v letech 1945 až 1957.
    - Tvrzení o uzavření a změnách využití sboru během polské a německé okupace.
    - Tvrzení o dvou původních ocelových zvonech odlitých roku 1920.
    - Personální posloupnost Karla Vodičky, Gabriela Chrobáčka, Leonarda Bogumského a Jany Šilerové.
    - Tvrzení o urně Karla Vodičky za pamětní deskou, volbě Jany Šilerové biskupkou roku 1999 a ocenění roku 2014.
    historical_authority: not_established
