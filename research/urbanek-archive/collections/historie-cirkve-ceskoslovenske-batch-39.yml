batch_assessment:
  status: partially_verified
  conclusion: Položky 191 až 195 jsou měsíční strany duben až srpen výročního kalendáře 2015. Znovu používají dříve evidované
    fotografie zvonů, pěveckých sborů, prvního přijímání, husovské připomínky, svatby, křtu a přijímání. Novou informační
    vrstvu tvoří kalendářové popisky a datace; ty dokládají znění sekundární kompilace, nikoli automaticky historickou správnost.
    Jedna vložená fotografie veřejné prohlídky věže nebyla mezi dosud zpracovanými samostatnými položkami bezpečně přiřazena.
