batch_assessment:
  status: partially_verified
  conclusion: >-
    Položky 196 až 200 uzavírají výroční kalendář 2015: měsíce září až prosinec a
    závěrečnou textovou stranu. Měsíční strany znovu používají dříve evidované
    fotografie nástěnných maleb, interiéru, okupačně změněného průčelí, koncertů a
    duchovních. Některé vložené snímky nemají bezpečně přiřazenou samostatnou položku.
    Závěrečná strana výslovně děkuje Jaromíru Urbánkovi, obsahuje podpis čitelný jako
    Jana Šilerová a údaj „zpracováno: fa. Grafik Aja“. Tyto údaje částečně zpřesňují
    provenienci kalendáře, ale samy neurčují vydavatele, tiskárnu, právní subjekt,
    úplné autorství ani držitele práv.
