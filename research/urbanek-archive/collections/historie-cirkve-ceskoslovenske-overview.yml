rules:
- Filenames and folder names are archival metadata, not independent historical proof.
- Visual descriptions may be verified from the image; named persons, dates and events remain unverified until corroborated.
- Persons are not identified solely from facial appearance.
- Multiple archival reproductions of the same photograph are separate files but not independent event evidence.
- Exact binary duplicates under different paths are separate inventory items but only one independent image record.
- Chains, medallions, armbands, chalice-like emblems, headwear, books or procession position do not independently establish
  an office, organization or role.
