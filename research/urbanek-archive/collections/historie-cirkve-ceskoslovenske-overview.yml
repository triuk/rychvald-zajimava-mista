rules:
  - Filenames and folder names are archival metadata, not independent historical proof.
  - Visual descriptions may be verified from the image; named persons, dates and events remain unverified until corroborated.
  - Document text and scene text are recorded separately.
  - Every unresolved event, date, person, object history, archive gap, technical interpretation or truncated caption is linked to a stable uncertainty ID.
  - Persons are not identified solely from facial appearance.
  - A relative architectural or event sequence does not independently verify absolute dates from filenames.
  - Truncated filenames are not completed by guesswork.
  - Conflicting embedded metadata is preserved and explicitly evaluated rather than silently used as event dating.
  - Original files are not renamed, moved or modified.
