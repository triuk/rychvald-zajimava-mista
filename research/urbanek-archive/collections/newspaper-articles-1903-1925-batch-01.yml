method:
- Drive metadata verification and raw-file download from the canonical collection folder.
- Downloaded raw-file byte size and Git blob SHA comparison against the repository.
- SHA-256, dimensions, color mode, EXIF and GPS-field inspection.
- First visual/text classification of photographed newspaper material; masthead dates, issue numbers, headings and clearly readable wording are recorded as printed source content.
- Printed historical assertions are not promoted to independently verified facts during phase-1 indexing.
- Generic EXIF DateTime values without DateTimeOriginal are recorded only as digital-file metadata and not as the date of the historical newspaper issue or original clipping.
- A relationship between separate images is recorded only where directly supported by overlapping printed text, not from filename sequence alone.
- Exact binary duplicate check within the batch and search for matching Git blob SHA in already indexed source records.
batch_findings:
  general: Pět fotografických reprodukcí či výřezů historických novin `OBRANA SLEZSKA`, převážně z roku 1912, včetně dvou mastheadů s přesnými údaji vydání, textu k otázce školství a výřezu článku `Z Rychvaldu.`.
  exact_binary_duplicates_within_batch: 0
  exact_binary_duplicates_with_prior_index_found: 0
  exif_scope: img970.jpg a img975.jpg neobsahují EXIF. img971.jpg, img972.jpg a img976.jpg obsahují výrobce Canon a obecný EXIF DateTime `2013:05:29 14:30:23`, `2013:05:29 14:31:45` a `2013:05:29 14:32:38`; DateTimeOriginal není přítomen a model fotoaparátu není použitelně vyplněn. Žádný z pěti souborů neobsahuje GPS údaje.
  masthead_scope: Na img970.jpg je bezpečně čitelné `OBRANA SLEZSKA`, `číslo 17.`, `V Orlové, 26. dubna 1912.` a `III. ročník.`. Na img972.jpg je `OBRANA SLEZSKA`, `číslo 30.`, `V Orlové, 26. července 1912.` a `III. ročník.`. Na img976.jpg je `OBRANA SLEZSKA`, `číslo 40.`, `V Orlové, 4. října 1912.` a `III. ročník.`. Tyto údaje jsou evidovány jako tištěné údaje reprodukovaného periodika.
  article_scope: Na img970.jpg je čitelné záhlaví `Naše stanovisko.`, `III.` a `3. Školství.`; text obsahuje mimo jiné odkazy na Rychvald a další obce. img971.jpg je výřez textu, který se přímo překrývá s koncem textu viditelného na img970.jpg a pokračuje ve stejném článkovém textu. Na img975.jpg je bezpečně čitelné záhlaví `Z Rychvaldu.`; text pod ním obsahuje tištěná tvrzení o české škole a obecní správě. Obsah článků je evidován jako historický tiskový pramen, nikoli jako nezávisle ověřené skutkové tvrzení.
