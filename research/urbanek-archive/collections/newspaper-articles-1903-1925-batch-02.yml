method:
- Fresh Drive filename search followed by raw-file download for each item.
- Downloaded raw-file byte size and Git blob SHA comparison against the repository path.
- SHA-256, dimensions, color mode, EXIF and GPS-field inspection.
- First visual/text classification of photographed newspaper material; only directly visible masthead data, headings and wording are recorded.
- Printed historical assertions are preserved as claims of the printed source and are not promoted to independently verified facts during phase-1 indexing.
- Relationships between separate images are recorded only where direct printed-text overlap demonstrates continuity.
- Exact binary duplicate check within the batch and repository search for matching Git blob SHA in indexed source records.
batch_findings:
  general: Pět fotografických reprodukcí historických novinových výřezů vztahujících se k Rychvaldu, školství a obecním volbám; dva soubory tvoří přímo doloženou textovou sekvenci.
  exact_binary_duplicates_within_batch: 0
  matching_prior_index_blob_sha_found: 0
  exif_scope: Žádný z pěti JPEGů neobsahuje EXIF ani GPS údaje.
  relationship_scope: img984.jpg přímo pokračuje v textu viditelném na konci img983.jpg; návaznost je doložena překrývající se větou na hranici obou výřezů. U ostatních souborů není vztah k sousedním archivním číslům odvozován z názvu souboru.
  visible_text_scope: img979.jpg obsahuje `Číslo 39.`, `Dopisy.` a `Rychvald.`; datum vydání z tohoto výřezu není bezpečně doloženo. img983.jpg obsahuje `Politická hlídka.` a `Zákon o menšinovém školství.`. img985.jpg obsahuje masthead `SLEZAN`, `Ročník II.`, `V Pol. Ostravě, dne 8. března 1912.` a záhlaví `Obecní volby v Rychvaldě.`. img987.jpg obsahuje masthead `OBRANA SLEZSKA`, `V Orlové, 29. března 1912.`, `III. ročník.` a záhlaví `Haličské volby v Rychvaldě.`.
