batch_findings:
  general: Pět historických novinových reprodukcí vztahujících se k rychvaldským volbám, volebním seznamům a česko-polskému tématu; tři soubory vytvářejí přímo doloženou obrazovou/textovou sekvenci kolem článku o volebních seznamech.
  exact_binary_duplicates_within_batch: 0
  matching_prior_index_blob_sha_found: 0
  exif_scope: img989.jpg obsahuje výrobce Canon a obecný EXIF DateTime `2013:05:29 14:39:53`, ale ne DateTimeOriginal; model není použitelně vyplněn. Ostatní čtyři soubory EXIF neobsahují. Žádný z pěti souborů neobsahuje GPS údaje.
  relationship_scope: img990.jpg a img991.jpg zachycují překrývající se část téhož tištěného článku `Volební listiny jsou v Rychvaldě podruhé vyloženy.`. img991.jpg končí rozděleným slovem `česko-pol-` a img992.jpg začíná `ské zgody!`, čímž je přímo doloženo pokračování textu.
  visible_text_scope: img990.jpg obsahuje `OBRANA SLEZSKA`, `číslo 28.`, `V Orlové, 12. července 1912.`, `III. ročník.` a záhlaví `Volební listiny jsou v Rychvaldě podruhé vyloženy.`. img993.jpg obsahuje `OSTRAVSKÝ DENNÍK`, `Ročník VI.`, `V Mor. Ostravě, ve čtvrtek dne 18. října 1906.`, `Číslo 238.` a záhlaví `Boj—česko-polský.`.
