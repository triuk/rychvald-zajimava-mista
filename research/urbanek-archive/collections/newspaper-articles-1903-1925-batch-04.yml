method:
- Raw Drive download and exact byte-size/Git-blob comparison with the repository for all three files.
- SHA-256, dimensions, color mode, EXIF and GPS-field inspection for img995.jpg.
- Direct binary parsing of Thumbs.db as an OLE/Compound Document, including its Catalog stream, directory streams, MiniFAT/FAT chains and embedded JPEG decoding.
- Direct byte-level inspection of ZbThumbnail.info, including magic bytes, UTF-16 filename references and embedded JFIF start signatures; no generating application is inferred from the filename or format.
- Thumbnail pixel identity is used only to distinguish duplicate cache representations from additional missing image content.
- Printed historical assertions remain claims of the printed source and are not promoted to independently verified facts during phase-1 indexing.
batch_findings:
  img995_scope: img995.jpg is an overlapping photographic reproduction of the same `OSTRAVSKÝ DENNÍK` page/section visible in img993.jpg. It repeats the masthead fragment and `Boj—česko-polský.` article while extending farther downward. The direct visual/text overlap establishes the relationship; it is not inferred from filename order.
  exact_binary_duplicates_within_batch: 0
  exif_scope: img995.jpg contains no EXIF and no GPS metadata.
  thumbs_db_scope: Thumbs.db is an OLE/Compound Document. Its Catalog stream contains one GUID-like special record and 34 `.jpg` filename records. The compound document has 35 thumbnail data streams; all 35 contain JPEG data that was directly decoded. All 16 currently present standalone JPEG filenames occur in the catalog.
  thumbs_db_missing_names: Eighteen catalog filenames have no standalone full file in the current folder: `img965.jpg`, `img963.jpg`, `img964.jpg`, `img967.jpg`, `img968.jpg`, `img969.jpg`, `aaaa.jpg`, `img968aaaaa.jpg`, `img971aaaaa.jpg`, `img972aaa.jpg`, `img976aa.jpg`, `img983aaa.jpg`, `img988.jpg`, `img989aaa.jpg`, `img997.jpg`, `img999.jpg`, `img961.jpg`, `img962.jpg`.
  thumbs_db_duplicate_thumbnail_scope: Six missing-name thumbnails are pixel-identical to currently present standalone-image thumbnails: `aaaa.jpg` ↔ `img984.jpg`, `img971aaaaa.jpg` ↔ `img971.jpg`, `img972aaa.jpg` ↔ `img972.jpg`, `img976aa.jpg` ↔ `img976.jpg`, `img983aaa.jpg` ↔ `img983.jpg`, `img989aaa.jpg` ↔ `img989.jpg`. Among the remaining missing names, `img963.jpg` ↔ `img997.jpg`, `img968.jpg` ↔ `img968aaaaa.jpg`, and `img961.jpg` ↔ `img962.jpg` are pixel-identical thumbnail pairs. Therefore the cache proves 18 missing standalone filenames but only 9 additional distinct thumbnail-image contents not represented by the 16 current standalone JPEGs.
  zbthumbnail_scope: ZbThumbnail.info begins with magic bytes `zbex`. It contains 26 unique `.jpg` filename references: all 16 current standalone JPEG names plus ten names without standalone files: `img962.jpg`, `img963.jpg`, `img964.jpg`, `img965.jpg`, `img967.jpg`, `img968.jpg`, `img969.jpg`, `img988.jpg`, `img997.jpg`, `img999.jpg`. A byte scan finds 26 JFIF start signatures; 20 decode directly as standalone JPEGs from the marker, while six are not independently decodable by that method, so no stronger embedded-image count is claimed. These ten missing-name references independently cover the same 9 distinct missing thumbnail contents established from Thumbs.db, because the Thumbs.db thumbnails for `img963.jpg` and `img997.jpg` are pixel-identical.
