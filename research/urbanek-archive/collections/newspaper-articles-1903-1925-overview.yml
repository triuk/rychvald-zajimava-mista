interpretation_rules:
- The folder title and filenames are archival metadata and are not independent proof of publication date, article identity, page sequence, physical provenance or completeness.
- Printed masthead dates, issue numbers, periodical titles and article headings are direct source content of the photographed/reproduced newspaper material.
- Historical assertions printed in an article are preserved as claims of the printed source and are not automatically treated as independently verified facts.
- Generic EXIF DateTime without DateTimeOriginal is recorded only as digital-file metadata and is not used as the newspaper issue date or historical event date.
- Separate image files are linked as parts of one textual sequence only when direct printed-text overlap or another explicit source-level relation demonstrates it; numeric filename sequence alone is insufficient.
- Cropped or missing masthead/page data are left unresolved and are not reconstructed from neighboring filenames alone.
- Exact binary duplicates under different archive paths remain separate inventory items but constitute one independent source image where duplication is demonstrated.
