batch_findings:
  general: Jedna ručně popsaná rozřaďovací cedulka a čtyři fotografie novinových stran vztahujících se k událostem po mnichovské
    dohodě a k Těšínsku.
  visible_issue_identification: 'Pouze P1020275.JPG přímo zobrazuje masthead a úplné údaje vydání: České slovo, sobota 1.
    října 1938, ročník X, číslo 271. U ostatních stran není v aktuálním výřezu úplný masthead ani číslo strany.'
  capture_session: Všech pět souborů uvádí fotoaparát Panasonic DMC-TZ3 a EXIF DateTime 2013-02-15 mezi 11:36:52 a 11:39:25.
    Tyto časy popisují fotografování archivních předloh, nikoli vznik nebo vydání novin.
  exact_binary_duplicates_within_batch: 0
  visual_overlap: P1020274.JPG a P1020276.JPG zachycují stejnou část téže novinové strany v odlišně posunutém a přiblíženém
    výřezu; mají rozdílné binární hashe a zůstávají samostatnými položkami.
  sequence_note: Aktuální Git a Drive snapshot obsahuje po P1020281.JPG přímo P1020283.JPG; absence názvu P1020282.JPG sama
    o sobě není důkazem chybějícího originálu a bude posouzena společně s technickými soubory kolekce.
