batch_findings:
  general: Pět fotografií článkových výřezů věnovaných odstoupení a obsazování Těšínska, polským nárokům, plebiscitu
    a protestům ve Fryštátsku.
  issue_identification: Na žádném z pěti snímků není úplný masthead s datem, ročníkem a číslem vydání. Viditelné datace
    3. a 4. října jsou datace jednotlivých zpráv a nejsou automaticky převáděny na datum vydání.
  capture_session: P1020278.JPG až P1020281.JPG mají EXIF DateTime 2013-02-15 mezi 11:40:06 a 11:42:08. P1020283.JPG
    má stejné datum a zařízení, ale čas 15:51:36; nejde tedy o souvislou dvouminutovou sérii.
  exact_binary_duplicates_within_batch: 0
  visual_overlap: P1020278.JPG zachycuje v těsnějším výřezu stejnou část strany jako položka 005 (P1020277.JPG). Soubory
    mají rozdílné binární hashe a zůstávají samostatnými položkami.
  filename_sequence_note: P1020282.JPG není v aktuálním Git ani Drive snapshotu. Časový odstup před P1020283.JPG je evidován,
    ale bez technického důkazu se nevykládá jako chybějící archivní originál.
