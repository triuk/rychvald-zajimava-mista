batch_findings:
  general: Pět fotografií článkových výřezů o uprchlících z Těšínska, výrobě v obsazeném území, zahájení obsazování Fryštátska,
    českých školách a souvisejících evropských zprávách.
  issue_identification: Na žádném z pěti snímků není úplný masthead s datem, ročníkem a číslem vydání. Datace 4. a 6. října
    jsou součástí jednotlivých zpráv a nejsou automaticky převáděny na datum vydání.
  capture_session: Všechny soubory mají EXIF DateTime 2013-02-15 mezi 15:52:23 a 15:54:45 a uvádějí Panasonic DMC-TZ3.
  exact_binary_duplicates_within_batch: 0
  visual_overlap: P1020286.JPG až P1020288.JPG jsou tři překrývající se fotografie téže novinové strany. P1020287.JPG a P1020288.JPG
    mají téměř stejný výřez, ale odlišné rámování, velikost a binární hash.
  filename_sequence_note: Dávka plynule pokračuje od P1020283.JPG; dříve evidovaná absence P1020282.JPG zůstává pouze nejistotou
    posloupnosti bez důkazu chybějícího archivního originálu.
