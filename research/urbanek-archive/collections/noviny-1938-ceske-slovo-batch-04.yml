batch_findings:
  general: Pět fotografií novinových výřezů a celých stran o obsazování Fryštátska, polském starostovi, londýnské reakci na
    odstoupení presidenta, českých školách a převzetí Fryštátu s okolím.
  issue_identification: P1020292.JPG přímo ukazuje označení „ČESKÉ SLOVO“ a „Strana 2.“, ale datum, ročník ani číslo vydání
    nejsou viditelné. U ostatních snímků úplný masthead chybí. Datace Londýn 6. října patří jednotlivým zprávám a není automaticky
    převáděna na datum vydání.
  capture_session: Všechny soubory mají EXIF DateTime 2013-02-15 mezi 15:54:52 a 15:57:48 a uvádějí Panasonic DMC-TZ3.
  exact_binary_duplicates_within_batch: 0
  visual_overlap: P1020289.JPG a P1020290.JPG pokračují v překrývajících se detailech stránky fotografované v P1020286.JPG
    až P1020288.JPG; všechny soubory jsou binárně odlišné. P1020291.JPG opakuje článek „Zůstanou na Těšínsku české školy?“,
    ale má jiné sousední texty, proto se bez dalšího neurčuje jako stejná fyzická strana nebo stejné vydání.
  full_page_note: P1020292.JPG a P1020293.JPG jsou dvě odlišné téměř celostránkové fotografie s různými hlavními titulky a
    rozvržením.
  rychvald_note: V těle článku na P1020292.JPG je přímo čitelné jméno Rychvald; jde o textový výskyt v prameni, nikoli o nezávislé
    ověření popisované události.
