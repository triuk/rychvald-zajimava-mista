batch_findings:
  general: Pět fotografií novinových stran a výřezů o posledních dnech polského záboru Těšínska, převzetí Fryštátu, rozloučení
    Rychvaldu, vypovídání českých obyvatel a péči o uprchlíky v Moravské Ostravě.
  issue_identification: P1020295.JPG ukazuje částečné označení „ČESKÉ SLOVO“, ale bez data, ročníku a čísla vydání. Datace
    Mor. Ostrava 10. října a Praha 14. října jsou součástí jednotlivých zpráv a nejsou automaticky převáděny na datum vydání.
  capture_session: Všechny soubory uvádějí Panasonic DMC-TZ3 a EXIF DateTime 2013-02-15 mezi 15:58:01 a 16:01:54. P1020295.JPG
    má portrétní rozměry 2304 × 3072 px; ostatní čtyři snímky mají 3072 × 2304 px.
  exact_binary_duplicates_within_batch: 0
  visual_overlap: P1020294.JPG je těsnější a binárně odlišný záběr stejné novinové strany jako P1020293.JPG z předchozí dávky.
    U ostatních snímků nebyl v rámci dosud zpracovaných položek bezpečně stanoven překryv stejné fyzické strany.
  rychvald_note: P1020296.JPG obsahuje samostatný mezititulek „Jak se rozloučil Rychvald“. Jde o přímý textový výskyt v prameni,
    nikoli o nezávislé ověření události popisované článkem.
