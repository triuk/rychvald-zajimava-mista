batch_findings:
  general: Pět fotografií novinových výřezů o německo-polském srovnání, uprchlické dopravě na přívozském nádraží, vojenském
    dozoru na těšínských šachtách, místních zprávách z Těšínska a narození dítěte ve vagoně na nádraží v Orlové.
  issue_identification: Na žádném z pěti snímků není úplný masthead s datem, ročníkem a číslem vydání. Datace Praha 24. října
    a další časové údaje v textech patří jednotlivým zprávám a nejsou automaticky převáděny na datum vydání.
  capture_session: Všechny soubory uvádějí Panasonic DMC-TZ3 a EXIF DateTime 2013-02-15 mezi 16:05:07 a 16:08:37. P1020302.JPG
    a P1020303.JPG mají portrétní rozměry 2304 × 3072 px; ostatní tři snímky mají 3072 × 2304 px.
  exact_binary_duplicates_within_batch: 0
  visual_overlap: P1020301.JPG je těsnější a binárně odlišný záběr spodní části stejné novinové strany jako P1020300.JPG.
    U P1020302.JPG a P1020303.JPG se opakuje rubrikový nadpis „Zprávy z Těšínska“, ale bez dalšího se neurčují jako stejná
    fyzická strana nebo stejné vydání.
  quality_note: P1020299.JPG je výrazně rozostřený; bezpečně se přepisuje pouze hlavní titulek „Němci lepší než Poláci“.
  locality_note: P1020302.JPG přímo zmiňuje Orlovou, Petřvald, Karvinsko a Suchou. P1020303.JPG přímo váže článek k nádraží
    v Orlové. Jde o textové výskyty v prameni, nikoli o nezávislé ověření popisovaných událostí.
