batch_findings:
  general: Tři poslední obsahové fotografie kolekce zachycují regionální zprávy z Doubravy, článek o opakování některých sňatků
    na Těšínsku, autobusový jízdní řád a protest uprchlíků z Petřvaldu.
  issue_identification: Na žádném ze tří snímků není úplný masthead s datem, ročníkem a číslem vydání. Datum vydání proto
    není odvozováno z obsahu ani z pořadí fotografií.
  capture_session: Všechny soubory uvádějí Panasonic DMC-TZ3 a EXIF DateTime 2013-02-15 mezi 16:08:51 a 16:10:53. P1020304.JPG
    má portrétní rozměry 2304 × 3072 px; P1020305.JPG a P1020306.JPG mají 3072 × 2304 px.
  exact_binary_duplicates_within_batch: 0
  visual_overlap: Mezi třemi soubory dávky ani proti bezprostředně předcházejícím položkám nebyl bezpečně stanoven překryv
    stejné fyzické strany. P1020304.JPG opakuje rubrikový nadpis „Zprávy z Těšínska“, který se objevuje i na položkách 029
    a 030, ale to samo nedokládá stejnou stranu nebo vydání.
  locality_note: P1020304.JPG přímo zmiňuje Doubravu a P1020306.JPG Petřvald. Jde o textové výskyty v prameni, nikoli o nezávislé
    ověření popisovaných událostí.
  content_completion: Po této dávce je vizuálně klasifikováno a zdrojově indexováno všech 33 JPEGů kolekce. Zbývají dva technické
    soubory Thumbs.db a ZbThumbnail.info.
