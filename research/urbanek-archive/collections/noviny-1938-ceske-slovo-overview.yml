interpretation_rules:
- Visible newspaper titles, dates, issue numbers and headlines are transcribed as printed wording; the historical claims within
  articles are not independently verified in this indexing pass.
- EXIF DateTime values describe the modern photographic reproduction session and are not publication dates.
- A repeated photograph of the same page is retained as a separate inventory item when its binary file and framing are distinct.
- The handwritten title card is archival organization evidence only and does not prove that every following image concerns
  Poland or belongs to one complete issue.
- A gap in camera filename numbering is recorded as a sequence uncertainty, not as a missing full original without corroborating
  cache or manifest evidence.
