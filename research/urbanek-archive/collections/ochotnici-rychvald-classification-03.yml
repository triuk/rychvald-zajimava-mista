    visual_type: contemporary_photograph_of_exhibition_panel
    description: >-
      Celkový pohled na výstavní panel věnovaný účasti rychvaldského souboru s
      Večerem tříkrálovým na přehlídkách roku 1960. Panel obsahuje festivalový
      plakát, kroměřížský program, novinové stránky, články, fotografie a výstřižky.
    grouping:
      group_id: exhibition-kromeriz-and-vecer-trikralovy
      role: overview_reference
    ocr:
      document_text: not_applicable
      scene_text: candidate_selective
      note: >-
        Plný OCR vložených dokumentů neprovádět z celkového záběru; většina je
        zastoupena samostatnými kvalitnějšími soubory. Přepsat jen nadpisy potřebné
        k potvrzení rozvržení panelu a vztahů mezi položkami.

