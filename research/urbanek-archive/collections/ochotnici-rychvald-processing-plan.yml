principles:
  - Prefer native text extraction over OCR when an original editable document exists.
  - Use the most complete image as the primary OCR source and alternate captures only for verification.
  - Split composite pages by physical article boundaries.
  - Preserve printed spelling and mark unreadable text instead of reconstructing it.
  - Do not repeat full OCR from exhibition-panel overviews when individual source images exist.
  - Keep archival filename labels separate from independently verified identities.

