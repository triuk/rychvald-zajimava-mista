method:
- Fresh Drive filename search was used where a previously captured Drive ID no longer resolved.
- Raw Drive files were downloaded and compared by byte size and Git blob SHA with the repository path.
- SHA-256, dimensions, color mode, EXIF and GPS-field inspection was performed on every file.
- First visual classification records only directly visible architecture, room features and inscriptions; exact addresses, building functions, ownership and relationships between separate scenes are not inferred from appearance alone.
- EXIF DateTimeOriginal is recorded as technical capture metadata, not as proof of building age or historical event date.
- Exact binary duplicate check within the batch and repository search for matching Git blob SHA in already indexed source records.
