method:
- Raw Drive files were downloaded and compared by byte size and Git blob SHA with the repository path.
- SHA-256, dimensions, color mode, EXIF and GPS-field inspection was performed on every file.
- First visual classification records only directly visible landscape, architecture, signage and inscription evidence.
- Direct image-feature correspondence is used to record scene/detail relationships only where the photographed object is demonstrably the same; sequence or EXIF proximity alone is insufficient.
- Generic EXIF DateTime values without DateTimeOriginal are recorded only as file metadata and not as historical or object dates.
- Memorial inscription wording is recorded as source-visible text; historical assertions contained in the inscription are not independently verified during phase-1 indexing.
- Exact binary duplicate check within the batch and repository search for matching Git blob SHA in already indexed source records.
