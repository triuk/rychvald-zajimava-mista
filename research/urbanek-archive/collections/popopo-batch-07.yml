method:
- Fresh Drive folder metadata and raw-file downloads were used for all three files.
- Downloaded byte sizes and recomputed Git blob SHA values were compared with the repository paths.
- SHA-256, dimensions, color mode, EXIF and GPS fields were inspected for mlyn_0001a.jpg.
- Thumbs.db was parsed from its OLE/Compound File Binary structure, including FAT, mini-FAT, directory, Catalog stream and numbered thumbnail streams.
- ZbThumbnail.info was inspected by binary signature, UTF-16 filename references and directly decodable embedded JPEG/JFIF streams.
- Cached thumbnails were compared directly with the 31 current collection JPEGs and with one another so missing filenames are not automatically counted as separate missing image contents when they represent the same underlying image.
- Cache files are derivative technical records. Their references prove missing full originals under the project cache rule but are not added to the 616-item current Git snapshot inventory.
batch_findings:
  exact_binary_duplicates_within_batch: 0
  mlyn_scope: mlyn_0001a.jpg is a digital reproduction of a monochrome/sepia archival photograph showing a substantial multi-part building complex among vegetation. The archival filename is not used as proof that the depicted building is a mill. Exact identity, function, locality and historical date remain unverified.
  mlyn_metadata: Canon MP610 series; MP Navigator EX 1.0; generic EXIF DateTime `2012:04:18 09:02:04`; DateTimeOriginal absent; GPS absent. These are technical reproduction metadata only.
  thumbs_db_scope: Thumbs.db has OLE/CFB magic `D0 CF 11 E0 A1 B1 1A E1`. Its Catalog contains 58 records: one GUID-like special record and 57 `.jpg` filename records. All 58 numbered thumbnail streams contain directly decodable JPEG data after the cache stream prefix. All 31 current collection JPEG names are represented; 26 filename records have no standalone full file in the current folder.
  missing_name_scope: The 26 missing standalone names are [P1010069.JPG, P1010743.JPG, P1010745.JPG, P1010747.JPG, P1010748.JPG, img248a.jpg, 8006.jpg, 8006a.jpg, 8014.jpg, 8172.JPG, img178.jpg, img248.jpg, mlyn_0001.jpg, P1010750.JPG, P1010751.JPG, P1010755.JPG, P1010754a.jpg, silma.jpg, img075.jpg, img698.jpg, P1010066.JPG, P1010763.JPG, P1010765.JPG, img706.jpg, img707a.jpg, img707.jpg].
  same_underlying_image_variants: Direct thumbnail comparison establishes ten missing-name variants as the same underlying image as a current file: P1010743.JPG ↔ P1010743a.jpg; P1010747.JPG ↔ P1010747a.jpg; P1010748.JPG ↔ P1010748a.jpg; img178.jpg ↔ img178a.jpg; mlyn_0001.jpg ↔ mlyn_0001a.jpg; P1010755.JPG ↔ P1010755a.jpg; P1010754a.jpg ↔ P1010754.JPG; img698.jpg ↔ img698a.jpg; P1010066.JPG ↔ P1010066a.jpg; P1010763.JPG ↔ P1010764.JPG. These are not counted as additional missing image contents.
  distinct_missing_content_scope: After those ten correspondences, 16 cache-only thumbnail image contents remain without a current standalone full image: [P1010069.JPG, P1010745.JPG, img248a.jpg, 8006.jpg, 8006a.jpg, 8014.jpg, 8172.JPG, img248.jpg, P1010750.JPG, P1010751.JPG, silma.jpg, img075.jpg, P1010765.JPG, img706.jpg, img707a.jpg, img707.jpg]. Their thumbnails are visually distinct as image records; images of the same building or subject from different viewpoints remain distinct photographs.
  zbthumbnail_scope: ZbThumbnail.info begins with ASCII magic `zbex`, contains all 57 JPEG filename references found in the Thumbs.db catalog and contains 57 JFIF start signatures. Each of the 57 streams is directly decodable as a JPEG when read from its JPEG marker. Thus it independently corroborates the filename population represented by Thumbs.db.
