interpretation_rules:
- The folder title `popopo` and filenames are archival metadata only and do not independently establish subject, date, location, identity or intended grouping.
- A personal name in a filename is an archival attribution, not independent proof of the depicted person's identity.
- EXIF DateTimeOriginal is recorded as digital capture metadata and is not used as the historical date of reproduced archival material or as evidence of building age.
- Persons are not identified from facial appearance alone.
- Uniform-like clothing, flags, public ceremony, architecture, room form, landscape form and business signage support descriptive classification only; exact event, organization, rank, place, building function and date require corroboration.
- Visible inscriptions, house-like numbers and dates are source content; they do not automatically prove a full address, historical date or institutional identity.
- Similar architecture, landscape form or close EXIF times alone do not establish that separate files depict the same physical site or route.
- Exact binary duplicates under different archive paths remain separate inventory items but constitute one independent source image where duplication is demonstrated.
