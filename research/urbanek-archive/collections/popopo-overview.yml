interpretation_rules:
- Folder and filenames are archival metadata, not independent proof of identity, date, place or function.
- EXIF DateTimeOriginal and generic DateTime are technical digital-file metadata only.
- Visible inscriptions, captions and manuscript dates are source content; underlying historical claims require verification.
- Persons are not identified from appearance alone.
- Thumbnail cache references absent as standalone files prove missing full originals under the archive rule, but visual variants of the same underlying image are not counted twice.
- Technical cache files are part of the 33-item snapshot but cached-only image references are derivative evidence, not additional current snapshot files.
