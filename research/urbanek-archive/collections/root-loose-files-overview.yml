interpretation_rules:
- Visible newspaper title, issue date, number and page are transcribed as source content; embedded EXIF dates describe later
  digitization or postprocessing.
- An archival filename is evidence of archival labeling, not independent proof of an event date, unit, person or historical
  interpretation.
- Persons in photographs are not identified from facial appearance.
- The secret 1945 list is indexed at document level; personal data in its table are not reproduced in summary metadata.
- A uniform and an archival filename suggesting nationality or service are insufficient to establish institutional affiliation,
  rank, identity, date or place without documentary corroboration.
