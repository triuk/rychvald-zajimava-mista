batch_findings:
  general: Dvě fotografie zachycují exteriér budovy s přímo čitelným nápisem „MĚSTSKÝ ÚŘAD“. Tři fotografie pojmenované „Cudlín“
    zachycují tutéž upravenou veřejnou plochu s prosklenou budovou, obchody, květinovou výsadbou a kamenným vodním či výtvarným
    prvkem.
  location_scope: Zařazení do adresáře Rychvald je archivní metadata. U prvních dvou snímků je ověřen pouze obecný nápis „MĚSTSKÝ
    ÚŘAD“; přesná obec a u zbývajících tří snímků přesná lokalita a identita objektů nejsou z obrazu samostatně prokázány.
  capture_sessions: Budova úřadu 003.jpg a 005.jpg byly podle EXIF pořízeny fotoaparátem Panasonic DMC-FZ7 dne 2008-09-02
    v 08:58:51 a 09:01:46. Tři soubory Cudlín byly pořízeny týmž modelem dne 2009-08-28 mezi 15:55:29 a 15:56:43.
  exact_binary_duplicates_within_batch: 0
  known_cross_batch_duplicate: Git snapshot obsahuje pozdější cestu `Kopie - Budova úřadu 005.jpg` se stejným blob SHA jako
    `Budova úřadu 005.jpg`; bude inventarizována jako samostatná položka, ale nikoli jako nezávislý obrazový důkaz.
  sequence_note: Cudlín 033.jpg, 035.jpg a 037.jpg jsou tři binárně odlišné, časově těsně navazující pohledy na tutéž veřejnou
    plochu.
