batch_findings:
  general: Pět moderních reprodukčních fotografií staršího obrazového či dokumentárního materiálu; jedna vícepohledová pohlednice, jeden snímek sakrální stavby, dvě fotografované místopisné mapy a jedna fotografovaná rukopisná stránka.
  exact_binary_duplicates_within_batch: 0
  capture_sessions: Soubory P1010069.JPG a P1010070.JPG uvádějí Panasonic DMC-TZ3 a časy 2010-02-28 12:38:10 až 12:38:56; P1010071.JPG a P1010072.JPG stejný přístroj a časy 2010-04-27 11:11:45 až 11:12:51; P1010114.JPG čas 2010-09-01 15:17:19.
  visible_text_scope: Texty „Pozdrowienie z Rychwaldu“, „PRAVDA VÍTĚZÍ“, „Místopis kolem a po r. 1900.“ a „Místopis před r. 1900.“ jsou evidovány jako viditelné znění fotografovaných předloh. Bez dalšího neprokazují původní dataci, autora, vydavatele ani přesnou identitu zobrazených objektů.
  manuscript_scope: U P1010114.JPG je bezpečně rozpoznána fotografovaná rukopisná stránka s číslem „- 25 -“; plný přepis kurzivního textu a historická interpretace jsou odloženy, aby nebyly doplňovány nejisté znaky či jména.
