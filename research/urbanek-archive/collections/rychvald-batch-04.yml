batch_findings:
  general: Tři moderní fotografické reprodukce rukopisných místněhistorických stran a dva bezprostředně po sobě pořízené barevné snímky téhož
    kamenného hřbitovního kříže či pomníku.
  exact_binary_duplicates_within_batch: 0
  same_subject_sequence: '`Rychvald2009 003.jpg` a `Rychvald2009 004.jpg` zobrazují tentýž kamenný hřbitovní kříž z mírně odlišného záběru; EXIF
    časy se liší o 13 sekund a soubory nejsou binárně totožné.'
  capture_sessions: P1010115.JPG až P1010117.JPG uvádějí Panasonic DMC-TZ3 a časy 2010-09-01 15:18:04 až 15:27:38. Rychvald2009 003.jpg a Rychvald2009
    004.jpg uvádějí Panasonic DMC-FZ7 a časy 2009-09-01 09:15:37 a 09:15:50.
  visible_text_scope: Čísla stran, nadpis „Škola živnostenská pokračovací.“ a bezpečně čitelné letopočty či datované položky jsou evidovány jako
    text fotografovaných rukopisných předloh. Bez dalšího neprokazují historickou správnost, autorství ani původ dokumentu.
  monument_scope: U dvojice hřbitovních snímků je bezpečně rozpoznán kamenný kříž s figurální výzdobou. Slabý nápis či datace na podstavci nejsou
    přepisovány, protože nejsou dostatečně čitelné; přesný hřbitov, identita a datace pomníku zůstávají neověřeny.
