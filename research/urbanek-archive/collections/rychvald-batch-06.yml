batch_findings:
  general: 'Pět moderních barevných fotografií: železniční scéna, informační označení přírodní rezervace u vodní plochy, dva záběry pobřežního
    zařízení a širší hřbitovní kontext dříve zachyceného kamenného kříže.'
  exact_binary_duplicates_within_batch: 0
  capture_sessions: Zp1109 340.jpg až Zp1109 390.jpg uvádějí Panasonic DMC-FZ7 a časy 2009-10-21 15:29:22 až 15:47:28. zzz-satiny 255.jpg uvádí
    tentýž model a čas 2009-11-02 14:10:36.
  visible_text_scope: Na položce 027 jsou bezpečně čitelné texty „PŘÍRODNÍ REZERVACE“ a „Přírodní rezervace Skučák“. Menší text informační tabule
    se nepřepisuje, pokud není bezpečně čitelný.
  same_subject_sequences: Položky 028 a 029 jsou dva rozdílné záběry stejného zařízení u vodní plochy. Položka 030 poskytuje širší kontext téhož
    kamenného kříže, který byl zblízka zachycen na položkách 019 a 020; soubory nejsou binární kopie.
  identity_scope: Přesná funkce železniční budovy ani pobřežního zařízení se neurčuje podle vzhledu. Přesný hřbitov a historická identita či datace
    kříže zůstávají neověřeny.
