interpretation_rules:
- The folder title Rychvald and individual filenames are archival metadata, not independent proof of exact location, authorship or date.
- Visible signs and captions are transcribed as photographed wording; their underlying historical claims, abbreviations and dates require corroboration.
- EXIF timestamps are preserved as capture metadata and are not historical-event dates.
- Exact binary duplicates under different filenames remain separate inventory items but count as one independent image.
- People, events and institutional identities in historical photographs are not identified solely from appearance, uniforms, costumes, flags or architecture.
- Names or other personal inscriptions visible on grave markers are not used to identify persons.
- Item 030 is linked to items 019 and 020 as the same monument by distinctive visible form and details; this does not establish the monument's formal identity, date or exact cemetery.
- Item 031 is a further cemetery view captured on the same day shortly after item 030; exact cemetery identity is not inferred from filename or appearance.
