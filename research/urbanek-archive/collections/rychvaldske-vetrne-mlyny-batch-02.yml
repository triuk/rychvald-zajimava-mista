findings:
  - Položky 013–015 jsou pravděpodobné zdrojové verze s vyšším rozlišením pro upravené kořenové položky 004–006.
  - Uživatel potvrdil název větrný mlýn u Hebdy a funkční spojení větrného kola s mlecím soustrojím.
  - Databáze Povětrník záznam 175 a přesná obrazová shoda ověřují polohu U Skučáku 54, katalogové číslo mlýnek 48 a objektové GPS 49.8669433, 18.3910689.
  - Dřívější inference Polní 1275 je překonaná a pro lokalizaci objektu se nepoužívá.
  - Položka 018 je kandidát na chybné zařazení; nepřesouvat ji bez dalšího dokladu.
  - Položky 021 a 022 se ponechávají na původních místech navzdory přesným duplicitám.
