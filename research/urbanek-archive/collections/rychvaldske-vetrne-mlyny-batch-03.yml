  - Položky 031 a 032 jsou časová a obrazová série stejné trojice kamenů.
  - Uživatel potvrdil, že náčrt 036 a fotografie 037–038 zachycují stejné zařízení označené v náčrtu jako mlýnek za domem č. 339; přesná historická poloha je vedena v URB-U-0038.
