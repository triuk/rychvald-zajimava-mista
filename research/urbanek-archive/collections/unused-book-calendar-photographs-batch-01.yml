batch_findings:
  general: Pět obrazových souborů – reprodukce starší mapy s německými a latinskými popisky, fotografie věže stavby se sakrální architekturou, hřbitovní scéna s centrálním křížem, početné venkovní shromáždění kolem hořící hranice a heraldické vyobrazení korunovaného štítu.
  exact_binary_duplicates_within_batch: 0
  exif_scope: Čtyři z pěti JPEGů obsahují EXIF DateTimeOriginal; žádný z pěti neobsahuje GPS údaje. Hodnoty jsou evidovány jako technická metadata digitálních souborů, nikoli jako samostatný důkaz historické datace zobrazeného motivu nebo události.
  visible_text_scope: Na 045.jpg jsou bezpečně čitelné mimo jiné mapové popisky „Mähren“ a „Oder Fluvius“. Další drobné historické popisky nejsou v této první inventarizační fázi plošně přepisovány. Na ostatních čtyřech snímcích nebyl pro identifikaci použit žádný bezpečně čitelný text v obraze.
  filename_scope: Název `2011cIsenburgové z Birsteinu.jpg` je archivní metadata. Z obrazu samotného není bez dalšího pramene potvrzeno, komu heraldické vyobrazení náleží ani zda část `2011c` představuje datum, pořadové označení nebo jiný archivní údaj.
