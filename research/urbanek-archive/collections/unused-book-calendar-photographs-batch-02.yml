batch_findings:
  general: Pět obrazových souborů – zděné schodiště do podzemního či suterénního prostoru, soubor odlomených barevně upravených fragmentů, reprodukce situačního plánu vodovodu pro velkostatek v Rychvaldě, černobílá fotografie osob provádějících zemní práce a černobílý exteriér staršího stavebního areálu.
  exact_binary_duplicates_within_batch: 0
  exact_binary_duplicates_with_prior_index: 1
  duplicate_scope: 327a.jpg je přesná binární duplicita dříve indexovaného `fotodokument/img041.jpg` (`urbanek-fotodokument-root-006`): shodná velikost 587865 B, Git blob SHA `1d9cc6086818160982d6854da7b6d6857292019b` a SHA-256 `a20b389ac31ff0c253a0e9be238961a9173cbf5cd994d1e1bce5d6967d2ba922`. Obě archivní cesty zůstávají zachovány, ale obraz se nepovažuje za dva nezávislé obrazové důkazy.
  exif_scope: 2061.JPG, 2063.JPG a 2069.jpg obsahují EXIF DateTimeOriginal; 209.jpg a 327a.jpg EXIF nemají. Žádný soubor dávky neobsahuje GPS údaje.
  plan_text_scope: Na 2069.jpg jsou bezpečně čitelné mimo jiné `Vodovod pro velkostatek v Rychvaldě.`, `Situace.`, měřítko `1:2880`, `Ing. M. Rosický, Orlová.`, místní popisky `Heřmanice` a `Rychvald`, firemní označení `Závod pro stavbu vodovodů ING. MIROSLAV ROSICKÝ ORLOVA` a datace `Orlová, v červnu 1934.`. Tyto údaje jsou evidovány jako viditelný obsah plánu.
  dating_scope: Viditelná datace plánu `v červnu 1934` je údaj samotného zobrazeného dokumentu. EXIF DateTimeOriginal 2069.jpg je `2012:03:11 10:37:36` a je evidován odděleně jako metadata digitálního snímku/reprodukce.
