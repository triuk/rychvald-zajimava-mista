batch_findings:
  general: Pět obrazových souborů – starší venkovská či hospodářská budova, upravený obdélný venkovní areál s budovou v pozadí, širší venkovská scéna s dřevěným domem a skupinou osob, velký skupinový snímek dětí a dospělého před budovou a skupinový portrét dospělých s viditelným zápisem `1928/29`.
  exact_binary_duplicates_within_batch: 0
  exact_binary_duplicates_with_prior_index_found: 0
  exif_scope: 333.jpg, 367.jpg a 5011b.jpg neobsahují EXIF. 369.jpg obsahuje obecný EXIF `DateTime` `2012:05:30 10:40:00` a údaj `Adobe Photoshop 7.0 CE`, ale ne DateTimeOriginal. 5005a.jpg obsahuje EXIF DateTimeOriginal `2012:03:15 16:52:47`; model fotoaparátu není použitelně vyplněn. Žádný z pěti souborů neobsahuje GPS údaje.
  visible_text_scope: Na tabuli před skupinou na 5005a.jpg je bezpečně čitelné `Pětitřídní škola v Rychvaldě`. Na 5011b.jpg je nad skupinou bezpečně čitelný zápis `1928/29`. Tyto údaje jsou evidovány jako viditelný obsah fotografického pramene.
  dating_scope: Zápis `1928/29` na 5011b.jpg není bez dalšího pramene automaticky ztotožněn s technicky ověřeným datem expozice fotografie. EXIF DateTimeOriginal 5005a.jpg a obecný EXIF DateTime 369.jpg jsou evidovány jako metadata digitálních souborů, nikoli jako historická datace zobrazených scén.
