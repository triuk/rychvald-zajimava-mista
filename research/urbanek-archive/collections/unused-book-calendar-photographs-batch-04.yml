batch_findings:
  general: Pět obrazových souborů – rozsáhlý zemní odkryv či prohlubeň s budovami na horním okraji, nízká stavba s krytým venkovním prostorem v lesním prostředí, dvojice kamenných kruhových prvků s radiálními drážkami, poškozená nástěnná malba a detail jiné či související poškozené nástěnné malby s lidskou postavou.
  exact_binary_duplicates_within_batch: 0
  exact_binary_duplicates_with_prior_index_found: 0
  exif_scope: 5048.jpg a 74.tif neobsahují EXIF. 7147.jpg obsahuje Panasonic DMC-TZ3 a DateTimeOriginal `2010:10:28 15:22:55`; 7185.JPG obsahuje Panasonic DMC-TZ3 a DateTimeOriginal `2011:11:15 12:20:52`; 73.jpg obsahuje Canon PowerShot G5 a DateTimeOriginal `2005:08:04 09:02:04`. Žádný z pěti souborů neobsahuje GPS údaje.
  tiff_scope: 74.tif je nekomprimovaný RGB TIFF o rozměrech 3463×3479 px a rozlišení uloženém jako 600 dpi; tyto technické údaje neurčují historický původ zobrazené malby.
  relationship_scope: 73.jpg a 74.tif oba zachycují poškozené malované vrstvy na zdivu či omítce. Jejich přesný vzájemný vztah, objekt, lokalita, autorství, námět a datace nejsou z obrazů samotných určeny.
