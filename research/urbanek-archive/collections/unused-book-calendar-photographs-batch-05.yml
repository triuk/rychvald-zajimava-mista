batch_findings:
  general: Pět obrazových souborů – fragment poškozené nástěnné malby s koňským povozem a architekturou, skupinový portrét s praporem a rokem 1929, velký skupinový portrét s částečně čitelným organizačním nápisem a údajem 1910–1930, architektonický detail s rytým nápisem a černobílý exteriér rozsáhlé vícepodlažní budovy.
  exact_binary_duplicates_within_batch: 0
  exact_binary_duplicates_with_prior_index_found: 0
  exif_scope: 75.tif neobsahuje EXIF. 8205.jpg má Canon a DateTimeOriginal `2012:04:17 11:42:56`; 8206.jpg má Canon a DateTimeOriginal `2012:04:23 10:06:03`; P1020271aaaaddd.jpg má Panasonic DMC-TZ3 a DateTimeOriginal `2012:11:20 12:05:04`. ggg.tif obsahuje obecný DateTime `2010:11:26 09:44:21` a software `Microsoft Windows Photo Gallery 6.0.6000.16386`, ale ne DateTimeOriginal. Žádný soubor neobsahuje GPS údaje.
  visible_text_scope: Na 8205.jpg jsou bezpečně čitelné `STRANA NÁR. SOCIALISTICKÁ`, `RYCHVALD` a rok `1929`. Na 8206.jpg je bezpečně čitelné `1910–1930` a horní organizační nápis je pouze částečně čitelný; nerozepisuje se. Na P1020271aaaaddd.jpg je z rytého nápisu bezpečně čitelné pouze `ANNO`; další znaky nejsou rekonstruovány.
  dating_scope: Rok 1929 a rozsah 1910–1930 jsou evidovány jako viditelný obsah fotografických pramenů. Nejsou automaticky ztotožněny s technickým datem expozice. EXIF a obecná metadata digitálních souborů jsou evidována odděleně.
  relationship_scope: 75.tif zachycuje poškozenou malovanou vrstvu podobně jako 73.jpg a 74.tif, ale přesný vzájemný vztah všech tří souborů není bez dalšího podkladu tvrzen.
