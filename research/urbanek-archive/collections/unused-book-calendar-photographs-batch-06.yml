method:
- Drive metadata verification and raw-file download from the canonical collection folder.
- Downloaded raw-file byte size and Git blob SHA comparison against the repository.
- SHA-256, dimensions, color mode, EXIF and GPS-field inspection for the three JPEGs.
- Binary OLE/Compound Document inspection of Thumbs.db, including directory-stream parsing, current filename-reference matching and direct decoding of embedded JPEG streams.
- Safe transcription of clearly readable wording; visual attire and decorative motifs are not used alone to assign a specific organization or identify people.
- The technical cache is treated as a derivative technical record, not as additional independent historical image evidence.
- Exact binary duplicate check within the batch and search for matching Git blob SHA in already indexed source records.
batch_findings:
  general: Tři obsahové obrazy – dekorativní koláž několika mužských portrétů s bezpečně čitelným mottem, drobná sloupková sakrální stavba a černobílý průvod či skupina osob na komunikaci – a jeden technický thumbnail cache soubor.
  exact_binary_duplicates_within_batch: 0
  exact_binary_duplicates_with_prior_index_found: 0
  exif_scope: img010aa.jpg obsahuje Canon a DateTimeOriginal `2013:06:28 09:55:14`; model není použitelně vyplněn. img037.jpg a img724.jpg EXIF neobsahují. Žádný z trojice JPEGů neobsahuje GPS údaje.
  visible_text_scope: Na img010aa.jpg je bezpečně čitelné `Bližnímu k ochraně, vlasti k oslavě!`. Další drobný text v dekorativní kompozici není v této první inventarizační fázi přepisován.
  identity_scope: Motto, oděv a dekorativní prvky na img010aa.jpg jsou evidovány jako vizuální údaje pramene; bez dalšího podkladu z nich není určována přesná organizace ani osoby.
  thumbs_db_scope: Thumbs.db je OLE/Compound Document cache. Obsahuje odkazy na všech 28 současných obsahových názvů této kolekce a 28 datových streamů s JPEG náhledy; všech 28 vložených JPEGů bylo přímo dekódováno. Cache je evidována jako odvozený technický soubor a náhledy nejsou počítány jako další nezávislé historické obrazy.
