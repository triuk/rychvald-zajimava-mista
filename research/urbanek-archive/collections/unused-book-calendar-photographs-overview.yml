interpretation_rules:
- The folder title and filenames are archival metadata; they may preserve an archival attribution but are not independent proof of subject identity, date, place, authorship or prior publication history.
- EXIF DateTimeOriginal is recorded as technical image metadata. For reproductions of older material it describes the digital image workflow rather than the historical date of the depicted source unless independently corroborated.
- A generic EXIF DateTime without DateTimeOriginal is recorded only as file metadata and is not treated as a verified capture date.
- A visible date printed or written on a reproduced historical source is source content and is recorded separately from EXIF metadata of the digital file.
- EXIF camera make/model and timestamp do not establish the identity or location of the photographed subject.
- Absence of GPS metadata means no geographic location is inferred from EXIF.
- Sacral architectural appearance supports descriptive classification only; exact building identity, denomination and location require corroboration.
- Persons are not identified from facial appearance alone.
- A crowd, ground work or other visible activity is described without assigning a specific event title, custom, organization or purpose unless directly supported.
- Heraldic motifs are described visually; an archival filename naming a family or person is retained as archival attribution but does not independently establish the armiger.
- Readable map, plan, board or handwritten wording verifies visible source text only. Wider historical claims, exact institution identity, project realization and georeferencing require corroboration.
- Exact binary duplicates under different archive paths remain separate inventory items but constitute one independent image where duplication is demonstrated.
