  handling_rules:
  - Archival names and folder labels are attribution metadata, not independent historical proof.
  - Persons are not identified solely from facial appearance.
  - Multiple reproductions of one photograph are not independent event evidence.
  - Chains, medallions, armbands, chalice-like emblems or headwear do not independently establish an office, organization
    or role.
  - Standing beside a coffin or in a procession does not independently establish formal honor-guard status.
  - Liturgical garments, symbols, gestures or altar position do not independently establish a person, office, location or
    exact rite.
  - A readable biblical quotation or reference verifies visible wording only, not the date, place, denomination or event character.
  - 'A modern commemorative calendar is a secondary compilation: readable narratives, captions and reused photographs verify
    the calendar content, not the underlying historical claims.'
  - A concordant local secondary account may resolve a narrowly attributed working statement, but does not replace a primary
