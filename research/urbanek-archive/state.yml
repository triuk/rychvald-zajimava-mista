  handling_rules:
    - Archival names and folder labels are attribution metadata, not independent historical proof.
    - Persons are not identified solely from facial appearance.
    - Truncated captions are not reconstructed by guesswork.
    - Multiple archival reproductions of the same underlying photograph are separate files but not independent event evidence.
    - Image continuity may establish a sequence, not names, dates, family relations or offices.
    - Chains or insignia do not independently establish a specific ecclesiastical office.

