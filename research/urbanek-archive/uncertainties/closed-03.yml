items:
  - {id: URB-U-0004, status: resolved, priority: medium, collection: Rychvaldské větrné mlýny, type: object_location_identification, source_items: [urbanek-mlyny-001, urbanek-mlyny-002, urbanek-mlyny-008], question: "Jde o stejný objekt a odpovídá mu adresa Potoční 564?", evidence: research/urbanek-archive/collections/rychvaldske-vetrne-mlyny.yml, resolution: "Všechny tři fotografie zachycují stejnou dřevěnou kůlnu s kovovým větrným kolem. Adresní místo Potoční 564 v Rychvaldu existuje a jeho poloha byla ověřena ve veřejných adresních datech. Přímé přiřazení konkrétní kůlny k této adrese zůstává částečně ověřené, protože se opírá o archivní název souboru a nikoli o nezávislou veřejnou fotografii objektu.", evidence_added: "Uživatelské vizuální porovnání tří zdrojových fotografií; internetová kontrola adresního místa a souřadnic; research/urbanek-archive/verifications/urb-u-0004-potocni-564.md.", resolved_at: 2026-07-21, resolved_by: user_visual_confirmation_and_web_address_verification, confidence: partially_verified}
