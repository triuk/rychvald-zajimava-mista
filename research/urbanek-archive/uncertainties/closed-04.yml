    evidence: research/urbanek-archive/collections/rychvaldske-vetrne-mlyny-batch-02.yml
    resolution: >-
      Uživatel potvrdil, že všechny snímky zachycují větrný mlýn u Hebdy a že větrné
      kolo s venkovním mlecím soustrojím tvoří jeden funkční celek. Databáze Povětrník
      jej eviduje jako záznam 175, katalogové číslo mlýnek 48, na adrese U Skučáku 54
      v Rychvaldu a uvádí objektové souřadnice 49.8669433, 18.3910689. Základní
      databázová fotografie zachycuje stejný stožár, budovu a okolí jako archivní
      P1010445.JPG. Lokalizace i identita jsou ověřeny.
    evidence_added: >-
      Uživatelské vizuální a věcné potvrzení; přesná obrazová shoda s databázovým
      záznamem Povětrník 175; technický a lokalizační popis v
      research/urbanek-archive/verifications/urb-u-0005-hebda-location.md;
      http://www.povetrnik.cz/vetrne-mlyny/detail/175.
