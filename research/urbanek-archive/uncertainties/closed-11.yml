    question: "Jaký text nebo celá krátká zpráva chybí mezi zprávou o dr. Benetkovi a zprávou o footballových hřištích?"
    resolution: >-
      Uživatel rozhodl položku uzavřít jako známou, ale nepodstatnou fyzickou lakunu.
      Mezi dvěma zachovanými zprávami je poškozený úsek předlohy, jehož znění ani
      rozsah nelze ze snímku určit. Veškerý dochovaný čitelný text byl přepsán;
      chybějící obsah se nedoplňuje odhadem a nebude dále veden jako otevřený úkol.
