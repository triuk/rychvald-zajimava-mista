    question: "Jaký text spojuje nedokončenou větu v části Polské obavy o Bohumínsko s blokem začínajícím čs. národnosti?"
    resolution: >-
      Uživatel rozhodl položku uzavřít jako známou ořezovou lakunu. Archivní
      fotografie zachycuje pouze horní část novinové strany: první sloupec končí
      nedokončenou větou a druhý sloupec začíná uprostřed jiného bloku. Chybějící
      spodní část sloupce nelze ze zachovaného obrazu rekonstruovat. Veškerý
      dochovaný text je přepsán, mezera zůstává výslovně označena a nesmí být
      doplňována odhadem.
