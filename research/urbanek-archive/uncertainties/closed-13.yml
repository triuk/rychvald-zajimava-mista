    question: "Jaký text chybí mezi zprávou o slezské orlici a zprávou o tabulkách českých pojišťoven?"
    resolution: >-
      Uživatel rozhodl položku uzavřít jako známou fyzickou lakunu. Poškození
      předlohy zničilo několik řádků mezi dvěma dochovanými zprávami; nelze určit,
      zda šlo o dokončení předchozí zprávy nebo o jednu či více dalších krátkých
      zpráv. Veškerý dochovaný čitelný text je přepsán, mezera zůstává výslovně
      označena a nesmí být doplňována odhadem.
