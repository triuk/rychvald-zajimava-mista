    question: "Kdo hrál Fabiana: Radomír Jurdin, nebo Václav Válek?"
    resolution: >-
      Oba. Tištěný program uvádí Radomíra Jurdina jako představitele Fabiana.
      Uživatel potvrdil, že Václav Válek v této roli alternoval. Archivní článek
      Bořivoje Pešky nezávisle potvrzuje V. Válka jako člena rychvaldského
      ochotnického souboru. Názvy obou fotografií jsou tedy věcně správné a
      nezachycují rozpor v identitě role, nýbrž dva alternující představitele.
      Přesné rozdělení jednotlivých repríz mezi oba herce není doloženo.
