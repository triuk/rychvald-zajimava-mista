      zachycují jiné dokumenty. Pokračování ani dokončení rozděleného slova
      nelze z dostupných podkladů bezpečně rekonstruovat. Uživatel rozhodl
      položku uzavřít jako známé chybějící pokračování bez dalšího hledání.
