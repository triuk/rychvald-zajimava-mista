  question: Z jakého materiálu jsou zvony Husova sboru v Rychvaldě a byly za války rekvírovány?
  resolution: Místní historický souhrn zveřejněný Církví československou husitskou v roce 2025 výslovně uvádí, že
    zvony nebyly zabaveny pro vojenské účely, protože jsou ocelové, nikoli ze zvonoviny. Kalendář 2015 nezávisle
    v rámci téhož místního archivního okruhu označuje dva zvony ve věži jako ocelové. Pro pracovní syntézu je proto
    možné s uvedením zdroje používat tvrzení, že hlavní věžové zvony jsou ocelové a válečné rekvizici unikly. Nejde
    o metalurgické měření ani primární inventární doklad.
