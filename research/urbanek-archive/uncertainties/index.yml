rules:
  - A thumbnail in Thumbs.db without a standalone full file means the full original is missing; visually verified duplicate thumbnails do not represent additional missing image content.
  - When one part of a question is resolved but other material attributes remain unknown, keep the resolved finding closed and create a linked open item for the unresolved attributes.
  - Incidental surrounding content captured outside the intended clipping scope is not treated as a separate document or identification task.
  - A documented physical or cropping lacuna may be closed when all surviving text is transcribed and the missing content is not to remain an ongoing search task; the gap must remain explicitly marked and must never be reconstructed by guesswork.
  - A printed cast and a differently named archival photograph may both be correct when user testimony confirms role alternation and the named person is independently documented as a member of the ensemble.
  - When one source gives an exact count and another explicitly approximate rounded count for the same event, preserve both readings but use the exact count for factual synthesis.
  - When a printed program and the dramatic text agree on a character name, an incompatible name in a later retrospective article is recorded as an authorial or typographical error rather than silently normalized in the transcription.
  - A missing continuation on a demonstrably absent following page may be closed as a known lacuna when the user declines further searching; no text may be reconstructed from context alone.
