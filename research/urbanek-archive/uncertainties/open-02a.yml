    question: "Kdo skutečně hrál Fabiana: Radomír Jurdin, jak uvádí tištěný program a soubor 025, nebo Václav Válek, jak uvádí název souboru 051?"
    known_facts:
      - "Tištěný program uvádí Fabiano – Radomír Jurdin."
      - "Soubor Viola a Fabiano - Sylvie Kravalová a Radomír Jurdin.jpg je v souladu s programem."
      - "Článek Bořivoje Pešky uvádí V. Válka s manželkou Dášou mezi herci rychvaldského souboru z Podlesí při vzniku souboru kolem inscenace Dámy a husaři."
      - "Pro spojení Fabiano – Václav Válek zůstává přímým podkladem pouze název souboru Fabiano - Václav Válek.jpg."
    interpretation: >-
      Václav Válek byl skutečným členem rychvaldského ochotnického souboru,
      jeho účast ve Večeru tříkrálovém ani role Fabiana však zatím doloženy nejsou.
      Dostupné dokumenty podporují Radomíra Jurdina jako tištěného představitele role;
      fotografie Václava Válka může být chybně pojmenovaná, zachycovat alternaci,
      jiné uvedení nebo jinou roli.
    evidence:
      - research/urbanek-archive/ocr/urbanek-ochotnici-032-033-document-text.md
      - research/urbanek-archive/ocr/urbanek-ochotnici-019-028-document-text.md
      - research/urbanek-archive/verifications/urb-u-0026-vaclav-valek-research.md
    next_action: >-
      Hledat další program, popisek výstavního panelu, seznam obsazení jednotlivých
      repríz nebo osobní svědectví, které výslovně spojí Václava Válka s rolí Fabiana
      nebo vysvětlí fotografii. Osoby neurčovat podle tváří.
