        - FamilySearch katalog potvrzuje pro Rychvald sčítání 1921 a evidence obyvatel 1896–1938 vhodné pro hledání čp., domácnosti a povolání; jednotlivé snímky pro Kakal/Kakala zatím nebyly bezpečně vyhodnoceny.
