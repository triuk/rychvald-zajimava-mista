- id: URB-U-0042
  status: open
  priority: medium
  collection: Historie Církve československé v Rychvaldě ve fotografiích
  type: bell_ringing_mechanism_history
  related_open_items:
  - URB-U-0041
  source_items:
  - urbanek-ccs-015
  question: Jak byly zvony původně ovládány, které části viditelného mechanismu jsou původní, kdy došlo k případné
    elektrifikaci nebo jiné přestavbě a jak se způsob zvonění v čase měnil?
  known_facts:
  - Fotografie zachycuje kovovou zvonovou stolici, závěsy, srdce zvonů a několik svislých lan nebo vodičů.
  - Samotný obraz neprokazuje časovou posloupnost ani původnost jednotlivých součástí.
  - Tvrzení o původním ručním zvonění pochází z archivního názvu souboru.
  unresolved_attributes:
  - original_ringing_method
  - original_frame_and_suspension_components
  - date_of_electrification
  - later_mechanical_modifications
  - current_operational_state
  - relation_of_visible_cords_to_manual_or_electric_operation
  next_action: Porovnat starší a novější technické fotografie, dohledat záznamy o opravách, elektrifikaci a údržbě
    a získat odborný popis současného mechanismu. Bez časového nebo technického pramene nepoužívat formulaci o původním
    ručním zvonění jako ověřený fakt.
  reopen_triggers:
  - repair_or_electrification_record_found
  - earlier_bell_chamber_photo_found
  - technical_inspection_found
  - knowledgeable_witness_information_provided
  evidence:
  - research/urbanek-archive/collections/historie-cirkve-ceskoslovenske-batch-03.yml
  - sources/index.d/urbanek-ccs-03.yml
