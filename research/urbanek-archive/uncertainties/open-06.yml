  - sources/index.d/urbanek-ccs-03.yml
- id: URB-U-0040
  status: open
  priority: medium
  collection: Historie Církve československé v Rychvaldě ve fotografiích
  type: caption_and_person_identification
  source_items:
  - urbanek-ccs-013
  question: Jak přesně zní celý popisek fotografie rady starších, při jaké konkrétní příležitosti a kdy byla fotografie
    pořízena a kdo je všech čtrnáct osob?
  known_facts:
  - Fotografie zachycuje čtrnáct dospělých osob ve dvou řadách před vstupem sboru.
  - Na spodním okraji je částečně setřený popisek.
  - Vizuálně čitelné části podporují text přibližně ‚10 LET CČS V RYCHVALDĚ … 1930‘.
  - Označení skupiny jako rady starších pochází z názvu souboru a pravděpodobně také ze zkrácené části popisku.
  unresolved_attributes:
  - exact_caption_transcription
  - exact_event_date
  - exact_anniversary_context
  - confirmation_of_council_role
  - identities_of_all_fourteen_persons
  - identity_of_central_seated_person
  next_action: Hledat lepší kopii stejného snímku, výroční tisk k desetiletí sboru, seznam rady starších kolem roku
    1930, církevní kroniku a popsané skupinové fotografie. Přepis setřené části nedoplňovat odhadem.
  reopen_triggers:
  - better_copy_found
  - anniversary_program_found
  - council_membership_list_found
  - named_parallel_photo_found
  - user_identification_provided
  evidence:
  - research/urbanek-archive/collections/historie-cirkve-ceskoslovenske-batch-03.yml
  - sources/index.d/urbanek-ccs-03.yml
- id: URB-U-0041
  status: open
  priority: high
  collection: Historie Církve československé v Rychvaldě ve fotografiích
  type: bell_identity_provenance_and_dating
  related_resolved_items:
  - URB-U-0074
  source_items:
  - urbanek-ccs-014
  - urbanek-ccs-015
  - urbanek-ccs-191
  question: Co přesně znamená letopočet 1920 na jednom zvonu, kdy a kým byly jednotlivé zvony odlity, odkud pocházejí,
    kdy byly instalovány, jak se jmenují a zda všechny tři viditelné zvony patří k téže původní soupravě?
  known_facts:
  - Na těle jednoho zvonu je obrazově ověřen plastický letopočet 1920.
  - Na společném snímku jsou viditelné nejméně tři zvony různých velikostí.
  - Fotografie detailu nezachycuje úplný nápis, značku zvonaře ani celý zvon.
  - Kalendář 2015 označuje dva zvony ve věži jako ocelové a letopočet 1920 jako rok výroby; jde o sekundární kalendářový
    popisek.
  - Historický souhrn zveřejněný CČSH v roce 2025 uvádí, že zvony nebyly zabaveny pro vojenské účely, protože jsou
    ocelové, nikoli ze zvonoviny.
  - Materiál a válečná nerekvizice byly odděleně uzavřeny v URB-U-0074; přesná výrobní a provenienční historie zůstává
    otevřená.
  unresolved_attributes:
  - independent_confirmation_of_meaning_of_year_1920
  - bell_maker_or_foundry
  - full_inscriptions
  - donor_or_provenance
  - casting_date_of_each_bell
  - installation_or_consecration_date
  - bell_names_and_exact_placement
  - whether_all_three_bells_form_original_set
  - later_replacement_repair_or_modification_history
  next_action: Hledat detailní snímky všech nápisů a reliéfů, církevní inventáře, účty, kronikářské zápisy, zprávy
    o pořízení nebo svěcení zvonů a záznamy oprav. Sekundární turistické přehledy uvádějící jména Václav, Ludmila
    a Bořivoj použít pouze jako vyhledávací stopu, dokud nebudou nalezeny primární nebo místní dokumentární prameny.
  reopen_triggers:
  - detailed_bell_inscription_photo_found
  - church_inventory_found
  - bell_consecration_or_purchase_record_found
  - bell_foundry_mark_identified
  - named_local_bell_record_found
  - repair_or_replacement_record_found
  evidence:
  - research/urbanek-archive/collections/historie-cirkve-ceskoslovenske-batch-03.yml
  - research/urbanek-archive/collections/historie-cirkve-ceskoslovenske-batch-39.yml
