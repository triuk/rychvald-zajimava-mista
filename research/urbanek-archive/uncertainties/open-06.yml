- id: URB-U-0039
  status: open
  priority: medium
  collection: Historie Církve československé v Rychvaldě ve fotografiích
  type: event_date_and_person_identification
  source_items:
  - urbanek-ccs-011
  - urbanek-ccs-012
  question: Kdy byly pořízeny skupinové fotografie chlapců a dívek, zachycují stejné první svaté přijímání nebo
    různé ročníky, kdo je zobrazený duchovní a kdo jsou jednotlivé děti?
  known_facts:
  - Oba snímky byly pořízeny před stejným obloukovým vstupem budovy.
  - Jeden snímek zachycuje skupinu chlapců, druhý skupinu dívek; na obou je přítomen duchovní.
  - Slavnostní oděv, květiny a uspořádání skupin podporují ceremoniální charakter události.
  - Označení prvního svatého přijímání a jméno faráře Vodičky pocházejí z názvů souborů.
  unresolved_attributes:
  - exact_date_of_urbanek_ccs_011
  - exact_date_of_urbanek_ccs_012
  - same_year_or_separate_years
  - exact_event_identity
  - clergy_identity
  - participant_identities
  next_action: Porovnat fotografie s církevními matrikami, kronikami, výročními materiály, rodinnými alby a pozdějšími
    popisky. Hledat paralelní snímky s uvedeným rokem nebo jmenným seznamem. Případné uživatelské určení osob zaznamenat
    jako samostatný doklad, nikoli jako vizuální identifikaci modelem.
