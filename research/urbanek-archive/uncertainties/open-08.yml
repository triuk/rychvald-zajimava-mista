  - id: URB-U-0050
    status: open
    priority: high
    collection: Historie Církve československé v Rychvaldě ve fotografiích
    type: Ferdinand_Stibor_visit_bread_and_salt_event_date_full_sequence_council_and_people
    source_items: [urbanek-ccs-025, urbanek-ccs-070, urbanek-ccs-071, urbanek-ccs-072, urbanek-ccs-073, urbanek-ccs-074, urbanek-ccs-075, urbanek-ccs-076]
    question: >-
      Zachycují všechny fotografie jednu návštěvu biskupa Ferdinanda Stibora v Rychvaldě
      roku 1948, při jaké příležitosti proběhla, jak na sebe navazovalo uvítání chlebem
      a solí, venkovní skupiny, setkání před oltářem, společné fotografování s dětmi a
      sedmičlenná skupina označená jako rada starších, kde se části konaly a kdo jsou
      host, duchovní, krojované osoby, děti, členové rady a další účastníci?
    known_facts:
      - "Urbanek-ccs-025 zachycuje velkou venkovní skupinu dospělých a dětí; mezi dospělými jsou osoby v duchovním oděvu a v přední řadě dívky v jednotných slavnostních nebo lidových krojích."
      - "Jméno Ferdinanda Stibora, návštěva Rychvaldu a rok 1948 u urbanek-ccs-025 pocházejí z archivního názvu souboru."
      - "Urbanek-ccs-070 zachycuje venkovní uvítání: žena v lidovém nebo slavnostním kroji nese tác s chlebem a malou miskou nebo nádobkou ke staršímu muži v kabátu."
      - "Urbanek-ccs-071 a 072 zachycují tutéž nebo bezprostředně navazující venkovní skupinu z odlišných záběrů; opakují se účastníci a oděvy."
      - "Urbanek-ccs-073 zachycuje menší skupinu dospělých a duchovních před oltářem v interiéru sboru."
      - "Urbanek-ccs-074 je další formální skupinový snímek duchovních a civilních účastníků."
      - "Urbanek-ccs-075 zachycuje velkou společnou skupinu dospělých, duchovních a dětí."
      - "Urbanek-ccs-076 zachycuje sedm sedících dospělých; uprostřed je duchovní s výrazným řetězem nebo insignií a kyticí, po stranách civilně oblečení muži a jedna žena se šátkem."
      - "Název urbanek-ccs-076 označuje skupinu jako biskupa Stibora s radou starších a obsahuje pouze fragmenty jmen ‚Herman, nn,Trant. Šm‘; chybějící části nebyly rekonstruovány."
      - "Celá sedmisouborová podsložka je nyní vizuálně zpracována; soudržnost série podporují pořadí, prostředí a opakující se osoby, nikoli však sama o sobě identita hosta, datum nebo funkce."
    unresolved_attributes:
