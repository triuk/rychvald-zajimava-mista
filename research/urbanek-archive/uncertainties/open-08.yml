      - left_to_right_identity_order_on_item_076
      - full_names_and_spelling_behind_Herman_nn_Trant_and_Sm_fragments
      - full_visit_program_and_sequence
    next_action: >-
      Porovnat celou dokončenou podsložku s církevní kronikou, zápisy rady starších,
      návštěvními protokoly, dobovým tiskem, programem slavnosti a popsanými skupinovými
      snímky. Získat úplný původní popisek položky 076. Osoby neidentifikovat pouze podle
      obličejů, polohy ve skupině ani fragmentů jmen bez dalšího dokladu.
    reopen_triggers:
