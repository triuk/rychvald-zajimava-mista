- id: URB-U-0058
  status: open
  priority: medium
  collection: Historie Církve československé v Rychvaldě ve fotografiích
  type: Jana_Silerova_renewed_communion_service_episcopal_role_and_portrait
  related_open_items:
  - URB-U-0055
  - URB-U-0056
  - URB-U-0059
  source_items:
  - urbanek-ccs-036
  - urbanek-ccs-063
  question: Kdy a po jak dlouhé přestávce bylo obnoveno slavnostní první přijímání, kdo obnovu inicioval, je zachycenou duchovní
    skutečně Jana Šilerová, kdo jsou děti, jak zněl celý useknutý archivní popisek, kdy a kde portrét vznikl a jaké přesné
    služební, akademické a biskupské funkce Jana Šilerová v daném období zastávala?
  known_facts:
  - Urbanek-ccs-036 zachycuje malou venkovní skupinu dětí různého věku a ženu v liturgickém oděvu.
  - Pravá část urbanek-ccs-036 je přeexponovaná a několik osob se překrývá.
  - Jméno Jana Šilerová, tvrzení o obnovení a označení slavnostního prvního přijímání pocházejí z archivního názvu urbanek-ccs-036.
  - Název urbanek-ccs-036 končí useknutým řetězcem ‚přijímá‘.
  - Urbanek-ccs-063 zachycuje ženu v tmavém duchovním oděvu, bílé štole s červeným kalichem a výrazným řetězem nebo insignií.
  - Jméno Jana Šilerová, akademický titul Mgr. a označení biskupky pocházejí z archivního názvu urbanek-ccs-063.
  - Portrét neobsahuje datum ani text umožňující nezávislou identifikaci osoby nebo úřadu.
  unresolved_attributes:
