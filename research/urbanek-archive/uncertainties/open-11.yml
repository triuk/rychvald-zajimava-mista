  - exact_clerical_service_dates_and_roles
  - exact_episcopal_office_and_term
  - meaning_and_provenance_of_chain_or_insignia
  - relationship_to_council_and_choir_images
  next_action: Hledat kroniku, matriku, zápisy rady starších, program přijímání, personální a biskupské záznamy Jany Šilerové,
    diecézní dokumenty a další popsanou kopii portrétu nebo useknutého popisku. Osobu ani funkci neurčovat pouze podle vzhledu
    a insignie.
