  question: Zachycuje snímek skutečně rychvaldský pěvecký sbor roku 1933, kdo byli pan Šlachta a farář Vodička, jaké měli
    ve sboru role, kdo jsou ostatní členové a jaký znak nebo dokument drží muž uprostřed přední řady?
  known_facts:
  - Fotografie zachycuje velkou smíšenou skupinu mužů a žen ve třech řadách před budovou.
  - Dva muži sedí uprostřed přední řady.
  - Jeden z nich drží světlý list se slabým kresleným znakem připomínajícím lyru nebo sborový emblém; přesný motiv ani případný
    text nejsou bezpečně čitelné.
  - Rok 1933, označení pěveckého sboru a jména Šlachta a Vodička pocházejí z archivního názvu.
  unresolved_attributes:
