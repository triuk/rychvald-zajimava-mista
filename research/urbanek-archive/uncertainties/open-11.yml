  next_action: Porovnat zápisy rady starších, výroční zprávy, členské seznamy, kroniku, služební a biskupské záznamy osob
    jménem Horský a popsané paralelní fotografie. Hledat úplný popisek skupiny, program nebo zprávu z návštěvy, originální
