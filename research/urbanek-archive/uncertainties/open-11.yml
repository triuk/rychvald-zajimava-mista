- id: URB-U-0059
  status: open
  priority: high
  collection: Historie Církve československé v Rychvaldě ve fotografiích
  type: council_group_chronology_membership_bishop_Horsky_portrait_parallel_address_and_person_identification
  related_open_items:
  - URB-U-0040
  - URB-U-0050
  - URB-U-0058
  - URB-U-0070
  source_items:
  - urbanek-ccs-037
  - urbanek-ccs-038
  - urbanek-ccs-039
  - urbanek-ccs-120
  - urbanek-ccs-139
  question: Z jakých přesných let a událostí pocházejí tři skupiny spojované s radou starších, kdo byl v jednotlivých obdobích
    jejím členem, koho měl označovat useknutý popisek „čtvrtý zprava bisk…“, zda s ním souvisí portrét označený „Biskup dr.Horský“
    a vizuálně podobný nedatovaný projev na položce 139, jaké bylo Horského celé jméno, přesný úřad a služební období a kdy
    vznikl nedatovaný snímek s Janou Šilerovou?
  known_facts:
  - Urbanek-ccs-037 zachycuje formální skupinu přibližně dvou desítek dospělých ve dvou řadách.
  - Urbanek-ccs-038 zachycuje více než dvě desítky dospělých, několik duchovních a ústřední osobu s výrazným řetězem nebo
    insignií.
  - Urbanek-ccs-039 zachycuje třináct dospělých v neformálnějším zahradním prostředí.
  - Datace 1945–1946 a 26. dubna 1970, role rady starších a jméno Jana Šilerová pocházejí z archivních názvů.
  - Název urbanek-ccs-037 je useknut za řetězcem ‚bisk‘ a urbanek-ccs-039 je výslovně veden jako nedatovaný.
  - Urbanek-ccs-120 zachycuje muže v tmavém duchovním oděvu a brýlích, s řetězem nebo insignií s motivem kalicha a s kyticí;
    vlevo za ním je částečně viditelná další osoba.
  - Vložený popisek na urbanek-ccs-120 je čitelný jako „Biskup dr.Horský“.
  - Rozmezí 1945–1946 pochází z archivního názvu urbanek-ccs-120, nikoli z vloženého popisku nebo embedded metadata.
  - Popisek potvrzuje své znění, nikoli automaticky identitu, doktorát, biskupský úřad, datum nebo vztah k osobě na urbanek-ccs-037.
  - Urbanek-ccs-120 neobsahuje použitelné embedded datum.
  - Urbanek-ccs-139 zachycuje muže v tmavém duchovním oděvu a brýlích, který drží otevřenou knihu a má výrazný řetěz s oválným
    medailonem motivu kalicha a kříže; stojí u oltáře se svícny, kalichem a zdobeným křížem.
  - Urbanek-ccs-139 je tváří, brýlemi a celkovým držením postavy vizuálně podobná portrétu 120, ale obrazová podobnost není
    dokumentární identifikací osoby.
  - Urbanek-ccs-139 nemá vložený popisek ani použitelné embedded datum.
