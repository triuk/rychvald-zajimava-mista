  - id: URB-U-0062
    status: open
    priority: high
    collection: Historie Církve československé v Rychvaldě ve fotografiích
    type: Gabriel_Chrobacek_identity_election_appointment_inauguration_ritual_family_congratulations_portrait_presentation_and_delegation
    related_open_items: [URB-U-0055, URB-U-0059, URB-U-0063]
    source_items: [urbanek-ccs-045, urbanek-ccs-046, urbanek-ccs-061, urbanek-ccs-077, urbanek-ccs-078, urbanek-ccs-079, urbanek-ccs-080, urbanek-ccs-081, urbanek-ccs-082, urbanek-ccs-083, urbanek-ccs-084, urbanek-ccs-085]
    question: >-
      Kdy, kde a do jakého biskupského úřadu byl Gabriel Chrobáček zvolen, ustanoven
      a inaugurován, jaké úkony zachycují obřadní a gratulační fotografie, kdo jsou
      držitelé insignií, rodinní příslušníci, gratulanti a další účastníci, jaké byly
      jejich role a jak znějí úplné useknuté popisky včetně jména „paní S…“ a roku
      v názvu podsložky končícím „v r. 19“?
    known_facts:
      - "Urbanek-ccs-045 zachycuje velkou formální skupinu několika desítek dospělých a dětí před monumentálním vstupem."
      - "Urbanek-ccs-046 zachycuje duchovního s řetězem, listinou a plastikou při formálním předání."
      - "Urbanek-ccs-061 zachycuje duchovního s řetězem u stolu s kalichem, knihami a listinami."
      - "Urbanek-ccs-077 až 080 tvoří pravděpodobnou obřadní posloupnost se čtením listiny, úkonem u oltáře a zaplněným shromážděním."
      - "Urbanek-ccs-081 zachycuje skupinový portrét několika dospělých a dítěte; archivní název uvádí Jaromíra, Milenu, Miluši, manželku a neúplné jméno paní S."
      - "Urbanek-ccs-082 až 085 zachycují navazující gratulace, předávání květin a formální skupiny s duchovním nesoucím řetěz nebo insignii."
      - "Rodinná jména a vztahy, identita duchovního i význam insignie nejsou obrazem samostatně potvrzeny."
      - "Název souboru urbanek-ccs-081 končí řetězcem ‚paní S‘ a nesmí být doplněn odhadem."
      - "Název podsložky uvádí slavnostní volbu a jmenování Gabriela Chrobáčka, avšak končí neúplným údajem ‚v r. 19‘."
      - "Vztah fotografií k jedné osobě nebo události je pracovní hypotéza a nesmí být potvrzen jen porovnáním obličeje."
