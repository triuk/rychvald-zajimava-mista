  - id: URB-U-0061
    status: open
    priority: high
    collection: Historie Církve československé v Rychvaldě ve fotografiích
    type: modern_choir_events_dates_title_conflicts_leadership_members_and_sequence
    related_open_items: [URB-U-0060]
    source_items: [urbanek-ccs-041, urbanek-ccs-042, urbanek-ccs-043, urbanek-ccs-044, urbanek-ccs-057, urbanek-ccs-058]
    question: >-
      Kolik různých novodobých koncertů fotografie zachycují, které snímky skutečně
      pocházejí z roku 2001 nebo 2011, jaké byly přesné názvy a programy akcí, proč
      jsou snímky ze stejného červnového dne označeny jednou Svatováclavským festivalem
      a podruhé adventním koncertem, jak se sbory a soubory jmenovaly a kdo byli
      dirigenti, Dajč, Dziadziová, děti místní ZUŠ a ostatní účinkující?
    known_facts:
      - "Urbanek-ccs-041 zachycuje smíšený sbor zpívající z notových desek v interiéru sboru."
      - "Urbanek-ccs-042 zachycuje sbor, komorní hudební soubor, dirigenta a ozdobený jehličnatý strom."
      - "Urbanek-ccs-043 je skupinový portrét více než dvou desítek dospělých, jednoho dítěte a ženy v liturgické štole s motivem kalicha."
      - "Urbanek-ccs-044 zachycuje ženu u varhan, houslistku, další mladou ženu a část publika."
      - "Rok 2001, příjmení Dajč a Dziadziová, funkce sbormistra a titul učitelky pocházejí z archivních názvů."
      - "EXIF urbanek-ccs-043 obsahuje datum 8. září 2014, které se vztahuje k digitálnímu pořízení nebo reprodukci, nikoli nutně k zachycené události."
      - "Urbanek-ccs-057 zachycuje velký smíšený sbor, dirigenta a publikum; název jej připisuje Svatováclavskému festivalu."
      - "Urbanek-ccs-058 zachycuje dětský a mládežnický hudební soubor; název jej připisuje adventnímu koncertu a místní ZUŠ."
      - "Urbanek-ccs-057 a 058 mají stejný fotoaparát Nikon D3100 a embedded datum 12. června 2011 v časech 17:02:40 a 16:13:05."
      - "Shodný den, fotoaparát, interiér a časová návaznost silně ukazují, že urbanek-ccs-057 a 058 dokumentují tutéž akci nebo programový blok."
      - "Červnové embedded datum urbanek-ccs-058 je v přímém napětí s archivním označením adventního koncertu; ani jedna varianta zatím není potvrzena programem."
      - "Podobný interiér a opakující se osoby u ostatních snímků jsou vodítkem k souvislosti, nikoli samy o sobě důkazem jediné události."
    unresolved_attributes:
