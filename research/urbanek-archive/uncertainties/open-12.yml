    next_action: >-
      Hledat program Svatováclavského festivalu a koncertů roku 2011, adventní programy,
      kroniku, sborové seznamy, záznamy místní ZUŠ, notové materiály, personální
      záznamy Dajče a Dziadziové a dobový zpravodaj. Konflikt názvů a embedded data
      zachovat, dokud jej nevyřeší textový pramen.
