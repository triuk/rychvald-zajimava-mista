  - id: URB-U-0062
    status: open
    priority: high
    collection: Historie Církve československé v Rychvaldě ve fotografiích
    type: Gabriel_Chrobacek_identity_election_appointment_inauguration_investiture_document_ritual_family_congratulations_portrait_presentation_and_delegation
    related_open_items: [URB-U-0055, URB-U-0059, URB-U-0063]
    source_items: [urbanek-ccs-045, urbanek-ccs-046, urbanek-ccs-061, urbanek-ccs-077, urbanek-ccs-078, urbanek-ccs-079, urbanek-ccs-080, urbanek-ccs-081, urbanek-ccs-082, urbanek-ccs-083, urbanek-ccs-084, urbanek-ccs-085, urbanek-ccs-086, urbanek-ccs-087, urbanek-ccs-088, urbanek-ccs-089, urbanek-ccs-090, urbanek-ccs-091, urbanek-ccs-092, urbanek-ccs-093, urbanek-ccs-094, urbanek-ccs-095]
    question: >-
      Kdy, kde a do jakého biskupského úřadu byl Gabriel Chrobáček zvolen, ustanoven
      a inaugurován, jaké úkony zachycují čtení a předávání listin, proslovy, obřady
      u oltáře, položení ruky a fyzické nasazení řetězu nebo insignie, kdo jsou jejich
      účastníci a jaké měli úřady, kdo byli archivně označení příbuzní Jaromír, Milena,
      Miluše, manželka a neúplně uvedená paní S…, zachycují fotografie tutéž osobu a
      slavnost, kdo tvořil rychvaldskou delegaci, kdo předává plastiku, co představuje,
      co znamenají řetězy a jak zněly useknuté popisky a celý rok v názvu podsložky
      končícím „v r. 19“?
    known_facts:
      - "Urbanek-ccs-045 zachycuje velkou formální skupinu několika desítek dospělých a dětí před monumentálním vstupem."
      - "Uprostřed přední řady urbanek-ccs-045 sedí duchovní s výrazným řetězem nebo insignií; po jeho stranách sedí dvě ženy a jedna drží kytici."
      - "Inaugurace, jméno Gabriel Chrobáček a účast lidí z Rychvaldu pocházejí z archivního názvu, který končí řetězcem Rychv."
      - "Urbanek-ccs-046 zachycuje duchovního s řetězem, listinou a světlou plastikou proti muži v obleku."
      - "Urbanek-ccs-061 zachycuje muže v duchovním oděvu s řetězem u stolu s kalichem, knihami a listinami."
      - "Snímky 077 až 080 dokumentují skupinu duchovních s insigniemi a knihami, čtení dokumentu, obřad u oltáře a zaplněné shromáždění."
      - "Urbanek-ccs-081 zachycuje skupinový portrét dospělých a dítěte; jména Jaromír, Milena, Miluše, manželka a fragment paní S pocházejí pouze z useknutého archivního názvu."
      - "Urbanek-ccs-082 až 085 zachycují navazující gratulace a předávání květin duchovnímu s řetězem nebo insignií."
      - "Urbanek-ccs-086 zachycuje stojícího duchovního, který drží ruku nad hlavou skloněného či klečícího duchovního; jiný duchovní drží knihu a mezi nimi je vysoká svíce."
      - "Urbanek-ccs-087 až 089 zachycují navazující úkony u oltáře s otevřenou knihou, kalichem a více duchovními; na urbanek-ccs-089 drží duchovní s řetězem kalich."
      - "Urbanek-ccs-090 zachycuje duchovního s řetězem při pozdravu nebo předání se skupinou žen; označení manželky pochází pouze z názvu souboru."
      - "Urbanek-ccs-091 zachycuje vystoupení duchovního s řetězem před shromážděním a dalšími sedícími duchovními."
      - "Urbanek-ccs-092 obrazově dokládá, že stojící duchovní fyzicky nasazuje řetěz nebo insignii kolem krku skloněného duchovního."
      - "Urbanek-ccs-093 zachycuje dva hlavní duchovní s řetězy u oltáře s kalichem a otevřenou knihou."
      - "Urbanek-ccs-094 zachycuje dva proti sobě stojící duchovní; jeden drží složený list či dokument a druhý k němu natahuje ruku."
      - "Urbanek-ccs-095 zachycuje stojícího duchovního s řetězem při vystoupení, modlitbě nebo zpěvu a sedícího duchovního s otevřenou složkou či knihou."
      - "Snímky 077 až 095 podle stejného prostředí, pořadí a opakujících se účastníků tvoří pravděpodobnou obřadní, investiční a gratulační posloupnost, ale neobsahují jména, datum ani čitelný identifikační text."
      - "Název podsložky uvádí slavnostní volbu a jmenování Gabriela Chrobáčka, avšak končí neúplným údajem v r. 19."
      - "Jména, rodinné vztahy, úřady osob a význam insignií nesmějí být potvrzeny pouze porovnáním tváří nebo vzhledu."
