      Dokončit celou podsložku a poté hledat protokol volby a jmenování, diecézní a
      sborovou kroniku, dobový tisk, program slavnosti, seznam delegace, záznam o daru
      nebo plastice a personální portrétní prameny. Získat úplný název podsložky a
      popisky. Osoby, úřady ani význam insignií neurčovat pouze podle vzhledu.
