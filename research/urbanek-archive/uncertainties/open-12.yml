  - id: URB-U-0062
    status: open
    priority: high
    collection: Historie Církve československé v Rychvaldě ve fotografiích
    type: Gabriel_Chrobacek_identity_election_appointment_inauguration_ritual_portrait_presentation_and_delegation
    related_open_items: [URB-U-0055, URB-U-0059, URB-U-0063]
    source_items: [urbanek-ccs-045, urbanek-ccs-046, urbanek-ccs-061, urbanek-ccs-077, urbanek-ccs-078, urbanek-ccs-079, urbanek-ccs-080]
    question: >-
      Kdy, kde a do jakého biskupského úřadu byl Gabriel Chrobáček zvolen, ustanoven
      a inaugurován, jaké úkony zachycují skupina duchovních s insigniemi, čtení listiny,
      obřad u oltáře a zaplněné shromáždění, kdo jsou jejich účastníci a jaké měli úřady,
      zachycují fotografie tutéž osobu a slavnost, kdo tvořil rychvaldskou delegaci,
      kdo předává plastiku, co představuje, co znamenají řetězy a jak zněly useknuté
      popisky a celý rok v názvu podsložky končícím „v r. 19“?
    known_facts:
      - "Urbanek-ccs-045 zachycuje velkou formální skupinu několika desítek dospělých a dětí před monumentálním vstupem."
      - "Uprostřed přední řady urbanek-ccs-045 sedí duchovní s výrazným řetězem nebo insignií; po jeho stranách sedí dvě ženy a jedna drží kytici."
      - "Inaugurace, jméno Gabriel Chrobáček a účast lidí z Rychvaldu pocházejí z archivního názvu, který končí řetězcem Rychv."
      - "Urbanek-ccs-046 zachycuje duchovního s podobným typem řetězu, který drží listinu a světlou plastiku sedící mužské postavy, zatímco proti němu stojí muž v obleku."
      - "Název urbanek-ccs-046 tvrdí, že bratr farář Gabriel Chrobáček se stal biskupem; obraz sám neurčuje datum, úřad ani identitu plastiky."
      - "Urbanek-ccs-061 zachycuje muže v tmavém duchovním oděvu s výrazným řetězem nebo insignií u stolu s kalichem, otevřenými knihami a listinami; v pozadí jsou další duchovní."
      - "Jméno Gabriel Chrobáček a biskupský titul na urbanek-ccs-061 pocházejí pouze z archivního názvu."
      - "Urbanek-ccs-077 zachycuje čtyři duchovní s výraznými řetězy nebo insigniemi; jeden drží otevřenou velkou knihu a jiný menší uzavřenou knihu."
      - "Urbanek-ccs-078 zachycuje duchovního v kulatých brýlích, který drží listy nebo dokument před skupinou přihlížejících."
      - "Urbanek-ccs-079 zachycuje tři hlavní duchovní za oltářem, kalich, knihy, květiny a dalšího duchovního u pultu; prostřední má řetěz s přívěskem připomínajícím kalich."
      - "Urbanek-ccs-080 zachycuje zaplněný interiér se samostatnou přední řadou, v níž nejméně dva muži mají výrazné řetězy nebo insignie."
      - "Snímky 077 až 080 tvoří podle stejného prostředí, pořadí a opakujících se účastníků pravděpodobnou obřadní posloupnost, ale neobsahují jména, datum ani čitelný identifikační text."
      - "Název podsložky uvádí slavnostní volbu a jmenování Gabriela Chrobáčka, avšak končí neúplným údajem ‚v r. 19‘."
      - "Vztah fotografií k jedné osobě nebo události je pracovní hypotéza a nesmí být potvrzen jen porovnáním obličeje."
