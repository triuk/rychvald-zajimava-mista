      Dokončit celou podsložku a poté hledat protokol volby a jmenování, diecézní a
      sborovou kroniku, dobový tisk, program slavnosti, texty listin a proslovů, rodinné
      a personální záznamy, seznam delegace a záznam o daru nebo plastice. Získat úplný
      název podsložky a useknuté popisky. Osoby, rodinné vztahy, úřady, rituály ani
      význam insignií neurčovat pouze podle vzhledu.
