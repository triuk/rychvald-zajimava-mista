        status: convergent_archival_context_plus_independent_local_personnel_history
        scope_note: "Identita osoby je zúžena; fyzicky useknutý filename se nedoplňuje a zůstává `Kare…`."
      Marceluch_authoritative_identity:
        value: "Leo Marceluch"
        status: independently_verified_by_official_CCSH_diocesan_history
      Marceluch_episcopal_office_in_1970:
        value: "biskup administrativně sloučené a územně rozšířené olomoucké diecéze CČSH"
        status: independently_verified_by_official_CCSH_diocesan_history
      Marceluch_episcopate_endpoint:
        value: 1988
        status: independently_verified_by_official_CCSH_diocesan_history
