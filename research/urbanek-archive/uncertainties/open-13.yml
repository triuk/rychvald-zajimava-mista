      Zaměřit další hledání na roky 1990–1992 a na církevní kroniku či zápisy rady starších,
      kde může být výslovně uvedeno první novodobé obnovení a jeho iniciátor. Hledat také
      úplnou kopii filename/popisku 049 a datované paralelní fotografie, které by umožnily
