  - id: URB-U-0063
    status: open
    priority: high
    collection: Historie Církve československé v Rychvaldě ve fotografiích
    type: fiftieth_anniversary_1970_exact_context_Kare_Marceluch_people_and_program
    related_open_items: [URB-U-0054, URB-U-0059, URB-U-0062, URB-U-0064, URB-U-0068]
    source_items: [urbanek-ccs-047, urbanek-ccs-066, urbanek-ccs-067]
    question: >-
      Kdy přesně a při jaké události se konalo padesáté výročí uváděné rokem 1970,
      čeho bylo výročí, kdo byli přítomní duchovní a další hosté, jak znělo celé jméno
      useknuté po řetězci „Kare“, kdo byl archivně označený biskup Marceluch, jaká je
      správná podoba jeho jména a úřadu a jaký byl program a rozsah oslav?
    known_facts:
      - "Urbanek-ccs-047 zachycuje v kněžišti tři muže v duchovním oděvu a jednoho muže v obleku."
      - "Duchovní vlevo na urbanek-ccs-047 má výrazný řetěz nebo insignii a drží kytici; další osoba také drží kytici."
      - "Na oltáři urbanek-ccs-047 je viditelný kalich a květinová výzdoba."
      - "Archivní název urbanek-ccs-047 uvádí rok 1970 a 50. výročí založení CČS v Rychvaldě."
      - "Dobově blízká rychvaldská kronika uvádí `Založení církve čsl. 11. 4. 1920` a v oddílu o náboženských poměrech popisuje první schůzi na Fojtství 11. dubna 1920."
      - "Městská publikace Rychvald 1305–2005 a oficiální článek CČSH z roku 2025 nezávisle uvádějí založení/ustavení místní Církve československé na Fojtství dne 11. 4. 1920."
      - "Urbanek-ccs-066 zachycuje dítě podávající ruku ústřednímu duchovnímu s kyticí a knihami nebo složkou."
      - "Název urbanek-ccs-066 končí řetězcem `Kare`; pokračování jména v dochovaném názvu chybí a filename se textově nerekonstruuje."
      - "Nadřazená podsložka 066/067 se jmenuje `Návštěva faráře Vodičky v r. 1965 a v r. 1970 u příležitosti 50`; rychvaldská kronika a Rychvald 1305–2005 uvádějí prvního rychvaldského faráře CČS jako Karla Vodičku. Tato konvergence identifikuje osobu `Kare…` jako Karla Vodičku, nikoli však chybějící doslovný text filename."
      - "Urbanek-ccs-067 je širší reprodukce přesně téhož fotografického obrazu jako urbanek-ccs-066 a navíc ukazuje vlevo holohlavého duchovního s řetězem nebo insignií a vpravo muže v obleku s kyticí."
      - "Geometrické porovnání urbanek-ccs-066 a 067 nalezlo 306 konzistentních shod, z nichž 96,8 % odpovídá jednomu modelu výřezu a změny měřítka; nejde tedy o dva nezávislé okamžiky."
      - "Archivní název urbanek-ccs-067 označuje levého duchovního jako biskupa Marcelucha; obraz neobsahuje jméno ani úřad."
      - "Oficiální historie olomoucké diecéze CČSH uvádí, že po smrti Františka M. Hníka roku 1962 byl zvolen Leo Marceluch, na počátku jeho episkopátu byly ostravská a olomoucká diecéze administrativně sloučeny se sídlem v Olomouci a Marceluchův episkopát trval do roku 1988."
      - "Online kopie inventáře fondu Diecézní rada CČS(H) Olomouc uvádí přímo relevantní primární jednotky: korespondenci s NO Rychvald 1962–1980 (inv. 1448, karton 167), volbu a instalaci Leo Marcelucha 1962 (inv. 1829, karton 225), jeho služební korespondenci 1962–1987 (inv. 1833, karton 226) a fotografický soubor Rychvald, 7 kusů, 1970–1987 (karton 272)."
    partially_resolved_attributes:
      anniversary_subject_and_starting_event:
        value: "50. výročí založení/ustavení Církve československé v Rychvaldě; zakládající schůze na Fojtství 11. 4. 1920"
        status: independently_supported_by_contemporary_local_chronicle_city_history_and_official_CCSH_text
      Kare_person_identity:
