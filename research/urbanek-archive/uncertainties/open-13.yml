  - id: URB-U-0063
    status: open
    priority: high
    collection: Historie Církve československé v Rychvaldě ve fotografiích
    type: fiftieth_anniversary_1970_exact_context_Kare_Marceluch_people_and_program
    related_open_items: [URB-U-0054, URB-U-0059, URB-U-0062, URB-U-0064, URB-U-0068]
    source_items: [urbanek-ccs-047, urbanek-ccs-066, urbanek-ccs-067]
    question: >-
      Kdy přesně a při jaké události se konalo padesáté výročí uváděné rokem 1970,
      čeho bylo výročí, kdo byli přítomní duchovní a další hosté, jak znělo celé jméno
      useknuté po řetězci „Kare“, kdo byl archivně označený biskup Marceluch, jaká je
      správná podoba jeho jména a úřadu a jaký byl program a rozsah oslav?
    known_facts:
      - "Urbanek-ccs-047 zachycuje v kněžišti tři muže v duchovním oděvu a jednoho muže v obleku."
      - "Duchovní vlevo na urbanek-ccs-047 má výrazný řetěz nebo insignii a drží kytici; další osoba také drží kytici."
      - "Na oltáři urbanek-ccs-047 je viditelný kalich a květinová výzdoba."
      - "Rok 1970 a formulace o 50. výročí založení CČS v Rychvaldě pocházejí z archivního názvu urbanek-ccs-047 a z názvu druhé podsložky."
      - "Urbanek-ccs-066 zachycuje dítě podávající ruku ústřednímu duchovnímu s kyticí a knihami nebo složkou."
      - "Název urbanek-ccs-066 končí řetězcem ‚Kare‘; pokračování jména v dochovaném názvu chybí."
      - "Urbanek-ccs-067 je širší reprodukce přesně téhož fotografického obrazu jako urbanek-ccs-066 a navíc ukazuje vlevo holohlavého duchovního s řetězem nebo insignií a vpravo muže v obleku s kyticí."
      - "Geometrické porovnání urbanek-ccs-066 a 067 nalezlo 306 konzistentních shod, z nichž 96,8 % odpovídá jednomu modelu výřezu a změny měřítka; nejde tedy o dva nezávislé okamžiky."
      - "Archivní název urbanek-ccs-067 označuje levého duchovního jako biskupa Marcelucha; obraz neobsahuje jméno ani úřad."
    unresolved_attributes:
      - exact_event_date
      - exact_anniversary_subject_and_starting_event
      - independent_confirmation_of_year_1970
      - complete_Kare_name_and_identity
      - Marceluch_authoritative_name_spelling_identity_and_episcopal_office
      - identities_and_roles_of_clergy_and_other_guests
      - identity_and_meaning_of_each_chain_or_insignia
      - exact_service_ceremony_welcome_and_program
      - identities_of_children_and_welcoming_participants
      - invited_guests_and_attendance
      - relationship_between_items_047_066_067_and_other_1970_visit_images
      - relationship_to_Chrobacek_Vodicka_Bogumski_and_baptism_series
    next_action: >-
      Hledat výroční program, sborovou a obecní kroniku, zápisy rady starších, dobový
      tisk, návštěvní protokoly, personální prameny k Marceluchovi a osobě Kare…, seznam
      hostů a další popsané fotografie z roku 1970. Urbanek-ccs-066 a 067 počítat jako
      dvě archivní reprodukce jednoho fotografického obrazu, nikoli dva doklady události.
    reopen_triggers:
      - anniversary_program_found
      - church_or_municipal_chronicle_entry_found
      - dated_press_report_found
