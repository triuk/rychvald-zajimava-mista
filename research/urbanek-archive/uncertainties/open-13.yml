  - id: URB-U-0064
    status: open
    priority: high
    collection: Historie Církve československé v Rychvaldě ve fotografiích
    type: anniversary_baptisms_number_Vodicka_families_clergy_and_register
    related_open_items: [URB-U-0050, URB-U-0063, URB-U-0067, URB-U-0068]
    source_items: [urbanek-ccs-048, urbanek-ccs-068, urbanek-ccs-069]
    question: >-
      Kdy se křtiny konaly, šlo při výroční návštěvě skutečně o tři křty, komu byly
      děti křtěny, kdo jsou rodiče, kmotři a ostatní účastníci, kteří duchovní obřady
      vedli, který z nich je farář Vodička a jak jednotlivé fotografie a rodiny souvisejí?
    known_facts:
      - "Urbanek-ccs-048 zachycuje ženu se zavinutým dítětem před duchovním, který má v rukou knihu nebo obřadní text."
      - "Mezi nimi na urbanek-ccs-048 stojí vysoká křestní svíce a v pozadí jsou další dospělí a nejméně dva duchovní."
      - "Jeden muž v pozadí urbanek-ccs-048 má brýle; archivní název označuje muže v brýlích jako faráře Vodičku."
      - "EXIF datum 1. září 2014 u urbanek-ccs-048 dokládá digitalizaci nebo reprodukci, nikoli křtiny roku 1970."
      - "Urbanek-ccs-068 zachycuje jeden jasně viditelný kojenec, ženu, obřad vedoucího duchovního, vysokou křestní svíci a několik dalších rodinných a duchovních skupin."
      - "Archivní název urbanek-ccs-068 tvrdí, že při této příležitosti proběhly troje křtiny; jediný snímek přesný počet tří samostatných křtů neprokazuje."
      - "Urbanek-ccs-069 zachycuje jinou nebo jinak postavenou rodinnou skupinu: ženu s kojencem, dva muže v oblecích a duchovního fotografovaného zezadu s výrazným řetězem nebo insignií."
      - "Archivní název urbanek-ccs-069 sám klade otázku totožnosti křtěnců."
      - "Společný interiér, archivní pořadí a obřadní charakter podporují souvislost urbanek-ccs-048, 068 a 069 s jednou výroční sérií, ale neurčují přesné rodiny, pořadí ani počet obřadů."
    unresolved_attributes:
      - exact_baptism_date
      - independent_confirmation_of_year_1970
      - independent_confirmation_of_three_baptisms
      - number_of_distinct_infants_and_families_across_images
      - infant_parent_and_godparent_identities
      - Vodicka_identity_and_position_in_each_image
      - identities_of_officiating_clergy
      - identity_and_role_of_chain_bearing_clergy
      - identities_of_other_clergy_and_participants
      - baptism_register_entries
      - relationship_between_images_048_068_069
      - relationship_to_anniversary_or_clergy_visit
    next_action: >-
      Hledat matriku křtů, sborovou a obecní kroniku, rodinná alba, návštěvní a výroční
      program roku 1970 a popsané paralelní fotografie. Počet tří křtů nepřebírat jako
      obrazově potvrzený a faráře Vodičku ani jiné duchovní neurčovat podle vzhledu,
      brýlí, řetězu nebo polohy.
    reopen_triggers:
      - baptism_register_entries_found
      - three_baptisms_documented
      - family_identification_provided
      - clergy_visit_program_found
      - captioned_parallel_photo_found
      - Vodicka_or_other_clergy_personnel_record_found
