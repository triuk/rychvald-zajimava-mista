      - exact_event_date_in_1970
      - independent_period_confirmation_that_items_047_066_067_are_from_same_anniversary_event
      - complete_literal_filename_text_after_Kare
      - Karel_Vodicka_exact_role_and_visit_program_in_1970
      - direct_documentary_identification_of_left_clergy_in_item_067_as_Leo_Marceluch
      - central_clergy_identity_in_items_066_067
      - identities_and_roles_of_other_clergy_and_guests
