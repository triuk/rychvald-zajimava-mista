      - relationship_between_items_047_066_067_and_other_1970_visit_images
      - relationship_to_Chrobacek_Vodicka_Bogumski_and_baptism_series
    next_action: >-
      Primárně prověřit fond Diecézní rady CČS(H) Olomouc v Národním archivu:
      inv. č. 1448 (korespondence s NO Rychvald 1962–1980, karton 167), případně
      Marceluchovu korespondenci inv. č. 1833 a fotografický soubor Rychvald 1970–1987
      v kartonu 272. Hledat program, přesné datum, seznam hostů a popisy fotografií.
      Useknutý filename `Kare…` ponechat doslova; Karel Vodička je identifikace osoby
      z konvergentních pramenů, nikoli rekonstruovaný text názvu souboru.
