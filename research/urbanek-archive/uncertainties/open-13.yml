  - id: URB-U-0065
    status: open
    priority: high
    collection: Historie Církve československé v Rychvaldě ve fotografiích
    type: restored_Jan_Hus_bonfire_tradition_procession_date_people_and_caption
    related_open_items: [URB-U-0058, URB-U-0061]
    source_items: [urbanek-ccs-049, urbanek-ccs-050, urbanek-ccs-051, urbanek-ccs-052, urbanek-ccs-053, urbanek-ccs-054]
    question: >-
      Kdy a kým byla obnovena tradice husovské hranice, jak zněl celý useknutý
      popisek, zachycují oba průvodové snímky a série hranice stejný ročník, kdo jsou
      vedoucí osoby, hudebníci, hasiči a ostatní účastníci, jaká byla trasa a jak
      dlouho tradice pokračovala?
    known_facts:
      - "Urbanek-ccs-049 zachycuje hořící hranici z polen s černobílým portrétem nebo obrazem mužské postavy, početný dav a ženu v černém liturgickém oděvu."
      - "Archivní název urbanek-ccs-049 identifikuje portrét jako Jana Husa a tvrdí obnovení tradice, ale končí useknutým řetězcem `far.`."
      - "EXIF datum 15. března 2012 u urbanek-ccs-049 je v rozporu s plně olistěnou letní scénou a není spolehlivou datací události."
      - "Urbanek-ccs-050 zachycuje průvod podél kostela vedený dvěma ženami, za nimiž kráčejí hasiči v zásahovém oděvu a další účastníci."
      - "Urbanek-ccs-051 zachycuje muže s českou vlajkou, dechovou hudbu a další část venkovního průvodu."
      - "Urbanek-ccs-052 zachycuje nezapálenou hranici z polen s připevněným kresleným portrétem a okolním davem."
      - "Urbanek-ccs-053 zachycuje stejnou konstrukci a portrét při hoření v detailu."
      - "Urbanek-ccs-054 zachycuje tutéž hořící hranici v širokém pohledu s početným davem a několika hasiči."
      - "Přesné obrazové porovnání potvrzuje, že urbanek-ccs-052, 053 a 054 tvoří posloupnost téže hranice před zapálením a při hoření."
      - "Rychvaldská kronika k roku 1969 přímo dokládá Husovu oslavu k 600. výročí narození Jana Husa: po dechovém koncertu před MNV se průvod odebral na sokolské cvičiště, kde byla za setmění zapálena hranice; pořadatelem byla Národní fronta a projev pronesl Svatoslav Čechovský."
      - "Navazující rychvaldská kronika přímo datuje Husovu oslavu na Sokolovně s pálením hranice k 4. 7. 1970; projev pronesl předseda Národní fronty Vítězslav Gruščík."
      - "Kronika 1989–2000 označuje rychvaldskou husitskou pouť roku 1990 již jako tradiční, ale samotný zápis roku 1990 neurčuje osobu, která obnovila pálení hranice."
      - "Dne 5. 7. 1993 je přímo doloženo tradiční symbolické pálení hranice: průvod vyšel od Husova sboru v 17.00 na hřiště Sokola Rychvald; následující den se konala tradiční pouť."
      - "Tentýž kronikářský oddíl uvádí, že v roce 1993 stála již osm let v čele náboženské obce farářka Jana Šilerová a její působení církev viditelně aktivizovalo; výslovné tvrzení, že právě ona obnovila hranici, ale nalezený text neobsahuje."
      - "Rok 1997 přímo dokládá další pálení hranice 5. července, tentokrát na zahradě hasičské zbrojnice, narušené povodňovým deštěm."
      - "Rychvaldský zpravodaj 4/1998 uvádí, že 5. července se účastníci `jako každý rok` v 17 hodin vydají od Husova sboru na místní Sokolovnu k pálení hranice; průvod toho roku měli doprovázet trubači z německého Dessau."
      - "Kronika 2001–2010 opakovaně dokládá pokračování husitské pouti a pálení hranice nejméně do roku 2007."
      - "Vztah urbanek-ccs-050 a 051 ke stejnému průvodu a vztah průvodu k hranici z téhož ročníku zůstávají pracovní hypotézou."
      - "Urbanek-ccs-050 až 054 nemají použitelná embedded metadata pro dataci události."
    partially_resolved_attributes:
      pre_1989_precedent:
        value: "1969: dechový koncert před MNV, průvod na sokolské cvičiště a Husova hranice; 4. 7. 1970: Husova oslava s hranicí na Sokolovně"
        status: directly_supported_by_contemporary_local_chronicles
      modern_route_and_time:
        value: "5. 7. 1993 a znovu 5. 7. 1998 v 17.00: průvod od Husova sboru na Sokolovnu / hřiště Sokola, následovaný pálením hranice"
        status: independently_supported_by_municipal_chronicle_and_1998_local_newsletter
      modern_documented_duration:
        value: "opakovaná moderní tradice přímo doložena 1993, 1997, 1998 a dále v kronice nejméně do 2007"
        status: independently_supported_by_municipal_chronicles_and_local_newsletter
        scope_note: "Doložené body neprokazují nepřerušenou každoroční řadu ani kontinuitu od roku 1970."
      Jana_Silerova_context:
        value: "Jana Šilerová byla roku 1993 již osm let v čele rychvaldské náboženské obce CČSH a její působení ji podle kroniky viditelně aktivizovalo; v dalších ročnících je doložena jako účastnice církevní podoby tradice"
        status: independently_supported_context_not_restoration_authorship
        scope_note: "Je silnou kontextovou kandidátkou pro useknuté `obnovila far..`, ale nalezené prameny výslovně nepotvrzují, že právě ona tradici obnovila."
