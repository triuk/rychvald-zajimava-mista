    next_action: >-
      Hledat programy adventních akcí z let 2008 a 2011, církevní a obecní kroniku,
      zpravodaj, záznamy místního ochotnického souboru a další fotografie stejných
      sérií. Embedded data porovnat s textovými prameny a osoby neurčovat pouze podle
      podobnosti tváří mezi ročníky.
