items:
  - id: URB-U-0066
    status: open
    priority: medium
    collection: Historie Církve československé v Rychvaldě ve fotografiích
    type: recurring_living_nativity_dates_organizer_cast_location_and_local_amateur_actors
    source_items: [urbanek-ccs-055, urbanek-ccs-056]
    question: >-
      Ve kterých letech a na jakém místě se živý betlém konal, kdo jej pořádal a
      režíroval, kdo byli účinkující a jaké hráli role, byli skutečně členy místního
      ochotnického souboru, jak se obsazení a program mezi ročníky měnily a jak dlouho
      se tradice opakovala?
    known_facts:
      - "Urbanek-ccs-055 zachycuje venkovní skupinu kostýmovaných dospělých před moderní budovou; žena v modrém drží zavinutou dětskou postavu nebo rekvizitu a jiná žena drží mikrofon."
      - "Archivní název urbanek-ccs-055 označuje scénu jako živý betlém."
      - "EXIF urbanek-ccs-055 uvádí fotoaparát Panasonic DMC-TZ3 a čas 10. prosince 2011 v 16:14:43; tento údaj není sám o sobě nezávislým potvrzením data veřejné události."
      - "Urbanek-ccs-056 zachycuje kostýmovanou skupinu před kulisou chléva a zřetelně živé dítě v náručí ženy v modrém."
      - "V pozadí urbanek-ccs-056 jsou diváci, moderní budova a kostelní věž."
      - "Archivní název urbanek-ccs-056 tvrdí, že postavy hráli místní ochotníci; obraz sám členství v souboru neprokazuje."
      - "EXIF urbanek-ccs-056 uvádí fotoaparát Sony DCR-HC96E a čas 6. prosince 2008 v 16:04:44."
      - "Rozdílná embedded data a odlišné záběry dokládají nejméně dvě digitální fotografické série; zda přesně odpovídají dvěma veřejným ročníkům, musí potvrdit program nebo kronika."
      - "Živé dítě je obrazově potvrzeno pouze na urbanek-ccs-056; nelze tím automaticky určit povahu dětské postavy na urbanek-ccs-055."
