  question: >-
    Kdy byla pamětní deska Karla a Libuše Vodičkových instalována, co je podle neúplných archivních popisků umístěno
    nebo uloženo za ní, jsou data a role uvedené na desce doložitelné dalšími prameny, jaký byl vztah a význam Libuše Vodičkové,
    je rámovaný portrét skutečně Karlem Vodičkou a které osoby na skupinových fotografiích jsou Karel a Libuše Vodičkovi?
    Kdy proběhla zachycená návštěva a patří k roku 1965, 1970 nebo k jiné události? Zachycují položky 142 až 152 skutečně
    pohřeb Karla Vodičky v červnu 1970, jaká místnost Husovy československé bohoslovecké fakulty v Praze hostila obřad, jaká
    je přesná historická adresa, kdo jsou uniformované osoby a lidé v dlouhých tmavých oděvech a zda salutující uniformovaní
    účastníci tvořili oficiální čestnou stráž? Kdy a při jaké příležitosti bylo v rychvaldském sboru vytvořeno pietní uspořádání
    zachycené na položkách 153 a 154?
  known_facts:
  - Deska obsahuje čitelná jména Karel Vodička a Libuše Vodičková a jejich životní data.
  - Ruční přepis fotografie desky uvádí u Karla Vodičky `2. 8. 1890 – 12. 6. 1970` a u Libuše Vodičkové `23. 3. 1900 – 21. 9. 1973`.
  - Nápis označuje Karla Vodičku jako prvního faráře zdejší náboženské obce, budovatele sboru a spoluzakladatele Církve československé husitské.
  - Starší rychvaldská kronika nezávisle uvádí Karla Vodičku jako prvního československého faráře ustanoveného od 1. 5. 1920 a jeho narození 2. VIII. 1890 ve Vacovech/Vácovech u Klatov.
  - Odborný životopis Martina Jindry na ÚSTR nezávisle potvrzuje narození 2. 8. 1890, převzetí rychvaldské duchovní správy v květnu 1920 a působení v Rychvaldu do 11. 10. 1938.
  - Rychvaldská kronika roku 1970 potvrzuje, že při místním 50. výročí přijel z Prahy první rychvaldský farář, osmdesátiletý Karel Vodička, a že v červnu po úrazu náhle zemřel; poškozený znak v datu oslavy se nerekonstruuje.
  - ÚSTR uvádí úmrtí Karla Vodičky 12. 6. 1970 a smuteční rozloučení 18. 6. 1970 v Husově sboru v Praze-Dejvicích.
  - Rychvaldský zpravodaj 4/1993 uvádí desku v prostoru před vstupem do hlavní kostelní lodě, vračanský mramor, rozměr 90 × 50 cm a odhalení 8. 7. 1973.
  - OCR vrstva zpravodaje 4/1993 čte v citaci desky datum narození `2.5.1890`; ruční přepis fotografie desky, starší kronika a ÚSTR shodně uvádějí 2. srpen, proto se OCR hodnota nepoužívá jako historický protiúdaj bez vizuální kontroly tištěné stránky.
  - Oficiální článek CČSH `Je nám 100 let!` výslovně uvádí, že urna s popelem Karla Vodičky je uložena za pamětní deskou ve vstupní hale rychvaldského sboru.
  - Oficiální článek o urně mluví výslovně o Karlu Vodičkovi; neprokazuje uložení urny nebo ostatků Libuše Vodičkové za deskou.
  - Archivní názvy položek 059 a 155 jsou useknuté a samotný chybějící doslovný text se nadále nerekonstruuje.
  - Urbanek-ccs-059 a urbanek-ccs-155 jsou přesné binární duplikáty se SHA a5781859d0d64384fff6d1c55a9e9100539ec22d.
  - Fotografie desky má embedded datum 14. 10. 2010, které dokládá pořízení snímku, nikoli instalaci desky.
  - Urbanek-ccs-060 zachycuje muže v duchovním oděvu a brýlích; jméno ThDr. Karel Vodička a funkce prvního faráře pocházejí z archivního názvu a portrét není identifikován podle obličeje.
  - Urbanek-ccs-064 a 065 zachycují skupiny osob připisované archivními názvy manželům Vodičkovým a Bogumským; jednotlivé identity nejsou obrazově určeny.
  - Existence Vodičkovy návštěvy Rychvaldu v jubilejním roce 1970 je nyní nezávisle potvrzena kronikou, ale jednotlivé skupinové snímky 064/065 nejsou bezpečně přiřazeny k roku 1965 nebo 1970.
  - Název šesté podsložky připisuje položky 142 až 155 pohřbu Karla Vodičky v červnu 1970; nezávislý životopis ÚSTR potvrzuje skutečné smuteční rozloučení 18. 6. 1970 v Husově sboru Praha-Dejvice.
  - Položky 142 až 147 zachycují rakev nebo související interiér, smuteční výzdobu, shromáždění a osoby v uniformách a dlouhých tmavých oděvech.
  - Urbanek-ccs-148 zachycuje vynášení rakve z budovy označené nápisem `HUSOVA ČESKOSLOVENSKÁ BOHOSLOVECKÁ FAKULTA V PRAZE`.
  - Urbanek-ccs-149 ukazuje na fasádě číslo `5` a salutující uniformované osoby; salutování samo neprokazuje organizaci ani status oficiální čestné stráže.
  - Oficiální historie CČSH potvrzuje, že od roku 1950 sídlila Husova československá bohoslovecká fakulta s aulou a učebnami ve stejné dejvické budově jako bohoslovecká kolej; viditelný fakultní nápis proto není v rozporu s lokalizací pohřbu do Husova sboru Praha-Dejvice.
  - Současný Husův sbor Praha-Dejvice je veden na adrese Wuchterlova 523/5; přesná historická poštovní podoba adresy v červnu 1970 zůstává neuzavřena.
  - Položky 149 až 151 zachycují navazující situaci před stejným vstupem s uniformovanými, duchovními nebo jinak dlouze oděnými a civilními účastníky; přesné role se z oděvu neurčují.
  - Urbanek-ccs-152 zachycuje ženu mezi dvěma muži, kteří ji drží nebo podpírají; identity, vztahy a důvod podpory nejsou určeny.
  - Urbanek-ccs-153 zachycuje oltář, krucifix, svíce, květiny a rámovaný portrét s černou stuhou; lokalizace do Rychvaldu pochází z názvu.
  - Urbanek-ccs-154 je bližší záběr stejného pietního uspořádání; identifikace portrétu jako Karla Vodičky pochází z archivního názvu.
  - Položky 153 a 154 nejsou binární duplikáty a dosud nemají nezávisle potvrzené datum ani příležitost.
