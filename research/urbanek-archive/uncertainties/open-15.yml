  question: Kdy byla pamětní deska Karla a Libuše Vodičkových instalována, co je podle neúplných archivních popisků umístěno
    nebo uloženo za ní, jsou data a role uvedené na desce doložitelné dalšími prameny, jaký byl vztah a význam Libuše Vodičkové,
    je rámovaný portrét skutečně Karlem Vodičkou a které osoby na skupinových fotografiích jsou Karel a Libuše Vodičkovi?
    Kdy proběhla zachycená návštěva a patří k roku 1965, 1970 nebo k jiné události? Zachycují položky 142 až 152 skutečně
    pohřeb Karla Vodičky v červnu 1970, jaká místnost Husovy československé bohoslovecké fakulty v Praze hostila obřad, jaká
    je přesná historická adresa, kdo jsou uniformované osoby a lidé v dlouhých tmavých oděvech a zda salutující uniformovaní
    účastníci tvořili oficiální čestnou stráž? Kdy a při jaké příležitosti bylo v rychvaldském sboru vytvořeno pietní uspořádání
    zachycené na položkách 153 a 154?
  known_facts:
  - Deska obsahuje čitelná jména Karel Vodička a Libuše Vodičková a jejich životní data.
  - Nápis označuje Karla Vodičku jako prvního faráře zdejší náboženské obce, budovatele sboru a spoluzakladatele Církve československé
    husitské.
  - Čitelné znění desky je přepsáno v klasifikacích dávek 12 a 31.
  - Archivní názvy položek 059 a 155 uvádějí, že je něco za deskou umístěno nebo uloženo, ale neuvádějí co.
  - Urbanek-ccs-059 a urbanek-ccs-155 jsou přesné binární duplikáty se SHA a5781859d0d64384fff6d1c55a9e9100539ec22d.
  - Fotografie desky má embedded datum 14. října 2010, které dokládá pořízení snímku, nikoli instalaci desky.
  - Urbanek-ccs-060 zachycuje muže v duchovním oděvu a brýlích; jméno ThDr. Karel Vodička a funkce prvního faráře pocházejí
    z archivního názvu.
  - Urbanek-ccs-064 a 065 zachycují skupiny osob připisované archivními názvy manželům Vodičkovým a Bogumským; jednotlivé
    identity nejsou obrazově určeny.
  - Název druhé podsložky zmiňuje návštěvu faráře Vodičky v letech 1965 a 1970, ale jednotlivé fotografie nejsou samy datovány.
  - Název šesté podsložky připisuje položky 142 až 155 pohřbu bratra faráře ThDr. Karla Vodičky v červnu 1970; jde o archivní
    atribuci.
  - Položky 142 až 147 zachycují rakev nebo související interiér, smuteční výzdobu, shromáždění a osoby v uniformách a dlouhých
    tmavých oděvech.
  - Urbanek-ccs-148 zachycuje vynášení rakve z budovy označené nápisem HUSOVA ČESKOSLOVENSKÁ BOHOSLOVECKÁ FAKULTA V PRAZE.
  - Položky 149 až 151 zachycují navazující situaci před stejným vstupem s uniformovanými, duchovními a civilními účastníky.
  - Urbanek-ccs-152 zachycuje ženu v tmavém oděvu mezi dvěma muži, kteří ji drží nebo podpírají; identity, vztahy a důvod
    podpory nejsou určeny.
  - Urbanek-ccs-153 zachycuje oltář, krucifix, svíce, květiny a rámovaný portrét s černou stuhou; lokalizace do Rychvaldu
    pochází z názvu.
  - Urbanek-ccs-154 je bližší záběr stejného pietního uspořádání; identifikace portrétu jako Karla Vodičky pochází z archivního
    názvu.
  - Položky 153 a 154 nejsou binární duplikáty.
  - Položky 151 až 154 neobsahují použitelné embedded datum.
