    next_action: >-
      Hledat sborovou a obecní kroniku, personální a životopisné prameny, matriky,
      záznam o instalaci desky, úplný archivní popisek, evidenci případných uren nebo
      ostatků, programy návštěv roku 1965 a 1970 a další popsané reprodukce portrétu
      a skupin. Obsah za deskou, vztah Libuše Vodičkové ani osoby ve skupině nedoplňovat
      pouze podle kontextu nebo vzhledu.
