  next_action: Hledat sborovou a obecní kroniku, personální a životopisné prameny, matriky, záznam o instalaci desky, úplné
    archivní popisky, evidenci případných uren nebo ostatků, programy návštěv roku 1965 a 1970, nekrolog, smuteční oznámení,
    program a zápis pohřbu a dobové materiály Husovy československé bohoslovecké fakulty. Ověřit historickou adresu budovy
    s číslem 5, konkrétní místnost obřadu, dolní venkovní desku, příslušnost uniformovaných osob, případný status čestné stráže
    a datum i účel pietního uspořádání v rychvaldském sboru. Obsah za pamětní deskou, zemřelého, osoby ani jejich role nedoplňovat
    pouze podle kontextu, oděvu, uniformy nebo vzhledu.
