    question: >-
      Kdy byla pamětní deska Karla a Libuše Vodičkových instalována, co je podle useknutého archivního popisku umístěno
      za ní, jsou data a role uvedené na desce doložitelné dalšími prameny, jaký byl vztah a význam Libuše Vodičkové,
      je portrét skutečně Karlem Vodičkou a které osoby na skupinových fotografiích jsou Karel a Libuše Vodičkovi?
      Kdy proběhla zachycená návštěva a patří k roku 1965, 1970 nebo k jiné události? Zachycují položky 142 až 145
      skutečně pohřeb Karla Vodičky v červnu 1970, kde se obřad konal, kdo jsou uniformovaní muži a čtyři osoby
      v dlouhých tmavých oděvech a zda uniformovaní muži tvořili oficiální čestnou stráž?
    known_facts:
      - Deska obsahuje čitelná jména Karel Vodička a Libuše Vodičková a jejich životní data.
      - Nápis označuje Karla Vodičku jako prvního faráře zdejší náboženské obce, budovatele sboru a 
        spoluzakladatele Církve československé husitské.
      - Čitelné znění desky je přepsáno v klasifikaci dávky 12.
      - Archivní název fotografie desky končí řetězcem „umíst“, takže předmět nebo obsah za deskou není v 
        dochovaném názvu uveden celý.
      - Urbanek-ccs-060 zachycuje muže v duchovním oděvu a brýlích; jméno ThDr. Karel Vodička a funkce prvního
        faráře pocházejí z archivního názvu.
      - Fotografie desky má embedded datum 14. října 2010, které dokládá pořízení snímku, nikoli instalaci 
        desky.
      - Urbanek-ccs-064 zachycuje širší skupinu s dvěma ženami a dvěma muži sedícími v přední řadě; archivní 
        název je označuje jako faráře Vodičku a Bogumského s manželkami.
      - Urbanek-ccs-065 zachycuje tutéž čtveřici samostatně v zahradním prostředí; název ji lokalizuje k 
        faráři Bogumskému.
      - Snímky 064 a 065 neobsahují text ani jednoznačný znak dovolující přiřadit jednotlivá jména k osobám.
      - Název druhé podsložky zmiňuje návštěvu faráře Vodičky v letech 1965 a 1970, ale jednotlivé fotografie 
        nejsou samy datovány.
      - Název šesté podsložky připisuje položky 142 až 145 pohřbu bratra faráře ThDr. Karla Vodičky v červnu 
        1970; jde o archivní atribuci.
      - Urbanek-ccs-142 zachycuje rakev pod velkým krucifixem, množství věnců, květin a svící a čtyři 
        uniformované muže; dva v popředí mají viditelné dekorace nebo medaile.
      - Urbanek-ccs-143 zachycuje tentýž interiér v širokém pohledu s rakví, dvěma viditelnými uniformovanými 
        strážnými, početným shromážděním a osobami po stranách kněžiště.
      - Urbanek-ccs-144 a 145 zachycují rakev a čtyři dospělé osoby v dlouhých tmavých oděvech nebo pláštích.
      - Položky 142 až 145 neobsahují použitelné embedded datum ani obrazový text jednoznačně určující 
        zemřelého, datum nebo místo.
