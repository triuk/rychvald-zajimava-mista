    next_action: >-
      Hledat sborovou a obecní kroniku, personální a životopisné prameny, matriky, záznam o instalaci desky, úplný
      archivní popisek, evidenci případných uren nebo ostatků, programy návštěv roku 1965 a 1970, nekrolog, smuteční
      oznámení, program a zápis pohřbu, další popsané fotografie a záznamy, které by určily příslušnost uniformovaných
      mužů a případný status čestné stráže. Obsah za deskou, vztah Libuše Vodičkové, zemřelého ani osoby a jejich
      role nedoplňovat pouze podle kontextu, oděvu, uniformy nebo vzhledu.
