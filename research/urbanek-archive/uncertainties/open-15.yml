items:
  - id: URB-U-0067
    status: open
    priority: high
    collection: Historie Církve československé v Rychvaldě ve fotografiích
    type: Vodicka_memorial_plaque_hidden_content_biography_portrait_spouse_and_visit_groups
    related_open_items: [URB-U-0039, URB-U-0046, URB-U-0060, URB-U-0063, URB-U-0064, URB-U-0068]
    source_items: [urbanek-ccs-059, urbanek-ccs-060, urbanek-ccs-064, urbanek-ccs-065]
    question: >-
      Kdy byla pamětní deska Karla a Libuše Vodičkových instalována, co je podle
      useknutého archivního popisku umístěno za ní, jsou data a role uvedené na desce
      doložitelné dalšími prameny, jaký byl vztah a význam Libuše Vodičkové, je portrét
      skutečně Karlem Vodičkou a které osoby na skupinových fotografiích jsou Karel a
      Libuše Vodičkovi? Kdy proběhla zachycená návštěva a patří k roku 1965, 1970 nebo
      k jiné události?
    known_facts:
      - "Deska obsahuje čitelná jména Karel Vodička a Libuše Vodičková a jejich životní data."
      - "Nápis označuje Karla Vodičku jako prvního faráře zdejší náboženské obce, budovatele sboru a spoluzakladatele Církve československé husitské."
      - "Čitelné znění desky je přepsáno v klasifikaci dávky 12."
      - "Archivní název fotografie desky končí řetězcem ‚umíst‘, takže předmět nebo obsah za deskou není v dochovaném názvu uveden celý."
      - "Urbanek-ccs-060 zachycuje muže v duchovním oděvu a brýlích; jméno ThDr. Karel Vodička a funkce prvního faráře pocházejí z archivního názvu."
      - "Fotografie desky má embedded datum 14. října 2010, které dokládá pořízení snímku, nikoli instalaci desky."
      - "Urbanek-ccs-064 zachycuje širší skupinu s dvěma ženami a dvěma muži sedícími v přední řadě; archivní název je označuje jako faráře Vodičku a Bogumského s manželkami."
      - "Urbanek-ccs-065 zachycuje tutéž čtveřici samostatně v zahradním prostředí; název ji lokalizuje k faráři Bogumskému."
      - "Snímky 064 a 065 neobsahují text ani jednoznačný znak dovolující přiřadit jednotlivá jména k osobám."
      - "Název druhé podsložky zmiňuje návštěvu faráře Vodičky v letech 1965 a 1970, ale jednotlivé fotografie nejsou samy datovány."
