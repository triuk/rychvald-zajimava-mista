  next_action: Hledat personální schematismy a církevní adresáře, sborovou a obecní kroniku, zápisy rady starších, programy
    návštěv roku 1965 a 1970, program a seznam duchovních ostravické slavnosti, kroniku a archiv náboženské obce v Doubravě,
    dobové programy bohoslužeb a oslav, rodinné prameny, životopis a další popsané fotografie. Porovnat interiér položek 176
    až 180 s doloženými fotografiemi doubravského chrámu. Pravopis jména, osoby, místo ani přesný liturgický úkon neurčovat
    pouze podle archivního pořadí, polohy v obraze, tváře, oděvu nebo gesta.
