    collection: Historie Církve československé v Rychvaldě ve fotografiích
    type: Leonard_Bogumski_name_identity_service_spouse_garden_and_Vodicka_visit
    related_open_items: [URB-U-0063, URB-U-0064, URB-U-0067]
    source_items: [urbanek-ccs-062, urbanek-ccs-064, urbanek-ccs-065]
    question: >-
      Jaká je správná úřední podoba jména Leonard Bogumski nebo Bogumský, kdy a kde
      působil jako farář, je duchovní na portrétu skutečně on, která osoba na skupinových
      snímcích je Bogumský a která jeho manželka, kde byla zahrada, kdy přesně návštěva
      proběhla a šlo o rok 1965, rok 1970 nebo dvě různé návštěvy spojené s výročím?
    known_facts:
      - "Urbanek-ccs-062 zachycuje muže v duchovním oděvu a světlé štole, který čte z otevřené knihy za liturgickým stolem se znakem kalicha a kříže."
      - "Jméno Leonard Bogumski a funkce faráře pocházejí z archivního názvu urbanek-ccs-062."
      - "Urbanek-ccs-064 zachycuje širší skupinu, jejíž přední řadu tvoří dvě sedící ženy a dva sedící muži."
      - "Urbanek-ccs-065 zachycuje stejné čtyři sedící osoby samostatně před zahradním plotem."
      - "Archivní názvy tvrdí, že jde o faráře Vodičku a Bogumského s manželkami a že zahradní snímek vznikl u faráře Bogumského."
      - "Název druhé podsložky uvádí návštěvu faráře Vodičky v letech 1965 a 1970 u příležitosti textu končícího číslem 50; tento folderový údaj je archivní metadata, nikoli potvrzená datace jednotlivých snímků."
      - "Archiv používá pravopisné varianty Bogumski a Bogumský."
