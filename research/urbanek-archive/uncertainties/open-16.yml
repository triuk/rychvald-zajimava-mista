  question: Jaká je správná úřední podoba jména Leonard Bogumski, Bogumský nebo Bugumský, kdy a kde působil jako farář, je
    duchovní na portrétu skutečně on, která osoba na skupinových snímcích je Bogumský a která jeho manželka, kde byla zahrada,
    kdy přesně návštěvy proběhly a koho přesně označuje archivní název „Vlevo Leonard Bugumský“ na fotografii slavnosti u
    kaple na Ostravici?
  known_facts:
  - Urbanek-ccs-062 zachycuje muže v duchovním oděvu a světlé štole, který čte z otevřené knihy za liturgickým stolem se znakem
    kalicha a kříže.
  - Jméno Leonard Bogumski a funkce faráře pocházejí z archivního názvu urbanek-ccs-062.
  - Urbanek-ccs-064 zachycuje širší skupinu, jejíž přední řadu tvoří dvě sedící ženy a dva sedící muži.
  - Urbanek-ccs-065 zachycuje stejné čtyři sedící osoby samostatně před zahradním plotem.
  - Archivní názvy tvrdí, že jde o faráře Vodičku a Bogumského s manželkami a že zahradní snímek vznikl u faráře Bogumského.
  - Název druhé podsložky uvádí návštěvu faráře Vodičky v letech 1965 a 1970; jde o archivní metadata, nikoli potvrzenou dataci
    jednotlivých snímků.
  - Archiv používá pravopisné varianty Bogumski a Bogumský; urbanek-ccs-128 používá podobu Bugumský.
  - Urbanek-ccs-128 zachycuje otevřený vstup kaple, oltář s kalichem, svícny a květinami, centrálního duchovního s řetězem
    a početnou skupinu dalších duchovních.
  - Archivní název urbanek-ccs-128 zní „Vlevo Leonard Bugumský“.
  - V levé části urbanek-ccs-128 je několik mužů, takže bez původní anotace nelze bezpečně určit, kterou osobu výraz „vlevo“
    označuje.
  - Urbanek-ccs-128 neobsahuje použitelné embedded datum.
