- id: URB-U-0070
  status: open
  priority: high
  collection: Historie Církve československé v Rychvaldě ve fotografiích
  type: Ostravice_chapel_ceremony_date_Chrobacek_diocesan_council_bishop_children_participants_and_sequence
  source_items:
  - urbanek-ccs-104
  - urbanek-ccs-105
  question: Jakou slavnost nebo bohoslužbu zachycují popsané snímky z kaple na Ostravici, kdy a kde se konala, zda oba snímky
    patří k téže události, kdo byl muž označený popiskem jako zástupce diecézní rady bratr Chrobáček, koho popisek označuje
    jako biskupa, kdo byla dívka s květinovým věncem, které děti zastupovala a kdo byli ostatní účastníci?
  known_facts:
  - Urbanek-ccs-104 zachycuje muže v obleku a brýlích před oltářem při gestu připomínajícím proslov.
  - Vložený popisek na urbanek-ccs-104 je čitelný jako „Zástupce diec.rady br.Chrobáček vítá účastníky.“
  - Urbanek-ccs-105 zachycuje dívku nebo mladou ženu s květinovým věncem při předávání kytice muži v tmavém liturgickém oděvu
    a brýlích.
  - Vložený popisek na urbanek-ccs-105 je čitelný jako „Uvítání br.biskupa za děti“.
  - Přepisy popisků jsou obrazově ověřené, ale jejich tvrzení o jménech, funkcích a reprezentaci dětí vyžadují nezávislé potvrzení.
  - Ani jeden soubor neobsahuje použitelné embedded datum.
  unresolved_attributes:
  - exact_event_name_purpose_and_date
  - exact_location_and_relationship_to_chapel
  - whether_items_104_and_105_show_same_event
  - Chrobacek_full_identity_and_diocesan_council_role
  - bishop_identity_office_and_visit_context
  - girl_identity_age_and_community
  - meaning_of_representing_children
  - identities_and_roles_of_other_participants
  - speech_and_welcome_program_content
  - caption_author_date_and_provenance
  - image_dates_and_photographers
  next_action: Dokončit navazující slavnostní fotografie v podsložce a porovnat osoby, oltář, prapory a pořadí. Hledat program
    slavnosti, kroniku kaple, diecézní zápis, dobový tisk, seznam duchovních a delegací a úplné album s původními popisky.
    Jména a úřady nepřidělovat pouze podle obličeje.
