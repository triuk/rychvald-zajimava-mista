- id: URB-U-0069
  status: open
  priority: high
  collection: Historie Církve československé v Rychvaldě ve fotografiích
  type: Ostravice_CCS_chapel_identity_location_history_architecture_Winkler_bell_tower_Hus_window_and_current_state
  source_items:
  - urbanek-ccs-102
  - urbanek-ccs-103
  question: Kde přesně stála nebo stojí archivně označená kaple CČS na Ostravici, kdy a kým byla postavena, projektována,
    vysvěcena a užívána, komu patřila, co přesně je takzvaná Winklerova zvonička, kdo byl Winkler, kdy vznikla a jaké měla
    zvony či funkci, jak se stavba a zvonička měnily, kdo vytvořil kruhové figurální okno a zda skutečně zobrazuje Jana Husa?
  known_facts:
  - Urbanek-ccs-102 zachycuje malou světlou stavbu na travnatém svahu s obdélným vstupem, kamennou opěrnou zdí a vysokou úzkou
    věžovou konstrukcí.
  - Název urbanek-ccs-102 označuje objekt jako kapli CČS na Ostravici a věž jako Winklerovu zvoničku; jde o archivní atribuci,
    nikoli nezávislé potvrzení.
  - Urbanek-ccs-103 zachycuje oltář nebo liturgický stůl s motivem kalicha, svícny a kruhové členěné okno s profilovým portrétem
    vousatého muže v pokrývce hlavy.
  - Název urbanek-ccs-103 připisuje portrét Janu Husovi; fotografie sama potvrzuje pouze viditelnou figurální podobu.
  - Ani jeden soubor neobsahuje použitelné embedded datum.
