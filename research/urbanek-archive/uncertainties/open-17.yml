    question: >-
      Jakou slavnost nebo bohoslužbu zachycují historické snímky z kaple na Ostravici, kdy a kde se konala, zda
      položky 104–106, 111–112 a 121–140 patří k jediné události, koho popisky označují jako biskupa, Chrobáčka,
      zástupce MNV, správce kaple a Leonarda Bugumského, kdo jsou další duchovní, krojované ženy, děti, vedoucí
      zpěvu a ostatní účastníci, komu patřily prapory a jaký byl program včetně uvítání, průvodu, společného zpěvu,
      projevů, případné listiny a úkonu s dítětem? Zachycuje závěrečný skupinový portrét 141 skutečně zájezd Rychvaldských
      s biskupem přibližně roku 1947, kde vznikl a jak souvisí s předchozí ostravickou sérií?
    known_facts:
      - Vložené popisky položek 104–106 označují uvítání účastníků Chrobáčkem a uvítání biskupa za děti a 
        zástupcem MNV.
      - Vložené popisky položek 111 a 112 znějí „Uvítání br.biskupa správcem Husitské kaple“ a „Záběr z 
        bohoslužeb“.
      - Vložené popisky položek 121 a 122 znějí „Závěr bohoslužeb.“ a „Záběr z bohoslužeb.“
      - Archivní název položky 122 končí useknutou formulací „asi v r. 1945 nebo .“; pokračování ani druhý rok
        nejsou známy.
      - Urbanek-ccs-123 až 125 zachycují průvod s vysokými prapory, zdobeně oděnými ženami nebo dívkami, 
        dětmi, civilními účastníky a početnou skupinou duchovních.
      - Texty, znaky a příslušnost praporů nejsou bezpečně čitelné.
      - Urbanek-ccs-126 zachycuje v interiéru několik duchovních, ústředního muže s řetězem a papírem, pult a 
        část shromáždění.
      - Urbanek-ccs-127 zachycuje velmi početné shromáždění před kaplí s dětmi, šátky, deštníky a okraji 
        praporů.
      - Urbanek-ccs-128 zachycuje otevřenou kapli, oltář s kalichem, svícny a květinami, centrálního 
        duchovního a další duchovní.
      - Archivní název 128 tvrdí „Vlevo Leonard Bugumský“, ale v levé části je několik osob a přesný referent 
        není obrazem jednoznačný.
      - Urbanek-ccs-129 zachycuje dva duchovní s řetězy proti sobě; jeden drží světlý dokument nebo listy. 
        Přesný úkon ani obsah nejsou určeny.
      - Urbanek-ccs-130 zachycuje stojícího duchovního při projevu a sedícího duchovního s otevřenou složkou 
        nebo knihou.
      - Opakované prostředí, oděvy, insignie, prapory a archivní posloupnost podporují širší slavnostní 
        sekvenci, nikoli automaticky jediný den nebo přesnou identitu osob.
      - Žádná z položek 104–106, 111–112 a 121–130 neobsahuje použitelné embedded datum.
      - Urbanek-ccs-131 zachycuje ženu ve zdobeném oděvu s velkou kyticí proti duchovnímu s řetězem nebo 
        insignií.
      - 'Urbanek-ccs-132 a 133 jsou dvě různé reprodukce téhož podkladového záběru: muž v obleku stojí vedle duchovního,
        který drží zavinuté malé dítě a květiny.'
      - Urbanek-ccs-133 zachovává širší okolí než 132; oba soubory představují pouze jeden nezávislý obrazový 
        doklad.
      - Urbanek-ccs-134 zachycuje duchovního s řetězem nebo insignií při projevu nebo čtení z listu papíru.
      - Urbanek-ccs-135 zachycuje zaplněný interiér s účastníky v jednoduchých dřevěných lavicích, knihami 
        nebo zpěvníky a vysokou žerdí či standardou v zadní části.
      - Žádná z položek 131 až 135 neobsahuje použitelné embedded datum.
      - Urbanek-ccs-136 zachycuje skupinu nejméně sedmi mužů v duchovních oděvech, několik knih nebo zpěvníků 
        a osoby s otevřenými ústy.
      - Urbanek-ccs-137 zachycuje početné shromáždění s knihami, dvě zdobeně oděné ženy a ženu stojící zády se
        zdviženou paží; obrazové uspořádání podporuje interpretaci vedeného společného zpěvu.
      - Urbanek-ccs-138 zachycuje dva duchovní s knihami, dvě ženy ve zdobeném oděvu, děti, několik vysokých 
        žerdí nebo praporů a muže v uniformě s čepicí.
      - Urbanek-ccs-139 zachycuje duchovního s brýlemi, otevřenou knihou a ozdobným řetězem s medailonem 
        motivu kalicha a kříže u oltáře se svícny, kalichem a zdobeným křížem.
      - Urbanek-ccs-139 je vizuálně podobná portrétu 120, ale podobnost obrazu není dokumentární identifikací 
        a jméno ani úřad se položce 139 nepřiřazují.
      - Urbanek-ccs-140 zachycuje velmi početný dav na zalesněném svahu, deštníky, knihy a fotografa s 
        fotoaparátem na vyvýšeném místě.
      - Žádná z položek 136 až 140 neobsahuje použitelné embedded datum ani čitelný vložený popisek.
      - Urbanek-ccs-141 zachycuje velkou skupinu dospělých a dětí před širokým vstupem do budovy; v přední 
        řadě sedí dva muži a je viditelná vycházková hůl.
      - Archivní název položky 141 uvádí „Fotografie asi z r. 1947. Zájezd Rychvaldských s biskup“; obraz sám 
        neurčuje datum, místo, účel cesty ani identitu biskupa.
      - Urbanek-ccs-141 neobsahuje použitelné embedded datum ani identifikační text v obrazu.
