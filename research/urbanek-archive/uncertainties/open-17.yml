  question: Kde přesně stála nebo stojí archivně označená Husova kaple CČS na Ostravici, kdy a kým byla postavena, projektována,
    otevřena a užívána, komu patřila, jaký vztah k ní má dřevěná „chatka“, co přesně je takzvaná Winklerova zvonice, kdo byl
    Winkler, jaké měla zvony a funkci, zda položky 102, 108 a 113 zachycují tutéž původní konstrukci, kdy a kým byla stará
    zvonice demontována a nová postavena, zda byl původní zvon přenesen, kdo vytvořil kruhové figurální okno a střešní znak
    kříže a kalicha, kdy byly instalovány pamětní desky a nakolik jsou jejich údaje historicky správné?
  known_facts:
  - Urbanek-ccs-102 zachycuje malou světlou stavbu na travnatém svahu s obdélným vstupem, kamennou opěrnou zdí a vysokou úzkou
    věžovou konstrukcí.
  - Název urbanek-ccs-102 označuje objekt jako kapli CČS na Ostravici a věž jako Winklerovu zvoničku; jde o archivní atribuci,
    nikoli nezávislé potvrzení.
  - Urbanek-ccs-103 zachycuje oltář nebo liturgický stůl s motivem kalicha, svícny a kruhové členěné okno s profilovým portrétem
    vousatého muže v pokrývce hlavy.
  - Název urbanek-ccs-103 připisuje portrét Janu Husovi; fotografie sama potvrzuje pouze viditelnou figurální podobu.
  - Urbanek-ccs-107 zachycuje nízkou tmavě dřevem obloženou stavbu na zalesněném svahu se sedlovou střechou, komínem a bílými
    okenicemi; archivní název ji označuje jako chatku na Ostravici.
  - Urbanek-ccs-108 a 113 zachycují subtilní otevřenou dřevěnou věžovou konstrukci; na položce 113 je viditelný zavěšený zvon
    nebo zřetelně zvonovitý předmět.
  - Urbanek-ccs-109 a 110 obsahují čitelné nápisy o roce 1937, Ferdinandu Stiborovi, Bohumíru Liškovi a Alfredu Farníkovi;
    čitelnost ověřuje znění nápisů, nikoli automaticky jejich historickou správnost.
  - Urbanek-ccs-114 a 115 zachycují tutéž novou zvonici se čtyřmi masivními dřevěnými sloupy, širokou stříškou, zavěšeným
    zvonem a vysokou kovovou tyčí s kruhovým symbolem.
  - Archivní název urbanek-ccs-114 tvrdí, že stará zvonice byla roku 2016 demontována a nahrazena novou; obraz sám ověřuje
    novou konstrukci, nikoli celý proces výměny.
  - EXIF urbanek-ccs-114 až 119 uvádí společné fotografické sezení 2. října 2016 mezi 14:04:23 a 14:07:01 fotoaparátem myPhone
    FUN4.
  - Urbanek-ccs-116 zachycuje společně novou zvonici, nízkou bílou kapli, pamětní desku, střešní znak kříže a kalicha a kamennou
    zídku.
  - Urbanek-ccs-117 zachycuje čelní fasádu kaple; urbanek-ccs-119 detail kovového střešního znaku.
  - Urbanek-ccs-118 je druhá fotografie stejné fyzické pamětní desky jako urbanek-ccs-109, nikoli druhé nezávislé historické
    svědectví.
