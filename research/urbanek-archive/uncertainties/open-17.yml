  next_action: Dokončit celou ostravickou podsložku a porovnat stavební stavy. Poté hledat církevní a obecní kroniku, stavební
    spis, katastrální a mapové podklady, diecézní archiv CČSH, dobový tisk, údaje o Winklerovi, zvonech a autorovi figurálního
    okna. Zvlášť ověřit pozdější snímky a tvrzení o výměně zvoničky roku 2016.
