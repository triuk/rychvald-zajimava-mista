  question: >-
    Kde přesně stála nebo stojí archivně označená Husova kaple CČS na Ostravici, kdy a kým byla postavena,
    projektována, otevřena a užívána, komu patřila, jaký vztah k ní má dřevěná „chatka“, co přesně je
    takzvaná Winklerova zvonice, kdo byl Winkler, jaké měla zvony a funkci, zda položky 102, 108 a 113
    zachycují tutéž původní konstrukci, kdy a kým byla stará zvonice demontována a nová postavena, zda byl
    původní zvon přenesen, kdo vytvořil kruhové figurální okno a nakolik jsou historicky správné údaje na
    pamětních deskách?
  known_facts:
  - Urbanek-ccs-102 zachycuje malou světlou stavbu na travnatém svahu s obdélným vstupem, kamennou opěrnou zdí a vysokou úzkou věžovou konstrukcí.
  - Název urbanek-ccs-102 označuje objekt jako kapli CČS na Ostravici a věž jako Winklerovu zvoničku; jde o archivní atribuci, nikoli nezávislé potvrzení.
  - Urbanek-ccs-103 zachycuje oltář nebo liturgický stůl s motivem kalicha, svícny a kruhové členěné okno s profilovým portrétem vousatého muže v pokrývce hlavy.
  - Název urbanek-ccs-103 připisuje portrét Janu Husovi; fotografie sama potvrzuje pouze viditelnou figurální podobu.
  - Urbanek-ccs-107 zachycuje nízkou tmavě dřevem obloženou stavbu na zalesněném svahu se sedlovou střechou, komínem a bílými okenicemi; archivní název ji označuje jako chatku na Ostravici.
  - Urbanek-ccs-108 zachycuje vysokou otevřenou dřevěnou věžovou konstrukci se stříškou, dlouhou horní kovovou tyčí, plošinou a venkovními lavicemi; zvon není z tohoto úhlu zřetelně rozeznatelný.
  - Konstrukce na urbanek-ccs-108 odpovídá typem, svislými trámy, stříškou a horní tyčí věži vedle kaple na urbanek-ccs-102 a pravděpodobně jde o tentýž objekt v pozdější době.
  - Urbanek-ccs-109 nese čitelný nápis, podle něhož byla Husova kaple s Winklerovou zvonicí postavena a slavnostně otevřena roku 1937 prvním ostravským biskupem Ferdinandem Stiborem.
  - Urbanek-ccs-110 nese čitelný nápis, podle něhož byla Husova kaple diecéze ostravské CČS vystavěna mezi 21. 3. a 4. 7. 1937 za biskupa Ferdinanda Stibora a předsedy propagačního sboru Bohumíra Lišky podle návrhu architekta inženýra Alfreda Farníka z darů příslušníků CČS.
  - Čitelnost desek ověřuje znění nápisů, nikoli automaticky historickou správnost údajů, dobu vzniku desek nebo jejich vztah k zachycenému objektu.
  - Urbanek-ccs-113 zachycuje subtilní otevřenou dřevěnou věžovou konstrukci s viditelným zavěšeným zvonem nebo zřetelně zvonovitým předmětem a početným davem.
  - Urbanek-ccs-114 a 115 zachycují tutéž novou zvonici se čtyřmi masivními dřevěnými sloupy, širokou stříškou, viditelným zavěšeným zvonem a vysokou kovovou tyčí s kruhovým symbolem.
  - Archivní název urbanek-ccs-114 tvrdí, že stará zvonice byla roku 2016 demontována a nahrazena novou; obraz sám ověřuje novou konstrukci, nikoli celý proces výměny.
  - EXIF urbanek-ccs-114 a 115 uvádí původní pořízení 2. října 2016 v časech 14:04:23 a 14:05:02; pokud byly hodiny fotoaparátu správné, nová konstrukce existovala nejpozději tohoto dne.
  - EXIF obou moderních snímků uvádí fotoaparát myPhone FUN4 a následné zpracování ve Windows Photo Editor; časový odstup 39 sekund podporuje společné fotografické sezení.
  - Žádný ze souborů 102, 103, 107 až 110 a 113 neobsahuje použitelné embedded datum.
