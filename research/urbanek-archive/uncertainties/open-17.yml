    question: >-
      Kde přesně stála nebo stojí archivně označená Husova kaple CČS na Ostravici, kdy a kým byla postavena, projektována,
      otevřena a užívána, komu patřila, jaký vztah k ní má dřevěná chatka, co přesně je takzvaná Winklerova zvonice,
      kdo byl Winkler, jaké měla zvony a funkci, kdy byla stará zvonice nahrazena novou, zda byl původní zvon přenesen,
      kdo vytvořil figurální okno a střešní znak a nakolik jsou historicky správné údaje na pamětních deskách?
    known_facts:
      - Urbanek-ccs-102 zachycuje malou světlou stavbu na svahu s opěrnou zdí a vysokou úzkou dřevěnou 
        konstrukcí.
      - Archivní názvy položek 102 a 108 označují věž jako Winklerovu zvoničku; jde o archivní atribuci.
      - Urbanek-ccs-103 zachycuje oltář nebo liturgický stůl, svícny a kruhové figurální okno; jméno Jan Hus 
        pochází z archivního názvu.
      - Urbanek-ccs-107 zachycuje nízkou dřevem obloženou stavbu na svahu, archivně označenou jako chatka na 
        Ostravici.
      - Urbanek-ccs-109 a 118 jsou dvě fotografie stejné fyzické pamětní desky s nápisem o Husově kapli, 
        Winklerově zvonici, roku 1937 a Ferdinandu Stiborovi; nejde o dva nezávislé nápisy.
      - Urbanek-ccs-110 nese nápis s obdobím 21. 3.–4. 7. 1937, Ferdinandem Stiborem, Bohumírem Liškou, 
        Alfredem Farníkem a dary příslušníků CČS.
      - Čitelnost desek potvrzuje znění nápisů, nikoli automaticky historickou správnost údajů nebo dobu 
        vzniku desek.
      - Urbanek-ccs-113 zachycuje starou dřevěnou věžovou konstrukci s viditelným zavěšeným zvonem nebo 
        zvonovitým předmětem.
      - Urbanek-ccs-114 a 115 zachycují novou masivní dřevěnou zvonici se zvonem; archivní název 114 tvrdí 
        výměnu roku 2016.
      - EXIF položek 114 až 119 uvádí souvislou fotografickou sérii areálu dne 2. října 2016 od 14:04:23 do 
        14:07:01, pokud byly hodiny fotoaparátu správné.
      - Urbanek-ccs-116 a 117 dokumentují celkový stav areálu a průčelí kaple v této moderní sérii.
      - Urbanek-ccs-119 zachycuje střešní kovový znak kříže a stylizovaného kalicha.
