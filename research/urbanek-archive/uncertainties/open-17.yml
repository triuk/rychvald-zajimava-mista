- id: URB-U-0070
  status: open
  priority: high
  collection: Historie Církve československé v Rychvaldě ve fotografiích
  type: Ostravice_chapel_ceremony_date_Chrobacek_diocesan_council_bishop_children_MNV_chapel_manager_service_participants_and_sequence
  source_items:
