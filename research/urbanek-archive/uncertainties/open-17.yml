  - urbanek-ccs-112
  question: >-
    Jakou slavnost nebo bohoslužbu zachycují popsané snímky z kaple na Ostravici, kdy a kde se konala, zda
    všechny patří k téže události, kdo byl muž označený jako zástupce diecézní rady bratr Chrobáček, koho
    popisky označují jako biskupa, kdo byla dívka s květinovým věncem, které děti zastupovala, kdo byl
    zástupce MNV, kdo byl správce Husitské kaple a kdo byli ostatní účastníci bohoslužeb?
  known_facts:
  - Urbanek-ccs-104 zachycuje muže v obleku a brýlích před oltářem při gestu připomínajícím proslov.
  - Vložený popisek na urbanek-ccs-104 je čitelný jako „Zástupce diec.rady br.Chrobáček vítá účastníky.“
  - Urbanek-ccs-105 zachycuje dívku nebo mladou ženu s květinovým věncem při předávání kytice muži v tmavém liturgickém oděvu a brýlích.
  - Vložený popisek na urbanek-ccs-105 je čitelný jako „Uvítání br.biskupa za děti“.
  - Urbanek-ccs-106 zachycuje muže v obleku proti duchovnímu v tmavém oděvu s brýlemi a řetězem nebo insignií; mezi nimi je kytice.
  - Vložený popisek na urbanek-ccs-106 je čitelný jako „Uvítání br.biskupa zástupcem MNV“.
  - Urbanek-ccs-111 zachycuje tři muže, z nichž ústřední muž v tmavém duchovním oděvu s řetězem nebo insignií stojí proti muži v obleku; vpravo další muž drží složku.
  - Vložený popisek na urbanek-ccs-111 je čitelný jako „Uvítání br.biskupa správcem Husitské kaple“.
  - Urbanek-ccs-112 zachycuje početný dav před otevřeným vstupem kaple a uvnitř oltář nebo liturgický stůl se svícny.
  - Vložený popisek na urbanek-ccs-112 je čitelný jako „Záběr z bohoslužeb“.
  - Přepisy popisků jsou obrazově ověřené, ale jejich tvrzení o jménech, funkcích, úřadech, reprezentaci dětí, MNV a správě kaple vyžadují nezávislé potvrzení.
  - Žádný ze souborů 104 až 106, 111 a 112 neobsahuje použitelné embedded datum.
