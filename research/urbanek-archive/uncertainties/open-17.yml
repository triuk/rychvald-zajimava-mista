  next_action: >-
    Dokončit celou ostravickou podsložku a porovnat další moderní snímky nové zvonice. Poté hledat církevní
    a obecní kroniku, stavební spis, katastrální a mapové podklady, diecézní archiv CČSH, dobový tisk, údaje
    o Winklerovi, zvonech, Bohumíru Liškovi, Alfredu Farníkovi a autorovi figurálního okna. Zvlášť hledat
    dokumentaci demontáže a nové stavby roku 2016, objednávku, povolení, zhotovitele, rozpočet, předání a
    údaj o případném přenesení zvonu.
