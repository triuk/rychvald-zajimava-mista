  question: Jakou slavnost nebo bohoslužbu zachycují popsané snímky z kaple na Ostravici, kdy a kde se konala, zda položky
    104 až 106, 111, 112 a 121 až 125 patří k téže události, zda souvisejí s portrétem označeným „Biskup dr.Horský“, kdo byli
    Chrobáček, biskup, zástupce MNV a správce kaple, kdo byli další duchovní, děti a krojovaní účastníci a kterým sborům nebo
    organizacím patřily prapory?
  known_facts:
  - Urbanek-ccs-104 až 106 a 111 obsahují čitelné vložené popisky o uvítání účastníků, biskupa, zástupce MNV a správce Husitské
    kaple.
  - Urbanek-ccs-112 obsahuje čitelný popisek „Záběr z bohoslužeb“ a zachycuje početný dav před otevřeným vstupem kaple.
  - Urbanek-ccs-121 zachycuje tři muže v duchovním oděvu, otevřenou knihu a výraznou insignii; vložený popisek zní „Závěr
    bohoslužeb.“
  - Urbanek-ccs-122 zachycuje velmi početné venkovní shromáždění, mnoho šátků a otevřených knih nebo zpěvníků; vložený popisek
    zní „Záběr z bohoslužeb.“
  - Archivní název urbanek-ccs-122 končí useknutou formulací „asi v r. 1945 nebo .“; pokračování ani druhý rok nejsou známy.
  - Urbanek-ccs-123 až 125 zachycují průvod na venkovské komunikaci s několika vysokými prapory, ženami nebo dívkami ve zdobeném
    oděvu, dětmi, civilními účastníky a početnou skupinou duchovních.
  - Na urbanek-ccs-124 jsou viditelné ozdobné hlavice praporů včetně tvarů připomínajících kříž a kouli, ale texty, znaky
    a příslušnost praporů nejsou čitelné.
  - Na urbanek-ccs-125 jsou viditelní četní muži v tmavém duchovním oděvu, někteří s kříži nebo závěsnými insigniemi.
  - Sdílené prapory, venkovská trasa a archivní posloupnost podporují souvislost položek 123 až 125, nikoli přesnou dataci
    nebo identitu účastníků.
  - Žádný ze souborů 104 až 106, 111, 112 a 121 až 125 neobsahuje použitelné embedded datum.
  - Podobnost tváří, oděvu nebo insignie není dostatečná k určení přítomnosti osoby označené jako Horský.
