  question: Jakou slavnost nebo bohoslužbu zachycují historické snímky z kaple na Ostravici, kdy a kde se konala, zda všechny
    položky 104–106, 111–112 a 121–130 patří k jediné události, koho popisky označují jako biskupa, Chrobáčka, zástupce MNV,
    správce kaple a Leonarda Bugumského, kdo jsou další duchovní, děti a krojovaní účastníci, komu patřily prapory a jaký
    byl program včetně projevů, průvodu a případného předávání listiny?
  known_facts:
  - Vložené popisky položek 104–106 označují uvítání účastníků Chrobáčkem a uvítání biskupa za děti a zástupcem MNV.
  - Vložené popisky položek 111 a 112 znějí „Uvítání br.biskupa správcem Husitské kaple“ a „Záběr z bohoslužeb“.
  - Vložené popisky položek 121 a 122 znějí „Závěr bohoslužeb.“ a „Záběr z bohoslužeb.“
  - Archivní název položky 122 končí useknutou formulací „asi v r. 1945 nebo .“; pokračování ani druhý rok nejsou známy.
  - Urbanek-ccs-123 až 125 zachycují průvod s vysokými prapory, zdobeně oděnými ženami nebo dívkami, dětmi, civilními účastníky
    a početnou skupinou duchovních.
  - Texty, znaky a příslušnost praporů nejsou bezpečně čitelné.
  - Urbanek-ccs-126 zachycuje v interiéru několik duchovních, ústředního muže s řetězem a papírem, pult a část shromáždění.
  - Urbanek-ccs-127 zachycuje velmi početné shromáždění před kaplí s dětmi, šátky, deštníky a okraji praporů.
  - Urbanek-ccs-128 zachycuje otevřenou kapli, oltář s kalichem, svícny a květinami, centrálního duchovního a další duchovní.
  - Archivní název 128 tvrdí „Vlevo Leonard Bugumský“, ale v levé části je několik osob a přesný referent není obrazem jednoznačný.
  - Urbanek-ccs-129 zachycuje dva duchovní s řetězy proti sobě; jeden drží světlý dokument nebo listy. Přesný úkon ani obsah
    nejsou určeny.
  - Urbanek-ccs-130 zachycuje stojícího duchovního při projevu a sedícího duchovního s otevřenou složkou nebo knihou.
  - Opakované prostředí, oděvy, insignie, prapory a archivní posloupnost podporují širší slavnostní sekvenci, nikoli automaticky
    jediný den nebo přesnou identitu osob.
  - Žádná z položek 104–106, 111–112 a 121–130 neobsahuje použitelné embedded datum.
