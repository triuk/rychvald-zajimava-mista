    question: >-
      Jak nezávisle ověřit osobu, datum, místo, účastníky, organizace, význam oděvních
      znaků a přesný sled události zachycené na položkách 156 až 165?
    known_facts:
      - Archivní názvy připisují sérii Ferdinandu Stiborovi, říjnu 1956 a radvanickému Husovu sboru; jde o archivní atribuce.
      - Položky 157 a 158 zachycují stejný interiér a pietní uspořádání z různých úhlů.
      - Položky 159 až 163 zachycují stejný nebo velmi podobný vstup a schodiště.
      - Na položkách 159, 162, 164 a dalších jsou viditelné řetězy nebo medailony; jejich význam není určen.
      - Na položkách 161 a 165 jsou světlé znaky připomínající kalich nebo medailon; jejich význam není určen.
      - Na položce 161 je světlá páska na paži s tmavým křížovitým znakem; organizace ani funkce nejsou určeny.
      - Položka 160 zachycuje shromáždění s prapory nebo korouhvemi.
      - Položka 163 zachycuje účastníky po stranách schodiště a převážně volný střední průchod.
      - Položky 164 a 165 zachycují navazující venkovní pohyb; na 164 je držen světlý předmět podobný knize nebo složce.
      - Všechny položky 156 až 165 mají odlišné Git blob SHA a žádná nemá použitelné embedded datum.
