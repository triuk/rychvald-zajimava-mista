  question: Jak nezávisle ověřit osobu, datum, místo, účastníky, organizace, význam oděvních znaků, původ věnců, identitu
    nesené rakve a přesný sled události zachycené na položkách 156 až 175?
  known_facts:
  - Archivní názvy připisují sérii Ferdinandu Stiborovi, říjnu 1956 a radvanickému Husovu sboru; jde o archivní atribuce.
  - Položky 157 a 158 zachycují stejný interiér a pietní uspořádání z různých úhlů.
  - Položky 159 až 163 zachycují stejný nebo velmi podobný vstup a schodiště.
  - Položky 166, 169, 173 a 174 zachycují zdobenou uzavřenou rakev nesenou průvodem; jde o rozdílné záběry stejné nebo bezprostředně
    navazující sekvence.
  - Položka 171 zachycuje několik skupin nesoucích velké květinové věnce.
  - Položky 167, 168, 170, 172 a 173 zachycují uliční části průvodu s osobami v dlouhých tmavých oděvech, knihami, řetězy,
    medailony nebo světlými znaky připomínajícími kalich.
  - Položka 175 zachycuje početný civilní zástup; rakev v jejím výřezu viditelná není.
  - Všechny položky 156 až 175 mají odlišné Git blob SHA a žádná nemá použitelné embedded datum.
