  question: Zachycují položky 156 až 160 skutečně Ferdinanda Stibora a jeho pohřeb v říjnu 1956, je portrét 156 jeho fotografií
    z téhož roku, byla rakev vystavena v radvanickém Husově sboru, kdy a kde přesně obřad proběhl, kdo stojí u rakve a na
    schodech, šlo o formální čestnou stráž, jaké úřady nebo funkce označují řetězy a medailony a kterým organizacím patří
    zachycené prapory?
  known_facts:
  - Archivní název sedmé podsložky uvádí pohřeb biskupa Ferdinanda Stibora v říjnu 1956; jde o archivní atribuci.
  - Urbanek-ccs-156 je venkovní portrét staršího muže v tmavém obleku; jméno Ferdinand Stibor a rok 1956 pocházejí z názvu
    souboru.
  - Urbanek-ccs-157 a 158 zachycují stejný pohřební interiér s otevřenou rakví, viditelným tělem, složenýma rukama, vysokými
    svícemi a květinami.
  - Název urbanek-ccs-157 lokalizuje interiér do radvanického Husova sboru, ale na fotografii není čitelná jednoznačná místní
    identifikace.
  - Na urbanek-ccs-157 jsou na krajních panelech spolehlivě čitelné fragmenty „Bude“ a „Boží“; prostřední text není bezpečně
    čitelný.
  - Název urbanek-ccs-158 tvrdí, že se u rakve střídala čestná stráž. Fotografie dokládá několik stojících mužů, nikoli sama
    o sobě jejich formální status nebo střídání.
  - Urbanek-ccs-159 zachycuje větší skupinu osob v dlouhých tmavých oděvech před vstupem; nejméně čtyři mají výrazné řetězy
    nebo medailony.
  - Urbanek-ccs-160 zachycuje početné shromáždění s několika prapory nebo korouhvemi před vstupem.
  - Položky 157 a 158 jsou rozdílné záběry stejného interiéru; položky 159 a 160 jsou rozdílné venkovní snímky navazující
    sekvence.
  - Žádný z pěti souborů neobsahuje použitelné embedded datum.
