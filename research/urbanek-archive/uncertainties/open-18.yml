  next_action: Hledat nekrolog, smuteční oznámení, úmrtní a pohřební záznam, program obřadu, církevní kroniky, zápisy rady
    starších, dobový tisk, archiv radvanického Husova sboru a fotografie se jmennými popisky. Porovnat architekturu, plastiky,
    nápisové panely a symbol na závěsu s dokumentací radvanického sboru. Osoby, úřady, čestnou stráž a prapory neurčovat pouze
    podle obličeje, oděvu, postoje nebo insignie.
