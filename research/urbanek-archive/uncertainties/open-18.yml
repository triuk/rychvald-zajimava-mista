  question: Jak nezávisle ověřit osobu, datum, místo, účastníky, organizace, význam oděvních znaků, identitu nesené rakve a přesný sled události
    zachycené na položkách 156 až 170?
  known_facts:
  - Archivní názvy připisují sérii Ferdinandu Stiborovi, říjnu 1956 a radvanickému Husovu sboru; jde o archivní atribuce.
  - Položky 157 a 158 zachycují stejný interiér a pietní uspořádání z různých úhlů.
  - Položky 159 až 163 zachycují stejný nebo velmi podobný vstup a schodiště.
  - Položky 166 a 169 zachycují bohatě zdobenou uzavřenou rakev nesenou několika muži; jde o rozdílné záběry stejné nebo bezprostředně navazující
    situace.
  - Položky 167, 168 a 170 zachycují uliční části průvodu s osobami v dlouhých tmavých oděvech, řetězy, medailony nebo světlými znaky připomínajícími
    kalich.
  - Na položce 161 je světlá páska na paži s tmavým křížovitým znakem; organizace ani funkce nejsou určeny.
  - Položka 160 zachycuje shromáždění s prapory nebo korouhvemi.
  - Všechny položky 156 až 170 mají odlišné Git blob SHA a žádná nemá použitelné embedded datum.
