  question: Jak nezávisle ověřit, zda položky 181 až 185 zachycují ekumenickou bohoslužbu roku 1969 v evangelickém chrámu
    na Ostravici, jaké je přesné datum, místo, program, zúčastněné církve a identity i úřady jednotlivých duchovních?
  known_facts:
  - Všech pět snímků pochází ze stejného nebo velmi podobného interiéru a tvoří bezprostředně navazující bohoslužebnou sekvenci.
  - Položky 181, 182, 183 a 185 zachycují stejný oltář s figurálním obrazem, sochami, svícemi, květinami a textilním čelem.
  - Položka 184 zachycuje muže v duchovním oděvu u vyvýšené dřevěné kazatelny nebo pultu.
  - Položky 182 a 185 zachycují téhož nebo velmi pravděpodobně téhož muže s brýlemi při čtení z otevřené knihy; jde o různé
    záběry.
  - Na oltářní textilii je čitelný biblický odkaz 1 Petr 4,11, ale úplný text je zčásti zakryt a nebyl rekonstruován.
  - Archivní název tvrdí rok 1969, evangelický chrám na Ostravici a ekumenickou událost; jde o archivní atribuci.
  - Všech pět položek má odlišné Git blob SHA a žádná nemá použitelné embedded datum.
