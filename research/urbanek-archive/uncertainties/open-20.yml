  next_action: Hledat původní tiskový nebo elektronický kalendář, tiráž, pracovní soubory, autora či grafika označeného jako
    Marta, objednavatele, vydavatele, bibliografii a zdrojové fotografie. Historická tvrzení porovnat s kronikou, stavebními
    a církevními prameny a již otevřenými nejistotami. Kalendářové popisky nepovažovat samy o sobě za nezávislé potvrzení.
