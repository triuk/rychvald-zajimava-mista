  question: >-
    Kdo vytvořil, sestavil, graficky zpracoval, vydal a vytiskl kalendář 2015, z
    jakých pramenů vychází historický souhrn a popisky, jaké jsou přesné zdroje a
    úpravy vložených fotografií a která historická tvrzení lze potvrdit primárními
    nebo nezávislými prameny?
  known_facts:
  - Položky 186 až 200 tvoří úplnou dochovanou obrazovou sadu kalendáře 2015: titulní stranu, historický souhrn, dvanáct měsíců a závěrečnou stranu.
  - Všech patnáct souborů má rozměr 2385 × 3354 pixelů, barevný režim CMYK a navzájem odlišné Git blob SHA.
  - EXIF Artist a XPAuthor uvádějí u třinácti stran řetězec Marta, u položky 196 Corel Corporation a u položky 199 Pavla; žádná strana nemá použitelné embedded datum.
  - Metadatové řetězce nejsou nezávislým potvrzením úplné identity, autorství, grafické úpravy nebo vydavatelské odpovědnosti.
  - Položka 187 obsahuje souvislý historický přehled s konkrétními daty, jmény, počty a stavebními, okupačními, uměleckými a personálními tvrzeními.
  - Měsíční strany převážně znovu používají podkladové fotografie už evidované v položkách 001, 003, 006–009, 011–018, 023, 030, 032, 036–043, 048, 050, 053, 054, 057, 058 a 060–063.
  - Položky 191, 197 a 198 obsahují jednotlivé vložené fotografie, které nebyly mezi samostatnými položkami bezpečně přiřazeny.
  - Závěrečná položka 200 děkuje Jaromíru Urbánkovi a dalším spolupracovníkům.
  - Na položce 200 je podpis čitelný jako Jana Šilerová a produkční údaj „zpracováno: fa. Grafik Aja“.
  - Podpis a produkční údaj představují částečnou atribuci, nikoli úplnou tiráž nebo jednoznačné rozdělení autorských, edičních, grafických, vydavatelských a tiskových rolí.
  - Kalendářové reprodukce a popisky jsou sekundární kompilací a nepředstavují další nezávislé potvrzení zachycených událostí.
