  question: Kdo vytvořil, sestavil a vydal kalendář 2015, z jakých pramenů vychází jeho historický souhrn a popisky, jaké
    jsou přesné zdroje a úpravy vložených fotografií a která historická tvrzení lze potvrdit primárními nebo nezávislými prameny?
  known_facts:
  - Položky 186 až 190 tvoří titulní stranu, historický souhrn 1920–2015 a měsíční strany leden až březen kalendáře 2015.
  - Všech pět souborů má rozměr 2385 × 3354 pixelů, barevný režim CMYK a odlišné Git blob SHA.
  - EXIF Artist a XPAuthor ve všech pěti souborech obsahují řetězec Marta; použitelné embedded datum chybí.
  - Řetězec Marta je metadatový údaj, nikoli nezávislé potvrzení úplné identity, autorství, grafické úpravy nebo vydavatelské
    odpovědnosti.
  - Položka 187 obsahuje souvislý historický přehled s řadou konkrétních dat, jmen, počtů, stavebních, okupačních, uměleckých
    a personálních tvrzení.
  - Položka 188 vizuálně znovu používá podkladové fotografie položek 001, 003 a 006.
  - Položka 189 vizuálně znovu používá podkladové fotografie položek 007, 008, 009 a 013.
  - Položka 190 vizuálně znovu používá podkladové fotografie položek 037, 038 a 039.
  - Kalendářové reprodukce a popisky jsou sekundární kompilací a nepředstavují další nezávislé potvrzení zachycených událostí.
