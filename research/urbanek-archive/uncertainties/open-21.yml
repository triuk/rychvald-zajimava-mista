  question: Z jakého přesného rukopisného svazku a stran pocházejí tři fotografované stránky a je zachycený oddíl úplný?
  known_facts:
  - Tři obrazy tvoří souvislou textovou posloupnost P1010899.JPG → P1010900.JPG → P1010901.JPG.
  - První fotografovaná stránka začíná nahoře samostatným nadpisem `Náboženský převrat v Rychvaldě.`; před nadpisem na fotografované straně není pokračující text.
  - Druhá stránka přímo pokračuje v neukončené větě první a třetí přímo pokračuje v neukončené větě druhé.
  - Třetí stránka končí úplnou větou o Karlu Vodičkovi a pod posledním řádkem zůstává výrazná prázdná plocha až k dolnímu okraji listu; není vidět pokračování textu.
  - Obrazová struktura proto dovoluje s vysokou jistotou považovat samotný oddíl `Náboženský převrat v Rychvaldě` za zachycený celý od nadpisu po textový konec.
  - EXIF potvrzuje rychlou fotografickou posloupnost 4. 6. 2012 od 11:05:40 do 11:06:36; jde o data digitální reprodukce, nikoli historického zápisu.
  - Thumbs.db obsahuje pouze tři katalogové položky odpovídající 899/900/901 a nedokládá další chybějící soubor ve stejné složce.
  - Samostatné hledání P1010897.JPG, P1010898.JPG a P1010902.JPG v připojeném Google Drive skončilo bez shody; obecnější hledání P10109 vrátilo pouze dostupnou část této série.
  - Obecní Pamětní kniha 1922–1935 popisuje Ferdinanda Niemce, Jana Rainocha, předání kostela/fary 1. 5. 1920 a Karla Vodičku, ale její znění a členění nejsou diplomaticky totožné s fotografovaným oddílem.
  - Přesný nadpis `Náboženský převrat v Rychvaldě` nebyl v dostupné textové vrstvě obecní Pamětní knihy 1922–1935 nalezen; tematická shoda proto sama neidentifikuje fotografované stránky jako tuto obecní kroniku.
  - Obecní Pamětní kniha uvádí, že Antonín Škramlík čerpal ze školních kronik a vlastních dokumentů, a v jeho životopisném oddílu odkazuje při školských sporech na `paměti správy školy`.
  - Tatáž obecní kronika dokládá Antonína Škramlíka jako předsedu Národního a plebiscitního výboru v Rychvaldě po roce 1918.
  - Fotografovaný rukopis používá první osobu množného čísla z perspektivy českých účastníků národních/plebiscitních událostí a podrobně se věnuje škole a výuce náboženství.
  - Paměti nebo kronika správy české školy spojené s Antonínem Škramlíkem jsou proto podloženým kandidátem na zdrojovou třídu rukopisu, nikoli doloženým přesným svazkem ani autorstvím.
