  question: Jaký je přesný vztah souborů v této složce ke knize Rychvald včera a dnes a kdo je autorem leteckých fotografií?
  known_facts:
  - Složka je archivně pojmenována Fotografie knihy Rychvald včera a dnes.
  - Prvních dvacet pět zpracovaných souborů tvoří samostatné letecké fotografie bez viditelných okrajů knižních stran
    a bez čitelného bibliografického textu.
  - Soubor 0 titulní stránka.jpg obsahuje letecké panorama bez viditelného titulního nápisu.
  - Všechny dosud zpracované snímky mají EXIF Make SONY a Model DSC-WX7.
  - EXIF data dosud zpracovaných snímků sahají od 24. března 2012 do 28. září 2013.
  - Soubory 0–3, 5.jpg, 10.jpg, 11.jpg, 13.jpg, 18.jpg a 20.jpg uvádějí software Picasa; 15.jpg a 17.jpg uvádějí PMB.
  - Dvacet pět souborů má odlišné binární hashe; mezi dávkami 01 až 05 nebyla zjištěna přesná duplicita.
  - Snímky 5.jpg a 6.jpg se prostorově překrývají a jejich EXIF časy se liší o deset sekund.
  - Snímky 12.jpg a 13.jpg se prostorově překrývají a jejich EXIF časy se liší o pět sekund.
  - Snímky 17.jpg a 15.jpg mají EXIF časy vzdálené 37 sekund a oba tag PMB, ale jednoznačný prostorový překryv nebyl
    zjištěn.
  - Soubory 22.jpg a 23.jpg mají EXIF časy vzdálené tři minuty, ale jednoznačný prostorový překryv nebyl zjištěn.
  - Soubory 21.jpg až 23.jpg mají shodné datum EXIF 30. srpna 2013; samotné datum neprokazuje shodné místo ani bezprostřední
    sekvenci.
  - Soubor 19.jpg vizuálně zachycuje denní světlo, přestože EXIF DateTime uvádí 23:39:36; časové metadata proto nejsou
    spolehlivým dokladem okamžiku expozice.
  - Časová a obrazová návaznost podporuje pouze pracovní seskupení některých snímků, nikoli identitu autora nebo místa.
