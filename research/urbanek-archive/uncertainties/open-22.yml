  question: Jaký je přesný vztah souborů v této složce ke knize Rychvald včera a dnes a kdo je autorem leteckých fotografií?
  known_facts:
  - Složka je archivně pojmenována Fotografie knihy Rychvald včera a dnes.
  - Všech 54 obrazových souborů tvoří samostatné letecké fotografie bez viditelných okrajů knižních stran a bez čitelného
    bibliografického textu.
  - Soubor 0 titulní stránka.jpg obsahuje letecké panorama bez viditelného titulního nápisu.
  - Všechny zpracované snímky mají EXIF Make SONY a Model DSC-WX7.
  - EXIF data zpracovaných snímků sahají od 24. března 2012 do 5. října 2013.
  - Soubory 0–3, 5.jpg, 10.jpg, 11.jpg, 13.jpg, 18.jpg, 20.jpg, 28.jpg, 38.jpg, 39.jpg, 40.jpg, 42.jpg a 52.jpg uvádějí software
    Picasa; 15.jpg, 17.jpg a 36.jpg uvádějí PMB.
  - Všech 54 JPEGů má odlišné binární hashe; mezi dávkami 01 až 11 nebyla zjištěna přesná duplicita.
  - Snímky 5.jpg a 6.jpg se prostorově překrývají a jejich EXIF časy se liší o deset sekund.
  - Snímky 12.jpg a 13.jpg se prostorově překrývají a jejich EXIF časy se liší o pět sekund.
  - Snímky 17.jpg a 15.jpg mají EXIF časy vzdálené 37 sekund a oba tag PMB, ale jednoznačný prostorový překryv nebyl zjištěn.
  - Soubory 22.jpg a 23.jpg mají EXIF časy vzdálené tři minuty, ale jednoznačný prostorový překryv nebyl zjištěn.
  - Soubory 21.jpg až 23.jpg mají shodné datum EXIF 30. srpna 2013; samotné datum neprokazuje shodné místo ani bezprostřední
    sekvenci.
  - Soubory 26.jpg, 28.jpg, 29.jpg a 31.jpg mají EXIF časy v rozsahu tří minut a pěti sekund; jednoznačný prostorový překryv
    nebyl zjištěn.
  - Soubory 25.jpg a 27.jpg mají shodné datum EXIF a časy vzdálené sedm minut a 50 sekund; samotné časy neprokazují bezprostřední
    sekvenci.
  - Soubor 37.jpg sdílí datum EXIF se snímky 26.jpg, 28.jpg, 29.jpg, 31.jpg a 34.jpg; širší časový rozsah neprokazuje shodnou
    lokalitu ani bezprostřední sekvenci.
  - Soubory 38.jpg a 39.jpg mají shodné datum EXIF a časy vzdálené 20 minut a 31 sekund; podobný krajinný charakter může odpovídat
    jedné letové relaci, ale jednoznačný prostorový překryv nebyl zjištěn.
  - Soubory 40.jpg a 42.jpg mají shodné datum EXIF, oba uvádějí software Picasa a jejich časy se liší o devět sekund. To podporuje
    zařazení do jedné fotografické sekvence, ale jednoznačný prostorový překryv nebyl zjištěn.
  - Soubory 41.jpg a 33.jpg mají shodné datum EXIF a časy vzdálené dvě minuty a 27 sekund; snímky zachycují odlišné areály
    a samotná časová blízkost neprokazuje shodnou lokaci.
  - Soubory 43.jpg a 44.jpg se prostorově překrývají v oblasti sídelního centra, komunikací, kostelních staveb a vodních ploch;
    jejich EXIF časy se liší o šest minut a 52 sekund a oba mají odlišné binární hashe.
  - Soubory 19.jpg, 30.jpg, 35.jpg, 43.jpg, 44.jpg, 47.jpg, 48.jpg a 52.jpg vizuálně zachycují denní světlo, přestože EXIF
    DateTime uvádí pozdně večerní nebo půlnoční hodinové hodnoty; tyto hodinové údaje proto nejsou spolehlivým dokladem okamžiku
    expozice.
  - Soubor 33.jpg obsahuje čitelný nápis RC TEAM RYCHVALD. Text podporuje vztah obrazového obsahu k Rychvaldu, ale neprokazuje
    přesnou lokaci, použití v knize, organizátora události ani autora fotografie.
  - Soubor 41.jpg obsahuje čitelný nápis Hruška na obchodní budově. Text sám neprokazuje přesnou pobočku, lokaci, název akce,
    použití v knize ani autora fotografie.
  - Soubory 46.jpg a 41.jpg mají EXIF časy vzdálené šest minut a 52 sekund, ale jednoznačný prostorový překryv nebyl zjištěn.
  - Soubory 49.jpg a 20.jpg mají EXIF časy vzdálené 44 sekund; do stejného širšího časového bloku patří také 40.jpg a 42.jpg,
    avšak přesný prostorový vztah nebyl potvrzen.
  - Soubory 50.jpg a 32.jpg mají EXIF časy vzdálené 23 sekund a sdílejí stejné sklizené pole s balíky; prostorový překryv
    a jedna fotografická sekvence jsou potvrzeny.
  - Soubor 53.jpg se prostorově překrývá se snímky 43.jpg a 44.jpg v oblasti sídelního centra, kostelní věže a soustavy vodních
    ploch; soubory mají odlišná data EXIF, roční období, kompozice a binární hashe.
  - Soubory 52.jpg a 30.jpg mají stejné datum EXIF a časy vzdálené 11 minut a 20 sekund; oba zachycují denní světlo navzdory
    pozdně večerním hodinám a prostorový překryv nebyl zjištěn.
  - Časová a obrazová návaznost podporuje pouze pracovní seskupení některých snímků, nikoli identitu autora nebo úplné mapování
    míst.
