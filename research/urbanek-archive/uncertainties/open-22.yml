  question: Jaký je přesný vztah souborů v této složce ke knize Rychvald včera a dnes a kdo je autorem leteckých fotografií?
  known_facts:
  - Složka je archivně pojmenována Fotografie knihy Rychvald včera a dnes.
  - Prvních deset zpracovaných souborů tvoří samostatné letecké fotografie bez viditelných okrajů knižních stran a bez čitelného
    bibliografického textu.
  - Soubor 0 titulní stránka.jpg obsahuje letecké panorama bez viditelného titulního nápisu.
  - Všechny dosud zpracované snímky mají EXIF Make SONY a Model DSC-WX7.
  - EXIF data dosud zpracovaných snímků sahají od 24. března 2012 do 28. září 2013.
  - Soubory 0–3 a 5.jpg uvádějí software Picasa; ostatní dosud zpracované soubory tento tag nemají.
  - Deset souborů má odlišné binární hashe; mezi dávkami 01 a 02 nebyla zjištěna přesná duplicita.
  - Snímky 5.jpg a 6.jpg se prostorově překrývají a jejich EXIF časy se liší o deset sekund, což podporuje jejich zařazení
    do jedné fotografické sekvence, nikoli však identitu autora nebo místa.
