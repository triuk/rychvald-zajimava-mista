  collection: Volné soubory přímo v kořeni archivu
  type: historical_group_event_unit_date_and_provenance
  source_items:
  - urbanek-root-loose-004
  question: Jaká událost, jednotka a přesné datum jsou zachyceny u tabule „MĚSTO RYCHVALD“ a jaká je provenience fotografie?
  known_facts:
  - Nová přímá vizuální kontrola zdrojového PNG potvrzuje čtyři viditelné ozbrojené muže v přilbách a uniformách; starší evidence `pět` byla chybným přepočtem a je tímto opravena.
  - Na tabuli je čitelný nápis `MĚSTO RYCHVALD`.
  - Archivní název obsahuje `9 X 1938 przed zajęciem Rychvaldu`, ale filename je pouze archivní atribuce a není nezávislým důkazem přesného data, události ani institucionální příslušnosti osob.
  - Samotný vzhled uniformy, přilby nebo výzbroje se nepoužívá jako dostatečný důkaz jednotky, národnosti, hodnosti ani totožnosti.
  partially_resolved_attributes:
    visible_person_count:
      value: 4
      status: directly_observed_in_source_image_recheck_2026_08_12
    visible_place_sign:
      value: MĚSTO RYCHVALD
      status: directly_readable_in_source_image
