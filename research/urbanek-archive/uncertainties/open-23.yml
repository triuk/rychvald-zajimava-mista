- id: URB-U-0077
  status: open
  priority: medium
  collection: Volné soubory přímo v kořeni archivu
  type: photograph_location_date_and_provenance
  source_items:
  - urbanek-root-loose-001
  question: Jaká stanice a lokalita je na reprodukci označené „Nádraží“, z jaké doby pochází a kdo je autorem či vydavatelem předlohy?
  known_facts:
  - V obraze je čitelný tištěný popisek `Nádraží`.
  - Snímek zachycuje nízké budovy, komunikaci, vodní příkop či tok, sloupy a osoby.
  - EXIF datum 2016 je metadata digitálního souboru, nikoli historická datace scény.
  - V připojeném Google Drive byl nalezen zdrojový LyX dokument Jaromíra Urbánka `Rychvald včera a dnes ve fotografii`, datovaný v textu `V Rychvaldu, květen 2012`.
  - LyX dokument v kapitole `Železniční nádraží` odkazuje na obraz `14. část průmysl a železniční zastávky/363.jpg` s explicitním popiskem `„Nádraží“ u železničního přejezdu u rybníku Skučák známé pod názvem „Ozvajch“ (z německého Ausweiche – výhybna). Nejstarší dochovaný obrázek asi z počátku 20. století.`
  - Přímé SIFT/RANSAC porovnání kořenového `19.jpg` s knižním `363.jpg` dalo 3142 kvalitních shod a přibližně 3140 geometricky konzistentních inlierů; po zarovnání je transformace prakticky jen posun asi +3 px / −7 px a korelace překryvu je 0,9981.
  - Kořenový `19.jpg` a knižní `363.jpg` jsou tedy dvě digitální reprezentace téhož podkladového historického obrazu, nikoli jen podobná scéna.
  - Srovnávací knižní obrazy 365, 366 a 367 jsou v LyXu explicitně označeny jako `Rychvald místo` nebo `Rychvald zámek` a s kořenovým `19.jpg` se geometricky neshodují.
  - Starší obecní Pamětní kniha nezávisle rozlišuje Rychvald-zámek, Rychvald-místo a Rychvald-zastávka zvanou `Vyhýbka`, kterou uvádí jako zrušenou roku 1916.
  - Urbánkův knižní text rozlišuje stejné tři body a lokalitu u Skučáku označuje jako `Ozvajch` z německého `Ausweiche`.
  - Nejlepší explicitní datace samotného historického snímku je Urbánkův popisek `asi z počátku 20. století`; rok zrušení výhybky sám o sobě není přesným datem fotografie.
  - Urbánek v úvodu knihy uvádí, že použité historické fotografie získával z více archivů, kronik a od občanů a že u mnoha již není možné určit autora; `363.jpg` nemá individuální kredit.
  - Historický železniční snímek na straně 29 publikace `Rychvald 1305–2005` není totožný s kořenovým `19.jpg`.
  - Stejnojmenný `19.jpg` ve složce `Fotografie knihy Rychvald včera a dnes` je moderní barevný letecký snímek a s kořenovým souborem nesouvisí.
