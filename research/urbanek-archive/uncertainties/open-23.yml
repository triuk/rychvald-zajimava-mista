- id: URB-U-0079
  status: open
  priority: high
  collection: Volné soubory přímo v kořeni archivu
  type: official_document_archival_context_and_completeness
  source_items:
  - urbanek-root-loose-005
  question: Jaký je archivní fond, spisová značka, účel, návaznost a úplnost tajného seznamu Okresního velitelství SNB ve
    Fryštátě z 10. července 1945?
  known_facts:
  - Dokument nese záhlaví Okresního velitelství SNB ve Fryštátě.
  - Je datován 10. července 1945 a označen „Tajné!“.
  - Nadpis jej popisuje jako seznam dosud zjištěných polských bojůvkářů bydlících v okrese.
  - Dochovaná fotografie zachycuje jednu stránku s očíslovanou tabulkou.
  unknown:
  - archive_fond_and_file_reference
  - issuing_context_and_distribution
  - whether_list_has_additional_pages_or_annexes
  - subsequent_use_and_verification_status
  evidence:
  - research/urbanek-archive/collections/root-loose-files-batch-01.yml
  - sources/index.d/urbanek-root-loose-files-01.yml
- id: URB-U-0080
  status: open
  priority: medium
  collection: Volné soubory přímo v kořeni archivu
  type: uniformed_person_identity_service_date_place_and_provenance
  source_items:
  - urbanek-root-loose-006
  question: Kdo je na portrétu, k jakému služebnímu sboru a instituci patřil, kdy a kde snímek vznikl a jaká je jeho provenience
    a vazba k Rychvaldu?
  known_facts:
  - Obraz zachycuje jednoho muže v uniformě, čepici se štítkem, zapnuté blůze, opasku a vysokých botách.
  - U pravého boku je tmavé pouzdro nebo brašna.
  - Soubor neobsahuje EXIF metadata.
  - Archivní název obsahuje označení „německý četník“, ale název není nezávislým důkazem národnosti, služby ani totožnosti.
  unknown:
  - identity_of_person
  - nationality_and_exact_service
  - rank_and_institutional_affiliation
  - original_capture_date_and_place
  - photographer_and_source_provenance
  - relationship_to_rychvald
  evidence:
