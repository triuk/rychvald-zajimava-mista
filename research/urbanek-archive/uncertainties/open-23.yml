- id: URB-U-0078
  status: open
  priority: high
  collection: Volné soubory přímo v kořeni archivu
  type: historical_group_event_unit_date_and_provenance
  source_items:
  - urbanek-root-loose-004
  question: Jaká událost, jednotka a přesné datum jsou zachyceny u tabule „MĚSTO RYCHVALD“ a jaká je provenience fotografie?
  known_facts:
  - Na fotografii je pět ozbrojených mužů v přilbách a uniformách.
  - Na tabuli je čitelný nápis „MĚSTO RYCHVALD“.
  - Archivní název obsahuje „9 X 1938 przed zajęciem Rychvaldu“, ale název není nezávislým důkazem data ani interpretace.
