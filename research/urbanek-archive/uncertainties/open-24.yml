  question: Jaká je provenience fotografovaných novinových předloh, které stránky a vydání jsou v kolekci zastoupeny, je pořadí
    snímků úplné a jaká práva a okolnosti digitalizace se k souborům vztahují?
  known_facts:
  - Aktuální Git a Drive snapshot kolekce obsahuje 33 souborů JPEG a technické soubory Thumbs.db a ZbThumbnail.info.
  - P1020273.JPG zachycuje ručně popsanou cedulku s texty „Poláci“, „České slovo“ a „1938“.
  - P1020275.JPG přímo zobrazuje titul České slovo, datum sobota 1. října 1938, ročník X a číslo 271.
  - P1020274.JPG a P1020276.JPG zachycují stejnou část novinové strany v odlišných výřezech a nejsou binárně totožné.
  - P1020277.JPG a P1020278.JPG zachycují stejnou část novinové strany v širším a těsnějším výřezu a nejsou binárně totožné.
  - P1020286.JPG až P1020288.JPG jsou tři překrývající se fotografie téže novinové strany; P1020287.JPG a P1020288.JPG mají
    téměř stejný výřez, ale nejsou binárně totožné.
  - P1020289.JPG a P1020290.JPG pokračují v překrývajících se detailech strany fotografované v P1020286.JPG až P1020288.JPG;
    všechny soubory jsou binárně odlišné.
  - P1020291.JPG opakuje článek „Zůstanou na Těšínsku české školy?“, ale má jiné sousední texty; bez dalšího se neurčuje jako
    stejná fyzická strana nebo stejné vydání.
  - P1020292.JPG přímo ukazuje označení „ČESKÉ SLOVO“ a „Strana 2.“, avšak datum, ročník a číslo vydání nejsou ve snímku viditelné.
  - V těle článku na P1020292.JPG je mezi jmenovanými obcemi přímo čitelné jméno Rychvald; jde o textový výskyt v prameni,
    nikoli o nezávislé ověření události.
  - P1020292.JPG a P1020293.JPG jsou dvě odlišné téměř celostránkové fotografie s různými hlavními titulky a rozvržením.
  - Položky 016–020 mají EXIF DateTime z 15. února 2013 mezi 15:54:52 a 15:57:48 a fotoaparát Panasonic DMC-TZ3; metadata
    jsou vedena jako údaje o reprodukčním fotografování, nikoli o vydání novin.
  - Na položkách 006–018 a 020 není úplný masthead; položka 019 ukazuje titul a číslo strany, nikoli datum, ročník nebo číslo
    vydání. Viditelné datace 3., 4. a 6. října patří jednotlivým zprávám a samy neurčují číslo vydání.
  - Ve filename posloupnosti aktuálního snapshotu není P1020282.JPG; samotná mezera ani časový odstup před P1020283.JPG neprokazují
    existenci chybějícího originálu.
  - P1020294.JPG je těsnější, ale binárně odlišný záběr stejné novinové strany jako P1020293.JPG.
  - P1020295.JPG ukazuje částečné označení „ČESKÉ SLOVO“ a dataci zprávy Mor. Ostrava 10. října, ale nikoli úplné údaje vydání.
  - P1020296.JPG obsahuje samostatný mezititulek „Jak se rozloučil Rychvald“; jde o textový výskyt v prameni.
  - Položky 021–025 mají EXIF DateTime z 15. února 2013 mezi 15:58:01 a 16:01:54 a fotoaparát Panasonic DMC-TZ3; P1020295.JPG
    je portrétně orientována.
  - Na položkách 021–025 není úplné datum, ročník a číslo vydání; datace 10. a 14. října patří jednotlivým zprávám.
  - P1020299.JPG je výrazně rozostřený; bezpečně čitelný je pouze hlavní titulek „Němci lepší než Poláci“.
  - P1020300.JPG a P1020301.JPG zachycují stejnou novinovou stranu v širším a těsnějším výřezu a nejsou binárně totožné.
  - P1020302.JPG a P1020303.JPG obsahují rubrikový nadpis „Zprávy z Těšínska“, ale bez dalšího se neurčují jako stejná fyzická strana nebo stejné vydání.
  - P1020302.JPG přímo zmiňuje Orlovou, Petřvald, Karvinsko a Suchou; P1020303.JPG přímo zmiňuje nádraží v Orlové.
  - Položky 026–030 mají EXIF DateTime z 15. února 2013 mezi 16:05:07 a 16:08:37 a fotoaparát Panasonic DMC-TZ3; položky 029–030 jsou portrétně orientovány.
  - Na položkách 026–030 není úplné datum, ročník a číslo vydání; datace Praha 24. října patří jednotlivé zprávě.
