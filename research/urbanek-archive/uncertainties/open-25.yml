  question: Jaká je přesná provenience, autorství a lokalizace fotografií v kolekci `Rychvald`, co znamená jméno `Cudlín`
    v názvech souborů a jaký byl původní účel či publikační kontext této sady?
  known_facts:
  - Aktuální Git a Drive snapshot kolekce obsahuje 31 obrazových souborů a technické soubory Thumbs.db a ZbThumbnail.info.
  - Budova úřadu 003.jpg a Budova úřadu 005.jpg přímo zobrazují nápis „MĚSTSKÝ ÚŘAD“, ale obraz neobsahuje čitelný název obce.
  - Cudlín 033.jpg, Cudlín 035.jpg a Cudlín 037.jpg jsou tři časově navazující pohledy na tutéž upravenou veřejnou plochu.
  - Všech pět souborů uvádí fotoaparát Panasonic DMC-FZ7; první dvojice má EXIF z 2. září 2008 a druhá trojice z 28. srpna
    2009.
  - Git snapshot ukazuje, že Budova úřadu 005.jpg a pozdější soubor Kopie - Budova úřadu 005.jpg mají totožný Git blob SHA.
  - Název adresáře a názvy souborů jsou archivní metadata a samy neprokazují přesnou lokalitu ani fotografa.
