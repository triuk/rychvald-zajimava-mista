  question: Jaká je přesná provenience, autorství a lokalizace fotografií v kolekci `Rychvald`, co znamená jméno `Cudlín` v názvech souborů, jaký byl původní účel či publikační kontext sady a které události, objekty, datace a významy popisků zachycují historické reprodukce?
  known_facts:
  - Aktuální Git a Drive snapshot kolekce obsahuje 31 obrazových souborů a technické soubory Thumbs.db a ZbThumbnail.info.
  - '`Budova úřadu 003.jpg` a `Budova úřadu 005.jpg` přímo zobrazují nápis „MĚSTSKÝ ÚŘAD“, ale obraz neobsahuje čitelný název obce.'
  - '`Cudlín 033.jpg`, `Cudlín 035.jpg` a `Cudlín 037.jpg` jsou tři časově navazující pohledy na tutéž upravenou veřejnou plochu.'
  - '`Cudlín 041.jpg` zachycuje interiér sakrální stavby; přesná stavba ani příležitost nejsou přímo označeny.'
  - '`Kopie - Budova úřadu 005.jpg` je podle SHA-256 i Git blob SHA přesná binární kopie položky 002.'
  - '`P1010066.JPG` až `P1010068.JPG` jsou moderní reprodukční fotografie starších fotografií či pohlednic, pořízené Panasonicem DMC-TZ3 dne 28. února 2010.'
  - '`P1010068.JPG` přímo zobrazuje rok „1909“ a popisek „ŠKOLY U.M.Š. V RYCHVALDĚ.“; význam zkratky, úplná datace ani identita obou budov nejsou ověřeny.'
  - '`P1010069.JPG` je moderní reprodukční fotografie historické vícepohledové pohlednice s výrazným textem „Pozdrowienie z Rychwaldu“.'
  - '`P1010070.JPG` je moderní reprodukce starší černobílé fotografie či pohlednice sakrální stavby s věží a viditelným nápisem „PRAVDA VÍTĚZÍ“.'
  - '`P1010071.JPG` a `P1010072.JPG` jsou fotografované dokumentární stránky s ručně kreslenými místopisnými plány, číslem „- 14 -“ a nadpisy „Místopis kolem a po r. 1900.“ a „Místopis před r. 1900.“.'
  - '`P1010114.JPG` až `P1010117.JPG` jsou fotografované rukopisné místněhistorické stránky; úplný přepis, autorství, provenience a historická přesnost nejsou ověřeny.'
  - '`Rychvald2009 003.jpg` a `Rychvald2009 004.jpg` jsou dva odlišné snímky téhož kamenného hřbitovního kříže s figurální výzdobou pořízené s odstupem 13 sekund.'
  - '`Rychvald2009 005.jpg`, `Rychvald2009 008.jpg`, `Zp0707 090.jpg`, `Zp1109 005.jpg` a `Zp1109 082.jpg` zachycují moderní stavby či areály, jejichž přesná identita nebo funkce není z obrazu samotného doložena.'
  - '`Zp1109 340.jpg` zachycuje jednokolejnou železniční trať, cihlovou budovu těsně u koleje a železniční vozidlo v dálce.'
  - '`Zp1109 379.jpg` přímo zobrazuje informační označení „PŘÍRODNÍ REZERVACE“ a „Přírodní rezervace Skučák“.'
  - '`Zp1109 382.jpg` a `Zp1109 390.jpg` jsou dva odlišné záběry stejného zařízení u vodní plochy; funkce zařízení není domýšlena.'
  - '`zzz-satiny 255.jpg` je širší hřbitovní pohled, na němž je podle shodných výrazných tvarových detailů tentýž kamenný kříž jako na položkách 019 a 020.'
  - '`zzz-satiny 258.jpg` je další barevný hřbitovní pohled pořízený Panasonicem DMC-FZ7 dne 2. listopadu 2009 v 14:17:12; časově a tematicky navazuje na položku 030. Nápisy na náhrobcích nejsou používány k identifikaci osob.'
  - Název adresáře a názvy souborů jsou archivní metadata a samy neprokazují přesnou lokalitu, fotografa, událost ani historické datum.
