  question: Jaká je přesná lokalizace, datace a identita staveb, krajinářských objektů a dalších motivů v kořenové části kolekce
    `fotodokument`, jaké jsou jejich funkce tam, kde nejsou přímo doloženy čitelným nápisem, kdo jsou osoby na skupinových
    a dalších snímcích, kdo fotografie pořídil nebo digitalizoval, jaká je provenience výběru a jaká práva se k souborům vztahují?
  known_facts:
  - Kořenová část `fotodokument` mimo podsložku `den po dešti` obsahuje v aktuálním Git snapshotu 41 JPEGů a technické soubory
    Thumbs.db a ZbThumbnail.info.
  - První čtyři dávky zahrnují položky urbanek-fotodokument-root-001 až -020; všech dvacet zpracovaných raw souborů z kanonické
    Drive složky bylo ověřeno proti velikostem a Git blobům v repozitáři.
  - Mezi pěti soubory dávky 04 není přesná binární duplicita a žádný z nich neobsahuje použitelná EXIF metadata.
  - img053.jpg zobrazuje výrazný vzrostlý strom na travnaté ploše; druh stromu, lokalita, účel dokumentace a datace nejsou
    určeny.
  - img054.jpg zobrazuje mohutný bezlistý strom u nezpevněné cesty v krajině; druh stromu, lokalita, účel dokumentace a datace
    nejsou určeny.
  - img057.jpg zobrazuje věž se štíhlou střechou a kruhovým ciferníkem či obdobným prvkem; architektura je popsatelná jako
    sakrální, ale přesný objekt, denominace, lokalita a datum nejsou určeny.
  - img058.jpg je vyvýšený pohled přes zástavbu se dvěma výraznými věžemi. Vztah vzdálené špičaté věže k věži na img057.jpg
    není bez dalšího pramene potvrzen.
  - img059.jpg zobrazuje skupinu několika budov přes otevřené pole; funkce, lokalita, vlastnictví a datace nejsou určeny.
  - img047.jpg nese bezpečně čitelné dvojjazyčné nápisy „OVOCE-ZELENINA / OWOCE-JARZYNY“ a „MLÉKÁRNA / MLECZARNIA“, české
    „POTRAVINY-LAHŮDKY“ a číslo 70.
  - img050.jpg nese bezpečně čitelný nápis „KULTURNÍ DŮM“ a na jednom fasádním emblému písmena „ROH“.
  - img044.jpg zobrazuje skupinu dospělých osob před budovou a banner s bezpečně čitelným textem „VÝSTAVA 60 let školy V RYCHVALDĚ
    NA PODLESÍ“.
  - Název složky a posloupnost imgNNN jsou archivní metadata a samy neprokazují lokalitu, autora ani historickou dataci.
