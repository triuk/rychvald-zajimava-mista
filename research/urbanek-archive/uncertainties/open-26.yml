  question: Jaká je přesná lokalizace, datace a identita staveb, krajinářských objektů, veřejných událostí a dalších motivů
    v kořenové části kolekce `fotodokument`, jaké jsou jejich funkce tam, kde nejsou přímo doloženy čitelným nápisem, jaký
    je kontext průvodů a shromáždění, kdo jsou osoby na skupinových a dalších snímcích, kdo fotografie pořídil nebo digitalizoval,
    jaká je provenience výběru a jaká práva se k souborům vztahují?
  known_facts:
  - Kořenová část `fotodokument` mimo podsložku `den po dešti` obsahuje v aktuálním Git snapshotu 41 JPEGů a technické soubory
    Thumbs.db a ZbThumbnail.info.
  - Prvních šest dávek zahrnuje položky urbanek-fotodokument-root-001 až -030; všech 30 zpracovaných raw souborů z kanonické
    Drive složky bylo ověřeno proti velikostem a Git blobům v repozitáři.
  - Mezi pěti soubory dávky 06 není přesná binární duplicita a žádný z nich neobsahuje použitelná EXIF metadata.
  - img065.jpg nese bezpečně čitelný nápis „SBĚRNA“; nápis dokládá dobové označení funkce, nikoli přesnou instituci, předmět
    sběru, provozovatele, lokalitu nebo datum.
  - img066.jpg zobrazuje větší starší zděnou budovu s řadou vysokých oken a schodišti ke vstupům; funkce, vlastnictví, lokalita
    a datace nejsou určeny.
  - img067.jpg zachycuje průvod či organizovaný veřejný pochod s větším množstvím osob a několika velkými vlajkami nebo prapory;
    událost, organizace, osoby, trasa a datum nejsou určeny.
  - img068.jpg zachycuje početné veřejné shromáždění podél ulice. Na nejméně dvou vlajkách jsou zřetelně viditelné symboly
    srpu a kladiva. Symbolika sama není používána k určení organizátora nebo příslušnosti účastníků.
  - Na směrové tabuli na img068.jpg je čitelné číslo 5 a pouze začátek názvu „OSTR…“; celý místní název není bezpečně rekonstruován.
  - img070.jpg je skupinový snímek na jevišti; část osob má divadelní či historizující kostýmy a jsou viditelné hudební nástroje.
    Inscenace nebo událost, soubor, místo, datum a identity osob nejsou určeny.
  - img060.jpg až img064.jpg zachycují stavby a krajinné pohledy; přesné lokality, funkce a datace nebyly z vizuálního vzhledu
    dovozovány.
  - Název složky a posloupnost imgNNN jsou archivní metadata a samy neprokazují lokalitu, autora ani historickou dataci.
