  question: Jaká je přesná lokalizace, datace a identita staveb, krajinářských objektů a dalších motivů v kořenové části kolekce
    `fotodokument`, jaké jsou jejich funkce tam, kde nejsou přímo doloženy čitelným nápisem, kdo jsou osoby na skupinových
    a dalších snímcích, kdo fotografie pořídil nebo digitalizoval, jaká je provenience výběru a jaká práva se k souborům vztahují?
  known_facts:
  - Kořenová část `fotodokument` mimo podsložku `den po dešti` obsahuje v aktuálním Git snapshotu 41 JPEGů a technické soubory
    Thumbs.db a ZbThumbnail.info.
  - Prvních pět dávek zahrnuje položky urbanek-fotodokument-root-001 až -025; všech 25 zpracovaných raw souborů z kanonické
    Drive složky bylo ověřeno proti velikostem a Git blobům v repozitáři.
  - Mezi pěti soubory dávky 05 není přesná binární duplicita a žádný z nich neobsahuje použitelná EXIF metadata.
  - img060.jpg zobrazuje starší dům a menší dřevěné stavby přes travnatý svah; přesná lokalita, funkce, vlastnictví a datace
    nejsou určeny.
  - img061.jpg zobrazuje nízkou podlouhlou utilitárně působící stavbu s komíny a vícetabulkovým oknem; přesná funkce, provozovatel,
    lokalita a datace nejsou určeny.
  - img062.jpg zobrazuje podlouhlou přízemní budovu s taškovou střechou a středovým vikýřovým či štítovým prvkem; identita,
    funkce a lokalita nejsou určeny.
  - img063.jpg je široký krajinný pohled na pole, louky a zástavbu; výrazná lineární trasa se sloupy není bez dalšího podkladu
    přiřazena konkrétnímu druhu infrastruktury.
  - img064.jpg zobrazuje zvlněnou zemědělskou krajinu s rozptýlenými domy, zahradami či sady a zakřivenou cestou; přesná lokalita
    a datace nejsou určeny.
  - Název složky a posloupnost imgNNN jsou archivní metadata a samy neprokazují lokalitu, autora ani historickou dataci.
