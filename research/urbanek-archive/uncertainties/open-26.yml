  question: Jaká je přesná lokalizace, datace a identita staveb, krajinářských objektů, veřejných událostí, organizací a dalších motivů v kořenové části kolekce `fotodokument`, jaké jsou jejich funkce tam, kde nejsou přímo doloženy čitelným nápisem, jaký je kontext průvodů, shromáždění a skupinových snímků, kdo jsou osoby na fotografiích, kdo fotografie pořídil nebo digitalizoval, jaká je provenience výběru a jaká práva se k souborům vztahují?
  known_facts:
  - Kořenová část `fotodokument` mimo podsložku `den po dešti` obsahuje v aktuálním Git snapshotu 41 JPEGů a technické soubory Thumbs.db a ZbThumbnail.info.
  - Prvních sedm dávek zahrnuje položky urbanek-fotodokument-root-001 až -035; všech 35 zpracovaných raw souborů z kanonické Drive složky bylo ověřeno proti velikostem a Git blobům v repozitáři.
  - Mezi pěti soubory dávky 07 není přesná binární duplicita a žádný z nich neobsahuje použitelná EXIF metadata.
  - img176.jpg zobrazuje starší dům se strmou sedlovou střechou a kombinací omítaných a dřevěných částí; přesná identita, lokalita, funkce a datace nejsou určeny.
  - img178.jpg je skupinový snímek s praporem nesoucím bezpečně čitelné texty „STRANA NÁR. SOCIALISTICKÁ“ a „RYCHVALD“; na tabulce před skupinou je zřetelně čitelný rok „1929“.
  - Viditelný rok 1929 na img178.jpg je evidován jako údaj pramene; bez dalšího podkladu není automaticky považován za technicky ověřené datum expozice fotografie.
  - img196.jpg zobrazuje starší dům s poškozenou či chybějící omítkou na štítu, dřevěným plotem a několika osobami; budova, osoby, lokalita a datum nejsou určeny.
  - img197.jpg zobrazuje skupinu před budovou s bezpečně čitelným nápisem „NÁRODNÍ ŠKOLA“, který dokládá dobové školní označení budovy; přesná škola a lokalita nejsou určeny.
  - img200.jpg zobrazuje skupinu před budovou na zasněženém prostranství; z oříznutého německého nápisu je bezpečně čitelné slovo „Gastwirtschaft“. Předcházející část názvu není rekonstruována.
  - Uniformní oděv jedné osoby na img200.jpg není používán k určení konkrétní složky, hodnosti nebo organizační příslušnosti.
  - V dřívějších dávkách byly přímo doloženy mimo jiné texty „SBĚRNA“, „KULTURNÍ DŮM“, dvojjazyčné obchodní nápisy a banner „VÝSTAVA 60 let školy V RYCHVALDĚ NA PODLESÍ“; přesné kontexty zůstávají tam, kde nejsou pramenem doloženy, otevřené.
  - Název složky a posloupnost imgNNN jsou archivní metadata a samy neprokazují lokalitu, autora ani historickou dataci.
