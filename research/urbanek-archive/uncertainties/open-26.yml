  question: Jaká je přesná lokalizace, datace a identita staveb, krajinářských objektů, veřejných událostí, organizací, hmotných artefaktů, infrastruktury a dalších motivů v kořenové části kolekce `fotodokument`, jaké jsou jejich funkce tam, kde nejsou přímo doloženy čitelným nápisem, jaký je kontext průvodů, shromáždění a skupinových snímků, kdo jsou osoby na fotografiích, kdo fotografie pořídil nebo digitalizoval, jaká je provenience výběru a jaká práva se k souborům vztahují?
  known_facts:
  - Kořenová část `fotodokument` mimo podsložku `den po dešti` obsahuje v aktuálním Git snapshotu 41 JPEGů a technické soubory Thumbs.db a ZbThumbnail.info.
  - Všech 41 obsahových JPEGů v devíti dávkách bylo ověřeno proti kanonické Drive složce, velikostem a Git blobům v repozitáři; oba technické cache soubory byly v dávce 09 ověřeny stejným způsobem a samostatně technicky auditovány.
  - img343.jpg zachycuje viditelně poškozenou či zřícenou mostově působící konstrukci nad menším vodním tokem nebo příkopem. Přesná identita, lokalita, příčina stavu, datace a vztah k img206.jpg nebo img216.jpg nejsou určeny.
  - img343.jpg neobsahuje použitelná EXIF metadata.
  - Thumbs.db je technická OLE/Compound Document cache s odkazy na 54 různých názvů imgNNN.jpg a s vloženými JPEGovými obrazovými daty; 39 názvů odpovídá aktuálním kořenovým JPEGům a 15 názvů v aktuálním kořenovém Git snapshotu není. Tato skutečnost sama neprokazuje přesun či smazání souborů.
  - ZbThumbnail.info je technická binární cache s 41 různými odkazy imgNNN.jpg přesně odpovídajícími aktuálním 41 kořenovým JPEGům a se 41 přímo dekódovatelnými JPEGovými obrazovými proudy.
  - img201.jpg zobrazuje skupinu dospělých a dětí před větší budovou a dva koně zapřažené do vozu; úzký nápis nad vstupem není bezpečně čitelný.
  - img202.jpg zobrazuje skupinu před dřevěnou budovou s bezpečně čitelným nápisem „Českobudějovické akciové pivo“. Nápis je evidován jako textový údaj pramene a sám neurčuje přesnou provozovnu, provozovatele, lokalitu ani datum.
  - img203.jpg je barevný detail odznaku či znaku se stuhami. Bezpečně čitelné jsou texty „ČESKÝ ČL. SPOLEK“, „VLASTIMIL“ a „V RYCHVALDĚ 1893“.
  - Zkratka „ČL.“ na img203.jpg není rozepisována a rok 1893 není bez dalšího pramene vykládán jako datum výroby předmětu, datum události ani datum pořízení fotografie.
  - img206.jpg a img216.jpg zachycují mostově působící konstrukce se sutí či poškozením. Přesná identita, lokalita, důvod stavu, datace a vzájemný vztah snímků nejsou určeny.
  - V dřívějších dávkách byly přímo doloženy mimo jiné texty „STRANA NÁR. SOCIALISTICKÁ“, „RYCHVALD“, „1929“, „NÁRODNÍ ŠKOLA“, „Gastwirtschaft“, „SBĚRNA“, „KULTURNÍ DŮM“, dvojjazyčné obchodní nápisy a banner „VÝSTAVA 60 let školy V RYCHVALDĚ NA PODLESÍ“; přesné kontexty zůstávají tam, kde nejsou pramenem doloženy, otevřené.
  - Název složky a posloupnost imgNNN jsou archivní metadata a samy neprokazují lokalitu, autora ani historickou dataci.
