  question: Jaká je přesná lokalizace, datace, identita a původní funkce staveb v kořenové části kolekce `fotodokument`, kdo jsou osoby na skupinových
    snímcích, kdo fotografie pořídil nebo digitalizoval, jaká je provenience výběru a jaká práva se k souborům vztahují?
  known_facts:
  - Kořenová část `fotodokument` mimo podsložku `den po dešti` obsahuje v aktuálním Git snapshotu 41 JPEGů a technické soubory Thumbs.db a ZbThumbnail.info.
  - První dvě dávky zahrnují položky urbanek-fotodokument-root-001 až -010; všech deset zpracovaných raw souborů z kanonické Drive složky bylo
    ověřeno proti velikostem a Git blobům v repozitáři.
  - Mezi pěti soubory dávky 02 není přesná binární duplicita a žádný z nich neobsahuje použitelná EXIF metadata.
  - img044.jpg zobrazuje skupinu dospělých osob před budovou a banner s bezpečně čitelným textem „VÝSTAVA 60 let školy V RYCHVALDĚ NA PODLESÍ“;
    spodní část banneru není dostatečně čitelná pro spolehlivou dataci.
  - Viditelný banner je textový údaj pramene. Sám neprokazuje identitu osob, přesné datum snímku, přesnou identitu budovy ani úplné okolnosti
    události.
  - img042.jpg nese na fasádě znak a světlou tabulku, avšak text tabulky není bezpečně čitelný.
  - img045.jpg zobrazuje stavbu se zřetelně sakrální architekturou, ale přesný název, denominace, lokalita a datace nejsou z obrazu samotného
    určeny.
  - Název složky a posloupnost imgNNN jsou archivní metadata a samy neprokazují lokalitu, autora ani historickou dataci.
