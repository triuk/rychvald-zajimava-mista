  question: Jaká je přesná lokalizace, datace, identita a původní funkce staveb na kořenových fotografiích kolekce `fotodokument`, kdo snímky pořídil nebo digitalizoval, jaká je provenience výběru a jaká práva se k souborům vztahují?
  known_facts:
  - Kořenová část `fotodokument` mimo podsložku `den po dešti` obsahuje v aktuálním Git snapshotu 41 JPEGů a technické soubory Thumbs.db a ZbThumbnail.info.
  - První dávku tvoří img036.jpg až img040.jpg a všech pět raw souborů z kanonické Drive složky přesně odpovídá velikostem a Git blobům v repozitáři.
  - Všech pět položek první dávky zobrazuje exteriéry staveb a mezi pěti soubory není přesná binární duplicita.
  - Žádný z pěti JPEGů neobsahuje použitelná EXIF metadata; z této absence se neodvozuje datum originálu ani digitalizace.
  - Na snímcích není bezpečně čitelné označení, které by samo určovalo adresu, název objektu, funkci nebo datum.
  - Název složky a posloupnost imgNNN jsou archivní metadata a samy neprokazují lokalitu, autora ani historickou dataci.
