  question: Jaká je přesná lokalizace, datace a identita staveb a dalších architektonických objektů v kořenové části kolekce `fotodokument`, jaké jsou jejich funkce tam, kde nejsou přímo doloženy čitelným nápisem, kdo jsou osoby na skupinových a dalších snímcích, kdo fotografie pořídil nebo digitalizoval, jaká je provenience výběru a jaká práva se k souborům vztahují?
  known_facts:
  - Kořenová část `fotodokument` mimo podsložku `den po dešti` obsahuje v aktuálním Git snapshotu 41 JPEGů a technické soubory Thumbs.db a ZbThumbnail.info.
  - První tři dávky zahrnují položky urbanek-fotodokument-root-001 až -015; všech patnáct zpracovaných raw souborů z kanonické Drive složky bylo ověřeno proti velikostem a Git blobům v repozitáři.
  - Mezi pěti soubory dávky 03 není přesná binární duplicita a žádný z nich neobsahuje použitelná EXIF metadata.
  - img047.jpg nese bezpečně čitelné dvojjazyčné nápisy „OVOCE-ZELENINA / OWOCE-JARZYNY“ a „MLÉKÁRNA / MLECZARNIA“, české „POTRAVINY-LAHŮDKY“ a číslo 70; nečitelná polská řádka pod pravým nápisem není rekonstruována.
  - img050.jpg nese bezpečně čitelný nápis „KULTURNÍ DŮM“ a na jednom fasádním emblému písmena „ROH“. Nápis přímo dokládá označení/funkci budovy jako kulturního domu v okamžiku zachycení, nikoli přesnou lokalitu, oficiální instituci, provozovatele nebo datum.
  - img052.jpg zobrazuje bohatě zdobený průjezdní portál s reliéfní ornamentikou a figurální hlavou; přesná stavba, lokalita a datace nejsou z fotografie samotné určeny.
  - img044.jpg zobrazuje skupinu dospělých osob před budovou a banner s bezpečně čitelným textem „VÝSTAVA 60 let školy V RYCHVALDĚ NA PODLESÍ“; spodní část banneru není dostatečně čitelná pro spolehlivou dataci.
  - Název složky a posloupnost imgNNN jsou archivní metadata a samy neprokazují lokalitu, autora ani historickou dataci.
