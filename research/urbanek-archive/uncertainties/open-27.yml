  question: Jaká je přesná identita, lokalizace, historická datace a kontext obrazových materiálů ve složce `fotografie, které nebyl použité pro knihu ani kalendář`, včetně identity map, plánů, staveb, monumentů, veřejných událostí, technických či stavebních fragmentů, heraldických motivů a osob; jaký je vztah archivních názvů souborů a EXIF údajů k původu jednotlivých obrazů, kdo materiály pořídil nebo digitalizoval a jaká práva se k nim vztahují?
  known_facts:
  - Kolekce obsahuje v aktuálním Git snapshotu 28 obsahových souborů a jeden technický soubor Thumbs.db.
  - První dvě dávky zahrnují položky urbanek-unused-book-calendar-photographs-001 až -010; všech deset raw souborů z kanonické Drive složky bylo ověřeno proti velikostem a Git blobům v repozitáři.
  - 045.jpg je digitální reprodukce starší kreslené mapy; bezpečně čitelné jsou mimo jiné popisky „Mähren“ a „Oder Fluvius“. EXIF DateTimeOriginal `2010:12:13 05:58:19` je technické metadata reprodukce, nikoli historická datace mapy.
  - 093.JPG zobrazuje věž stavby se sakrální architekturou; EXIF uvádí Panasonic DMC-TZ3 a DateTimeOriginal `2010:10:27 15:22:13`. Přesná stavba, denominace a lokalita nejsou určeny.
  - 134.jpg zobrazuje hřbitov s centrálním kamenným křížem; EXIF uvádí Panasonic DMC-FZ7 a DateTimeOriginal `2009:11:02 14:10:36`. Přesný hřbitov a monument nejsou určeny.
  - 164.jpg zobrazuje početné venkovní shromáždění kolem hořící hranice z polen; EXIF uvádí výrobce Canon a DateTimeOriginal `2012:03:15 09:39:23`. Přesná událost, místo a osoby nejsou určeny.
  - 2011cIsenburgové z Birsteinu.jpg zobrazuje korunovaný heraldický štít s modrým středovým polem a žlutým lvem. Archivní název souboru obsahuje atribuci „Isenburgové z Birsteinu“, ale obraz samotný ji nezávisle nepotvrzuje.
  - 2061.JPG zobrazuje zděné schodiště do podzemního či suterénního prostoru; EXIF uvádí Canon EOS 400D DIGITAL a DateTimeOriginal `2012:01:16 08:41:32`. Přesná stavba, lokalita a funkce nejsou určeny.
  - 2063.JPG zobrazuje odlomené barevně upravené fragmenty s částečnými znaky; EXIF uvádí Canon EOS 400D DIGITAL a DateTimeOriginal `2012:01:16 08:59:13`. Materiál, původ, význam znaků, stáří a stavební kontext nejsou určeny.
  - 2069.jpg je reprodukce situačního plánu s bezpečně čitelným titulkem „Vodovod pro velkostatek v Rychvaldě.“, měřítkem `1:2880`, místními popisky „Heřmanice“ a „Rychvald“ a datací „Orlová, v červnu 1934.“. EXIF DateTimeOriginal je `2012:03:11 10:37:36`; viditelná datace plánu a digitální metadata jsou evidovány odděleně.
  - 209.jpg zobrazuje několik osob provádějících zemní práce kolem velkého zaobleného kamene; přesná činnost, účel kamene, událost, lokalita, datum a osoby nejsou určeny.
  - 327a.jpg je přesná binární duplicita dříve indexovaného `fotodokument/img041.jpg` (`urbanek-fotodokument-root-006`), se shodnou velikostí, Git blob SHA a SHA-256; obě archivní cesty zůstávají zachovány, ale nepředstavují dva nezávislé obrazové důkazy.
  - Žádný z prvních deseti souborů neobsahuje GPS údaje.
  - Archivní název složky a názvy souborů jsou evidovány jako archivní metadata, nikoli jako samostatný důkaz identity, data, lokality nebo předchozího publikačního využití.
