  question: Jaká je přesná identita, lokalizace, historická datace a kontext obrazových materiálů ve složce `fotografie, které nebyl použité pro knihu ani kalendář`, včetně identity map, plánů, staveb, školních a jiných institucí, monumentů, veřejných událostí, technických či stavebních fragmentů, hmotných artefaktů, nástěnných maleb, heraldických motivů, skupin a osob; jaký je vztah archivních názvů souborů, viditelných datací a EXIF údajů k původu jednotlivých obrazů, kdo materiály pořídil nebo digitalizoval a jaká práva se k nim vztahují?
  known_facts:
  - Kolekce je po šesti dávkách kompletně indexována: 28 obsahových souborů a technický soubor Thumbs.db; všech 29 raw souborů bylo ověřeno proti kanonické Drive složce, velikostem a Git blobům v repozitáři.
  - 045.jpg je digitální reprodukce starší kreslené mapy s čitelnými popisky „Mähren“ a „Oder Fluvius“; přesný titul, autor a historická datace mapy nejsou určeny. EXIF DateTimeOriginal `2010:12:13 05:58:19` je technické metadata reprodukce.
  - 093.JPG zobrazuje věž sakrálně působící stavby; EXIF Panasonic DMC-TZ3, DateTimeOriginal `2010:10:27 15:22:13`. Přesná stavba, denominace a lokalita nejsou určeny.
  - 134.jpg zobrazuje hřbitov s centrálním kamenným křížem; EXIF Panasonic DMC-FZ7, DateTimeOriginal `2009:11:02 14:10:36`. Přesný hřbitov a monument nejsou určeny.
  - 164.jpg zobrazuje početné venkovní shromáždění kolem hořící hranice z polen; EXIF DateTimeOriginal `2012:03:15 09:39:23`. Přesná událost, místo a osoby nejsou určeny.
  - 2011cIsenburgové z Birsteinu.jpg zobrazuje korunovaný heraldický štít; archivní název souboru obsahuje atribuci „Isenburgové z Birsteinu“, ale obraz samotný ji nezávisle nepotvrzuje.
  - 2061.JPG zobrazuje zděné schodiště do podzemního či suterénního prostoru; EXIF Canon EOS 400D DIGITAL, DateTimeOriginal `2012:01:16 08:41:32`. Přesná stavba, lokalita a funkce nejsou určeny.
  - 2063.JPG zobrazuje odlomené barevně upravené fragmenty s částečnými znaky; EXIF Canon EOS 400D DIGITAL, DateTimeOriginal `2012:01:16 08:59:13`. Materiál, původ, význam znaků, stáří a stavební kontext nejsou určeny.
  - 2069.jpg je reprodukce situačního plánu s titulkem „Vodovod pro velkostatek v Rychvaldě.“, měřítkem `1:2880`, popisky „Heřmanice“ a „Rychvald“ a datací „Orlová, v červnu 1934.“; EXIF DateTimeOriginal `2012:03:11 10:37:36` je evidován odděleně jako technické metadata digitální reprodukce.
  - 209.jpg zobrazuje několik osob při zemních pracích kolem velkého zaobleného kamene; přesná činnost, účel kamene, událost, lokalita, datum a osoby nejsou určeny.
  - 327a.jpg je přesná binární duplicita dříve indexovaného `fotodokument/img041.jpg` (`urbanek-fotodokument-root-006`); obě archivní cesty zůstávají zachovány, ale nepředstavují dva nezávislé obrazové důkazy.
  - 333.jpg zobrazuje starší přízemní budovu; přesná identita, funkce, vlastnictví, lokalita a datace nejsou určeny.
  - 367.jpg zobrazuje upravený obdélný venkovní areál s budovou v pozadí; přesný druh, účel, lokalita a datace nejsou určeny.
  - 369.jpg zobrazuje dřevěný dům se skupinou osob, vodní plochou nebo zaplavenou prohlubní a malým větrným kolem. Obsahuje obecný EXIF DateTime `2012:05:30 10:40:00` a `Adobe Photoshop 7.0 CE`, ale ne DateTimeOriginal.
  - Na 5005a.jpg je čitelné „Pětitřídní škola v Rychvaldě“. EXIF DateTimeOriginal `2012:03:15 16:52:47`; přesná škola, budova, osoby, ročník a historická datace nejsou určeny.
  - Na 5011b.jpg je čitelný zápis `1928/29`; bez dalšího pramene není automaticky považován za technicky ověřené datum expozice fotografie.
  - 5048.jpg zobrazuje rozsáhlý zemní odkryv či prohlubeň s budovami na horním okraji; přesný účel, lokalita a datace nejsou určeny.
  - 7147.jpg zobrazuje nízkou stavbu s krytým venkovním prostorem v prostředí stromů; EXIF Panasonic DMC-TZ3, DateTimeOriginal `2010:10:28 15:22:55`. Přesná funkce, název, vlastnictví a lokalita nejsou určeny.
  - 7185.JPG zobrazuje dva kamenné kruhové prvky s radiálními drážkami a středovými otvory; EXIF Panasonic DMC-TZ3, DateTimeOriginal `2011:11:15 12:20:52`. Přesná funkce, původ, stáří a kontext nejsou určeny.
  - 73.jpg, 74.tif a 75.tif zachycují poškozené malované vrstvy; 73.jpg má EXIF Canon PowerShot G5 a DateTimeOriginal `2005:08:04 09:02:04`, 74.tif a 75.tif jsou nekomprimované RGB TIFFy s rozlišením 600 dpi. Přesný námět, objekt, lokalita, autorství, datace a vzájemný vztah snímků nejsou určeny.
  - Na 8205.jpg jsou čitelné „STRANA NÁR. SOCIALISTICKÁ“, „RYCHVALD“ a `1929`; EXIF DateTimeOriginal `2012:04:17 11:42:56`. Osoby a přesný organizační a událostní kontext nejsou určeny.
  - Na 8206.jpg je čitelné `1910–1930` a z horního nápisu pouze závěr `… V RYCHVALDĚ`; celý nápis není rekonstruován. EXIF DateTimeOriginal `2012:04:23 10:06:03`.
  - P1020271aaaaddd.jpg zobrazuje architektonický detail s obloukovou nikou; z rytého nápisu je čitelné pouze `ANNO`. EXIF Panasonic DMC-TZ3, DateTimeOriginal `2012:11:20 12:05:04`.
  - ggg.tif zobrazuje rozsáhlou vícepodlažní budovu; obsahuje obecný DateTime `2010:11:26 09:44:21` a `Microsoft Windows Photo Gallery 6.0.6000.16386`, ale ne DateTimeOriginal.
  - img010aa.jpg je dekorativní koláž několika mužských portrétů s čitelným mottem `Bližnímu k ochraně, vlasti k oslavě!`; EXIF Canon, DateTimeOriginal `2013:06:28 09:55:14`. Přesná organizace, období původních portrétů a osoby nejsou určeny.
  - img037.jpg zobrazuje drobnou bílou sloupkovou sakrálně působící stavbu s červenou stříškou a křížovým prvkem u komunikace; přesný typ, zasvěcení, lokalita, stáří a historie nejsou určeny.
  - img724.jpg zobrazuje skupinu osob postupujících po komunikaci v řadách; přesný název a účel průvodu či události, organizace, lokalita, datum a osoby nejsou určeny.
  - Thumbs.db je auditovaná OLE/Compound Document cache s odkazy na všech 28 současných obsahových názvů kolekce a 28 datovými streamy s přímo dekódovanými JPEG náhledy; cache není další nezávislý historický obrazový pramen.
  - Žádný z obsahových souborů, u nichž byla GPS pole kontrolována, neobsahuje GPS údaje.
  - Archivní název složky a názvy souborů jsou evidovány jako archivní metadata, nikoli jako samostatný důkaz identity, data, lokality nebo předchozího publikačního využití.
