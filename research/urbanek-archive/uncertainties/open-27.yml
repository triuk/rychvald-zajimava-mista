  question: Jaká je přesná identita, lokalizace, historická datace a kontext obrazových materiálů ve složce `fotografie, které nebyl použité pro knihu ani kalendář`, včetně identity map, plánů, staveb, školních a jiných institucí, monumentů, veřejných událostí, technických či stavebních fragmentů, hmotných artefaktů, nástěnných maleb, heraldických motivů a osob; jaký je vztah archivních názvů souborů, viditelných datací a EXIF údajů k původu jednotlivých obrazů, kdo materiály pořídil nebo digitalizoval a jaká práva se k nim vztahují?
  known_facts:
  - Kolekce obsahuje v aktuálním Git snapshotu 28 obsahových souborů a jeden technický soubor Thumbs.db.
  - Prvních pět dávek zahrnuje položky urbanek-unused-book-calendar-photographs-001 až -025; všech 25 raw souborů z kanonické Drive složky bylo ověřeno proti velikostem a Git blobům v repozitáři.
  - 045.jpg je digitální reprodukce starší kreslené mapy; bezpečně čitelné jsou mimo jiné popisky „Mähren“ a „Oder Fluvius“. EXIF DateTimeOriginal `2010:12:13 05:58:19` je technické metadata reprodukce, nikoli historická datace mapy.
  - 093.JPG zobrazuje věž stavby se sakrální architekturou; EXIF uvádí Panasonic DMC-TZ3 a DateTimeOriginal `2010:10:27 15:22:13`. Přesná stavba, denominace a lokalita nejsou určeny.
  - 134.jpg zobrazuje hřbitov s centrálním kamenným křížem; EXIF uvádí Panasonic DMC-FZ7 a DateTimeOriginal `2009:11:02 14:10:36`. Přesný hřbitov a monument nejsou určeny.
  - 164.jpg zobrazuje početné venkovní shromáždění kolem hořící hranice z polen; EXIF DateTimeOriginal je `2012:03:15 09:39:23`. Přesná událost, místo a osoby nejsou určeny.
  - 2011cIsenburgové z Birsteinu.jpg zobrazuje korunovaný heraldický štít; archivní název souboru obsahuje atribuci „Isenburgové z Birsteinu“, ale obraz samotný ji nezávisle nepotvrzuje.
  - 2061.JPG zobrazuje zděné schodiště do podzemního či suterénního prostoru; EXIF uvádí Canon EOS 400D DIGITAL a DateTimeOriginal `2012:01:16 08:41:32`. Přesná stavba, lokalita a funkce nejsou určeny.
  - 2063.JPG zobrazuje odlomené barevně upravené fragmenty s částečnými znaky; EXIF uvádí Canon EOS 400D DIGITAL a DateTimeOriginal `2012:01:16 08:59:13`. Materiál, původ, význam znaků, stáří a stavební kontext nejsou určeny.
  - 2069.jpg je reprodukce situačního plánu s titulkem „Vodovod pro velkostatek v Rychvaldě.“, měřítkem `1:2880`, popisky „Heřmanice“ a „Rychvald“ a datací „Orlová, v červnu 1934.“. EXIF DateTimeOriginal `2012:03:11 10:37:36` je evidován odděleně jako technické metadata digitální reprodukce.
  - 209.jpg zobrazuje několik osob provádějících zemní práce kolem velkého zaobleného kamene; přesná činnost, účel kamene, událost, lokalita, datum a osoby nejsou určeny.
  - 327a.jpg je přesná binární duplicita dříve indexovaného `fotodokument/img041.jpg` (`urbanek-fotodokument-root-006`), se shodnou velikostí, Git blob SHA a SHA-256; obě archivní cesty zůstávají zachovány, ale nepředstavují dva nezávislé obrazové důkazy.
  - 333.jpg zobrazuje starší přízemní budovu se sedlovou střechou, plotem a stromy; přesná identita, funkce, vlastnictví, lokalita a datace nejsou určeny.
  - 367.jpg zobrazuje upravený obdélný venkovní areál s cestami, stromy a budovou v pozadí; přesný druh a účel areálu, budova, lokalita a datace nejsou určeny.
  - 369.jpg zobrazuje dřevěný dům se skupinou osob, vodní plochou nebo zaplavenou prohlubní a malým větrným kolem. Obsahuje obecný EXIF DateTime `2012:05:30 10:40:00` a údaj `Adobe Photoshop 7.0 CE`, ale ne DateTimeOriginal.
  - Na 5005a.jpg je bezpečně čitelné „Pětitřídní škola v Rychvaldě“. EXIF DateTimeOriginal je `2012:03:15 16:52:47`; přesná škola, budova, osoby, ročník a historická datace nejsou určeny.
  - Na 5011b.jpg je bezpečně čitelný zápis `1928/29`; bez dalšího pramene není automaticky považován za technicky ověřené datum expozice fotografie.
  - 5048.jpg zobrazuje rozsáhlý zemní odkryv či prohlubeň s budovami na horním okraji; přesný účel zásahu, lokalita, budovy a datace nejsou určeny.
  - 7147.jpg zobrazuje nízkou stavbu s krytým venkovním prostorem v prostředí stromů. EXIF uvádí Panasonic DMC-TZ3 a DateTimeOriginal `2010:10:28 15:22:55`; přesná funkce, název, vlastnictví a lokalita nejsou určeny.
  - 7185.JPG zobrazuje dva kamenné kruhové prvky s radiálními drážkami a středovými otvory. EXIF uvádí Panasonic DMC-TZ3 a DateTimeOriginal `2011:11:15 12:20:52`; přesná funkce, původ, stáří a kontext nejsou určeny.
  - 73.jpg zobrazuje poškozenou malovanou vrstvu na omítce či zdivu. EXIF uvádí Canon PowerShot G5 a DateTimeOriginal `2005:08:04 09:02:04`; přesný námět, objekt, lokalita, autorství a historická datace malby nejsou určeny.
  - 74.tif je nekomprimovaný RGB TIFF 3463×3479 px s uloženým rozlišením 600 dpi. Zobrazuje fragment poškozené nástěnné malby s lidskou postavou; vztah k 73.jpg není bez dalšího podkladu tvrzen.
  - 75.tif je nekomprimovaný RGB TIFF 3507×3507 px s uloženým rozlišením 600 dpi. Zobrazuje fragment poškozené nástěnné malby s koňským povozem a architekturou; přesný vztah k 73.jpg a 74.tif není určen.
  - Na 8205.jpg jsou bezpečně čitelné „STRANA NÁR. SOCIALISTICKÁ“, „RYCHVALD“ a rok `1929`. EXIF DateTimeOriginal je `2012:04:17 11:42:56`; osoby a přesný organizační a událostní kontext nejsou určeny.
  - Na 8206.jpg je bezpečně čitelné `1910–1930` a z horního organizačního nápisu pouze závěr `… V RYCHVALDĚ`; celý nápis se nerekonstruuje. EXIF DateTimeOriginal je `2012:04:23 10:06:03`.
  - P1020271aaaaddd.jpg zobrazuje architektonický detail s obloukovou nikou; z rytého nápisu je bezpečně čitelné pouze `ANNO`. EXIF uvádí Panasonic DMC-TZ3 a DateTimeOriginal `2012:11:20 12:05:04`.
  - ggg.tif zobrazuje rozsáhlou podlouhlou vícepodlažní budovu s mnoha okny a valbovou střechou. Obsahuje obecný DateTime `2010:11:26 09:44:21` a software `Microsoft Windows Photo Gallery 6.0.6000.16386`, ale ne DateTimeOriginal.
  - Žádný z prvních 25 souborů neobsahuje GPS údaje.
  - Archivní název složky a názvy souborů jsou evidovány jako archivní metadata, nikoli jako samostatný důkaz identity, data, lokality nebo předchozího publikačního využití.
