- id: URB-U-0086
  status: open
  priority: high
  collection: novinové články 1903 - 1925
  type: missing_full_originals_proven_by_thumbnail_caches
  source_items:
  - urbanek-newspaper-articles-1903-1925-017
  - urbanek-newspaper-articles-1903-1925-018
  question: Kde jsou plné originály obrazových souborů doložených technickými cache `Thumbs.db` a `ZbThumbnail.info`, ale nepřítomných jako samostatné soubory v aktuální kolekci; lze dohledat jejich původní plné rozlišení, provenienci a vztah k dochovaným novinovým reprodukcím?
  known_facts:
  - Thumbs.db je OLE/Compound Document a jeho Catalog stream obsahuje 34 `.jpg` filename records plus one GUID-like special record; všech 35 thumbnail data streams contain directly decodable JPEG data.
  - Všech 16 současných samostatných JPEG názvů kolekce je v katalogu Thumbs.db zastoupeno.
  - Osmnáct katalogových názvů nemá v aktuální složce samostatný plný soubor: `img965.jpg`, `img963.jpg`, `img964.jpg`, `img967.jpg`, `img968.jpg`, `img969.jpg`, `aaaa.jpg`, `img968aaaaa.jpg`, `img971aaaaa.jpg`, `img972aaa.jpg`, `img976aa.jpg`, `img983aaa.jpg`, `img988.jpg`, `img989aaa.jpg`, `img997.jpg`, `img999.jpg`, `img961.jpg`, `img962.jpg`.
  - Šest chybějících názvů má pixelově identický thumbnail s dochovaným samostatným JPEGem: `aaaa.jpg` ↔ `img984.jpg`, `img971aaaaa.jpg` ↔ `img971.jpg`, `img972aaa.jpg` ↔ `img972.jpg`, `img976aa.jpg` ↔ `img976.jpg`, `img983aaa.jpg` ↔ `img983.jpg`, `img989aaa.jpg` ↔ `img989.jpg`; tyto náhledy tedy nepředstavují další chybějící obrazový obsah.
  - Mezi zbývajícími chybějícími názvy jsou tři pixelově identické thumbnail páry: `img963.jpg` ↔ `img997.jpg`, `img968.jpg` ↔ `img968aaaaa.jpg`, `img961.jpg` ↔ `img962.jpg`.
  - Po zohlednění těchto shod dokládá Thumbs.db 9 odlišných thumbnail obrazových obsahů, pro které v aktuální složce není samostatný plný obrazový soubor.
  - ZbThumbnail.info začíná magic bytes `zbex` a obsahuje 26 unikátních `.jpg` filename references: všech 16 současných názvů a deset názvů bez plného souboru (`img962.jpg`, `img963.jpg`, `img964.jpg`, `img965.jpg`, `img967.jpg`, `img968.jpg`, `img969.jpg`, `img988.jpg`, `img997.jpg`, `img999.jpg`). Těchto deset referencí nezávisle pokrývá stejných 9 odlišných chybějících thumbnail obsahů, protože thumbnails `img963.jpg` a `img997.jpg` jsou shodné.
  - ZbThumbnail.info obsahuje 26 JFIF start signatures; 20 se při přímém dekódování od markeru načte jako samostatný JPEG, šest se touto metodou samostatně nenačte. Silnější tvrzení o počtu plných vložených JPEGů se proto nezapisuje.
  - Dne 2026-08-11 byly v aktuálně připojeném Google Drive samostatně vyhledány všechny názvové varianty reprezentující devět odlišných chybějících obsahů (`img965.jpg`, `img963.jpg`, `img997.jpg`, `img964.jpg`, `img967.jpg`, `img968.jpg`, `img968aaaaa.jpg`, `img969.jpg`, `img988.jpg`, `img999.jpg`, `img961.jpg`, `img962.jpg`); žádný exact-name soubor nebyl nalezen.
