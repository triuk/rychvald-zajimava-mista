  question: Jaká je přesná identita, lokalizace, historická datace a kontext obrazových materiálů ve složce `popopo`, včetně osob, událostí, staveb, provozoven, škol, památníků, rukopisných a publikovaných pramenů; jaký je vztah archivních názvů a viditelných nápisů k původu obrazů, kdo materiály pořídil nebo digitalizoval a jaká práva se k nim vztahují?
  known_facts:
  - Po dávce 06 je ověřeno a indexováno 30 z 31 obsahových položek; technické cache ještě nejsou auditovány.
  - Detailní přímo ověřené popisy položek 001–025 jsou zachovány v dávkách 01–05 a příslušných source indexech.
  - img178a.jpg obsahuje `STRANA NÁR. SOCIALISTICKÁ`, `RYCHVALD` a `1929`; s dříve indexovaným 8205.jpg sdílí bannerový motiv a generic EXIF DateTime `2012:04:17 11:42:56`, ale binární identita ani processing history nejsou doloženy.
  - img267.jpg zachycuje dvě vícepodlažní budovy u komunikace; přesná adresa a funkce nejsou určeny.
  - img678.jpg je reprodukce starší fotografie zástavby za poli či zahradami; lokalita a datum nejsou určeny.
  - img691.jpg má tištěný popisek, který zobrazeného muže označuje jako Warrant Officer Fridolína Gemroda (RO) a uvádí léto 1944, Mosquito NF Mk.XVII (WM-G) a Castle Camps. Jde o tvrzení popisku, nikoli nezávisle ověřenou biografii.
  - img698a.jpg obsahuje text k 20letému jubileu II. odboru Slezské Matice osvěty lidové v Rychvaldě a `1910–1930`; s dříve indexovaným 8206.jpg sdílí rozměry, generic EXIF DateTime `2012:04:23 10:06:03` a korespondující skupinový motiv, ale přesný vztah není určen.
