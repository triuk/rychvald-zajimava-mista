  question: Jaká je přesná identita, lokalizace, historická datace a kontext obrazových materiálů ve složce `popopo`, včetně osob, událostí, staveb, provozoven, škol, památníků a rukopisných pramenů; jaký je vztah archivních názvů a viditelných nápisů k původu obrazů, kdo materiály pořídil nebo digitalizoval a jaká práva se k nim vztahují?
  known_facts:
  - Po dávce 05 je ověřeno a indexováno prvních 25 z 31 obsahových položek; technické cache ještě nejsou auditovány.
  - Detailní přímo ověřené popisy položek 001–020 jsou zachovány v dávkách 01–04 a příslušných source indexech.
  - P1010764.JPG zobrazuje památník s čitelnými nápisy `PAMÁTCE OBĚTEM NĚMECKÉ PERSEKUCE 1939–1945`, `PADLÝM BRATŘÍM 1914–1918`, `VAŠÍ PAMÁTCE VĚRNI ZŮSTANEME!` a viditelným `1948`; historická a biografická tvrzení nápisu nejsou zatím nezávisle ověřena.
  - P1010765a.jpg je reprodukce historické fotografie otevřeného dřevěného altánu; lokalita, funkce a datum nejsou určeny.
  - P1010791.JPG a P1010791a.jpg jsou dvě různě zpracované reprezentace stejné rukopisné stránky `-272-`; geometrie a text jsou shodné, soubory nejsou binárně totožné. Viditelné jsou mimo jiné `1. IX. 1912`, `170 dětí` a `40.000 K`.
  - img129.jpg je historická fotografie nízké budovy se strmou střechou a dvěma komíny; přesná identita, lokalita a datum nejsou určeny.
  - U čtyř souborů dávky 05 je pouze obecný EXIF DateTime z 22.–23. dubna 2012, nikoli DateTimeOriginal; img129.jpg EXIF nemá. Žádný soubor dávky 05 nemá GPS.
