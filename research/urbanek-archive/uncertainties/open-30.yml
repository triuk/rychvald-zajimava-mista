  question: Jaká je přesná identita, lokalizace, historická datace a kontext obrazových materiálů ve složce `popopo`, včetně zobrazených osob, veřejných událostí, staveb, provozoven, škol a dalších institucí; jaký je vztah archivních názvů a viditelných nápisů k původu obrazů, kdo materiály pořídil nebo digitalizoval a jaká práva se k nim vztahují?
  known_facts:
  - Kolekce má 31 obsahových JPEGů a technické soubory Thumbs.db a ZbThumbnail.info; po dávce 04 je ověřeno a indexováno prvních 20 obsahových položek.
  - Dávky 01–03 dokumentují historické reprodukce, portrét s archivním jménem, školní koláž, několik staveb, klenuté interiéry, stromořadí a krucifix; jejich přesná identita a lokalizace zůstává otevřená.
  - P1010748a.jpg zachycuje tentýž krucifix jako P1010747a.jpg; vztah je doložen přímou obrazovou korespondencí. Čitelné je `I.N.R.I.`.
  - P1010749.JPG zobrazuje výrazný starý listnatý strom u komunikace a elektrického vedení; přesná lokalita, druh, stáří a případný památkový status nejsou určeny.
  - P1010752.JPG zobrazuje okraj zástavby s několika vzrostlými stromy a budovami; přesná lokalita, identity staveb a význam stromů nejsou určeny.
  - P1010754.JPG zobrazuje větší budovu s restauračními nápisy a pamětní deskou; bezpečně čitelné jsou `RESTAURACE`, `PENZION` a `PIVNICE`. Přesná adresa a úplný obchodní název nejsou doplňovány.
  - P1010755a.jpg je přímo doložený detail pamětní desky na budově z P1010754.JPG. Čitelné jsou `PAMÁTCE RODINY EICHENBAUMŮ`, `V TÉTO BUDOVĚ`, `19. LISTOPADU 1905`, `BYL ZALOŽEN`, `SOKOL RYCHVALD` a `1949`. Historické tvrzení pamětní desky není v této fázi považováno za nezávisle ověřené.
  - Všech pět položek dávky 04 uvádí Panasonic DMC-TZ3 a pouze obecný EXIF DateTime, nikoli DateTimeOriginal; hodnoty jsou od 10. do 17. dubna 2012. Žádný soubor nemá GPS. Tyto údaje nejsou používány jako historická datace.
