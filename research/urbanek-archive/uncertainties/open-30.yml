  question: Jaká je přesná identita, lokalizace, historická datace a kontext obrazových materiálů ve složce `popopo`, včetně zobrazených osob, veřejných událostí, staveb, provozoven, škol a dalších institucí; jaký je vztah archivních názvů a viditelných nápisů k původu obrazů, kdo materiály pořídil nebo digitalizoval a jaká práva se k nim vztahují?
  known_facts:
  - Kolekce má v aktuálním snapshotu 31 obsahových JPEGů a technické soubory Thumbs.db a ZbThumbnail.info.
  - Po dávce 03 je ověřeno a indexováno prvních 15 obsahových položek; všechny raw soubory přesně odpovídají kanonickým Drive souborům, velikostem a Git blobům.
  - Dávky 01–02 dokumentují historické reprodukce, portrét s archivním jménem, školní koláž, několik staveb a klenutý interiér; jejich přesná identita a lokalizace zůstává otevřená.
  - P1010741.JPG zobrazuje rozsáhlý neomítnutý cihelný klenutý interiér s více klenbami a otvory; přesná funkce, objekt, lokalita a vztah k jiným interiérům nejsou určeny.
  - P1010743a.jpg zobrazuje světlý klenutý interiér se zděným topeništěm či pecí a masivní dřevěnou konstrukcí; přesná funkce a vztah k ostatním interiérům nejsou určeny.
  - P1010744.JPG a P1010746.JPG zachycují stromořadí podél asfaltových komunikací mezi otevřenými plochami či poli. Ani podobnost motivu ani blízké EXIF časy nejsou používány jako důkaz stejné trasy.
  - P1010747a.jpg zobrazuje venkovní dřevěný krucifix s korpusem a obloukovou stříškou; bezpečně čitelné je `I.N.R.I.`. Přesná lokalita, stáří, autorství a historie objektu nejsou určeny.
  - Všech pět položek dávky 03 má Panasonic DMC-TZ3 a DateTimeOriginal dne 10. dubna 2012 od 12:12:30 do 12:38:09. Žádná nemá GPS. Tyto časy jsou technická metadata digitálních snímků, nikoli důkaz identity, společné lokality nebo stáří objektů.
