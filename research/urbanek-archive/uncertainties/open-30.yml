  question: Jaká je přesná identita, lokalizace, historická datace a kontext obrazových materiálů ve složce `popopo`, včetně osob, událostí, staveb, provozoven, škol, památníků, rukopisných a publikovaných pramenů; jaký je vztah archivních názvů a viditelných nápisů k původu obrazů, kdo materiály pořídil nebo digitalizoval a jaká práva se k nim vztahují?
  known_facts:
  - Všech 31 obsahových JPEGů kolekce bylo v dávkách 01–07 raw ověřeno proti kanonickému Drive souboru a Git blobu a prošlo prvním vizuálním či textovým popisem.
  - Detailní přímo ověřené popisy položek 001–030 jsou zachovány v dávkách 01–06 a příslušných source indexech.
  - mlyn_0001a.jpg zobrazuje digitální reprodukci archivní fotografie většího vícečástného stavebního komplexu mezi vegetací. Archivní filename sám nedokládá, že jde o mlýn.
  - mlyn_0001a.jpg má Canon MP610 series, software MP Navigator EX 1.0 a generic EXIF DateTime `2012:04:18 09:02:04`; DateTimeOriginal a GPS chybějí. Údaj je technické metadata reprodukce, nikoli historické datum objektu.
  - Přímé porovnání cache thumbnailu `mlyn_0001.jpg` a dochovaného `mlyn_0001a.jpg` dokládá stejný podkladový obraz; přesná historie úprav a původ plného originálu `mlyn_0001.jpg` je řešena v navazující cache nejistotě URB-U-0088.
