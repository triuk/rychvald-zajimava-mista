resolution_semantics:
  - Source-visible facts, archival attribution, later secondary interpretation and inference must remain distinguishable.
  - An archival filename or folder label is evidence of archival attribution only unless independently corroborated.
  - Persons are never identified solely from facial appearance; uniforms, weapons and poses are not sufficient to establish unit, nationality, rank or identity.
  - During an open research checkpoint, safely resolved subattributes may be recorded under `partially_resolved_attributes` while material unknowns remain explicit.
  - Before closing an item whose original question still contains material unresolved attributes, either resolve them or decompose them into a linked open item so no uncertainty is silently lost.
  - Negative search results narrow the search path but do not by themselves resolve a historical attribute.
  - Exact binary duplicates are separate inventory items but one independent piece of image evidence.
