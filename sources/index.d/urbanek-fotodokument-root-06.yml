  summary: Černobílý pohled ulicí při veřejném shromáždění či očekávání průvodu. Po obou stranách komunikace stojí početný
    dav; na budovách a podél ulice jsou vlajky, přičemž na nejméně dvou jsou zřetelně viditelné symboly srpu a kladiva. Vpravo
    je směrová tabule s číslem „5“ a jen částečně čitelným místním názvem začínajícím „OSTR…“; celý název není bezpečně přepsán.
